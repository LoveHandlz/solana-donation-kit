<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>$SKATE REWARDS | THE SKATEPARK</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Bangers&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050a1a;
            --bg-panel: rgba(15, 26, 71, 0.95);
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
            --card-border: rgba(0, 240, 255, 0.2);
            --rarity-common: #94a3b8; --rarity-uncommon: #00ffaa; --rarity-rare: #2196f3; --rarity-mythic: #a855f7; --rarity-legendary: var(--accent-gold); --rarity-epic: #d946ef;          
        }

        body { background-color: var(--bg-deep); color: #fff; font-family: 'Inter', sans-serif; margin: 0; background-image: radial-gradient(circle at 50% 50%, #162a5e 0%, #050a1a 100%); background-attachment: fixed; }
        header { background: rgba(0, 0, 0, 0.9); padding: 15px 40px; display: flex; justify-content: center; position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(10px); border-bottom: 2px solid var(--accent-cyan); }
        .header-inner { width: 100%; max-width: 1400px; display: flex; justify-content: space-between; align-items: center; }
        nav ul { display: flex; list-style: none; gap: 20px; margin: 0; padding: 0; }
        nav a { color: #888; text-decoration: none; font-family: 'Orbitron'; font-size: 0.75rem; font-weight: 900; letter-spacing: 2px; padding-bottom: 5px; transition: 0.2s; }
        nav a.active { color: var(--accent-cyan); text-shadow: 0 0 8px var(--accent-cyan); border-bottom: 2px solid var(--accent-cyan); }
        .balance-pill { background: rgba(0, 240, 255, 0.05); border: 1px solid var(--accent-cyan); padding: 6px 15px; border-radius: 50px; font-family: 'Orbitron'; font-size: 0.65rem; }
        .balance-pill span { color: var(--accent-gold); font-weight: 900; }
        
        .dashboard-wrapper { padding: 40px; max-width: 1400px; margin: auto; min-height: 70vh; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .skate-card { background: var(--bg-panel); border: 1px solid var(--card-border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .rarity-header { padding: 8px; font-weight: 900; font-size: 0.7rem; color: #000; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
        .mint-badge { background: rgba(0,0,0,0.6); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.55rem; }
        .img-wrap { width: 100%; height: 200px; display: flex; justify-content: center; align-items: center; background: #000; }
        .skate-img { max-height: 85%; max-width: 85%; object-fit: contain; }
        
        .stat-bar-container { width: 100%; height: 6px; background: #111; border: 1px solid #333; border-radius: 3px; margin-top: 3px; overflow: hidden; }
        .stat-bar { height: 100%; transition: width 0.5s ease-out; }
        .stat-pop { background: linear-gradient(90deg, #ff0055, #ff55aa); }
        .stat-balance { background: linear-gradient(90deg, #aa00ff, #e066ff); }
        .stat-speed { background: linear-gradient(90deg, #00aaff, #00ffff); }
        .stat-total { background: linear-gradient(90deg, #ffaa00, #ffff00); }

        .wallet-btn { background: var(--accent-cyan); color: #000; border: none; padding: 10px 20px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%); transition: 0.2s; }
        .wallet-btn:hover { background: #fff; }
        .wallet-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

        .crafting-container { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; background: rgba(0,0,0,0.5); padding: 30px; border-radius: 12px; border: 1px solid var(--accent-cyan); }
        .craft-slot { background: rgba(0,240,255,0.05); border: 1px solid var(--card-border); padding: 15px; border-radius: 8px; margin-bottom: 10px; }
        .craft-slot h4 { margin: 0 0 10px 0; color: var(--accent-cyan); font-family: 'Orbitron'; font-size: 0.8rem; text-transform: uppercase; }
        .craft-slot select { width: 100%; padding: 10px; background: #000; color: #fff; border: 1px solid #333; font-size: 0.8rem; margin-bottom: 5px; outline: none; }
        .projected-stats { background: #000; padding: 25px; border-radius: 8px; border: 1px solid var(--accent-gold); display: flex; flex-direction: column; justify-content: space-between; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: var(--bg-panel); padding: 40px; border-radius: 15px; border: 2px solid var(--accent-cyan); text-align: center; max-width: 450px; }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <img src="https://i.postimg.cc/VSvxfXsr/sk8coin-logo-biig.png" height="45" onclick="location.reload()" style="cursor:pointer;">
        <nav>
            <ul>
                <li><a href="#" onclick="switchCategory('skateboards')" id="nav-skateboards" class="active">SKATEBOARDS</a></li>
                <li><a href="#" onclick="switchCategory('decks')" id="nav-decks">DECKS</a></li>
                <li><a href="#" onclick="switchCategory('wheels')" id="nav-wheels">WHEELS</a></li>
                <li><a href="#" onclick="switchCategory('trucks')" id="nav-trucks">TRUCKS</a></li>
                <li><a href="#" onclick="switchCategory('builder')" id="nav-builder" style="color:var(--accent-gold);">SKATEBOARD BUILDER</a></li>
            </ul>
        </nav>
        <div class="header-controls">
            <div id="wallet-balances" class="balance-pill" style="display: none;">WAX: <span id="wax-bal">0.00</span></div>
            <button id="connect-btn" class="wallet-btn" onclick="toggleAuthModal()">CONNECT</button>
        </div>
    </div>
</header>

<div class="dashboard-wrapper">
    <div class="dashboard-grid" id="main-grid">
        <h3 style="grid-column: 1/-1; text-align: center; color: var(--accent-cyan); font-family: 'Orbitron';">CONNECT WALLET TO OPEN TRUNK</h3>
    </div>

    <div id="crafting-bench" class="crafting-container" style="display: none;">
        <div class="crafting-selectors">
            <div class="craft-slot">
                <h4>1. Establish Deck</h4>
                <select id="craft-deck-select" onchange="updateCraftingStats()"><option value="">-- SELECT DECK --</option></select>
            </div>
            <div class="craft-slot">
                <h4>2. Establish Truck Set</h4>
                <select id="craft-truck1-select" onchange="updateCraftingStats()"><option value="">-- FRONT TRUCK --</option></select>
                <select id="craft-truck2-select" onchange="updateCraftingStats()"><option value="">-- BACK TRUCK --</option></select>
            </div>
            <div class="craft-slot">
                <h4>3. Establish Wheel Set</h4>
                <select id="craft-wheel1-select" onchange="updateCraftingStats()"><option value="">-- WHEEL 1 --</option></select>
                <select id="craft-wheel2-select" onchange="updateCraftingStats()"><option value="">-- WHEEL 2 --</option></select>
                <select id="craft-wheel3-select" onchange="updateCraftingStats()"><option value="">-- WHEEL 3 --</option></select>
                <select id="craft-wheel4-select" onchange="updateCraftingStats()" style="margin-bottom:0;"><option value="">-- WHEEL 4 --</option></select>
            </div>
        </div>
        
        <div class="projected-stats">
            <div>
                <h3 style="color: var(--accent-gold); font-family: 'Bangers'; font-size: 1.8rem; margin: 0 0 20px 0; letter-spacing: 2px;">INTEGRATED BUILD</h3>
                <div id="craft-stats-hud">
                    <div style="text-align:center; color:#555; font-family:'Orbitron'; font-size: 0.7rem; padding: 40px 0;">SELECT ALL 7 COMPONENTS<br>FOR TRUTH CALCULATION</div>
                </div>
            </div>
            <button id="initiate-blend-btn" class="wallet-btn" style="width: 100%; padding: 20px; background: var(--accent-gold);" disabled onclick="executeBlend()">CRAFT SKATEBOARD</button>
        </div>
    </div>
</div>

<div id="onboarding-modal" class="modal-overlay">
    <div class="modal-content">
        <h2 style="font-family:'Orbitron'; color:var(--accent-cyan);">SYNC WALLET</h2>
        <button class="wallet-btn" id="login-trigger" style="width: 100%; margin-top: 20px;">CLOUD WALLET</button>
    </div>
</div>

<script type="module">
    import { SessionKit } from 'https://esm.sh/@wharfkit/session?bundle';
    import { WebRenderer } from 'https://esm.sh/@wharfkit/web-renderer?bundle';
    import { WalletPluginCloudWallet } from 'https://esm.sh/@wharfkit/wallet-plugin-cloudwallet?bundle';

    const ATOMIC_API = "https://wax.api.atomicassets.io/atomicassets/v1";
    const COLLECTION = "skatecoinwax";
    const WAX_RPC = "https://wax.greymass.com";

    const sessionKit = new SessionKit({
        appName: 'SkateparkV1.17.0',
        chains: [{ id: '1064487b3cd1a897ce03ae5b6a865651747e2e152090f99c1d19d44e01aea5a4', url: WAX_RPC }],
        ui: new WebRenderer(),
        walletPlugins: [ new WalletPluginCloudWallet() ]
    });

    let currentSession = null, currentSchema = 'skateboards';

    sessionKit.restore().then(s => { if (s) { currentSession = s; document.getElementById('connect-btn').innerText = s.actor.toString().toUpperCase(); updateBalances(s.actor.toString()); switchCategory(currentSchema); } });

    window.switchCategory = (schema) => {
        currentSchema = schema;
        document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
        document.getElementById(`nav-${schema}`).classList.add('active');
        if (schema === 'builder') {
            document.getElementById('main-grid').style.display = 'none';
            document.getElementById('crafting-bench').style.display = 'grid';
            if (currentSession) loadCraftingData(currentSession.actor.toString());
        } else {
            document.getElementById('crafting-bench').style.display = 'none';
            document.getElementById('main-grid').style.display = 'grid';
            if (currentSession) fetchInventory(currentSession.actor.toString());
        }
    };

    async function updateBalances(user) {
        try {
            const waxRes = await fetch(`${WAX_RPC}/v1/chain/get_currency_balance`, { method: 'POST', body: JSON.stringify({ code: "eosio.token", account: user, symbol: "WAX" }) });
            const waxBal = await waxRes.json(); document.getElementById('wax-bal').innerText = waxBal[0] || "0.00";
            document.getElementById('wallet-balances').style.display = 'flex';
        } catch (e) {}
    }

    const renderStat = (label, value, cssClass, max = 20) => {
        const num = parseInt(value) || 0, pct = Math.min((num / max) * 100, 100); 
        return `<div style="margin-bottom: 8px;"><div style="display: flex; justify-content: space-between; font-family: 'Orbitron'; font-size: 0.55rem; color: #888;">${label} <span style="color: #fff;">${num}/${max}</span></div><div class="stat-bar-container"><div class="stat-bar ${cssClass}" style="width: ${pct}%"></div></div></div>`;
    };

    window.updateCraftingStats = () => {
        const d = document.getElementById('craft-deck-select').selectedOptions[0], t1 = document.getElementById('craft-truck1-select').selectedOptions[0], t2 = document.getElementById('craft-truck2-select').selectedOptions[0];
        const w1 = document.getElementById('craft-wheel1-select').selectedOptions[0], w2 = document.getElementById('craft-wheel2-select').selectedOptions[0], w3 = document.getElementById('craft-wheel3-select').selectedOptions[0], w4 = document.getElementById('craft-wheel4-select').selectedOptions[0];

        if (d.value && t1.value && t2.value && w1.value && w2.value && w3.value && w4.value) {
            
            const calcPillarLogic = (attr) => {
                const deck = parseInt(d.dataset[attr]) || 0;
                const truckSet = Math.round(((parseInt(t1.dataset[attr]) || 0) + (parseInt(t2.dataset[attr]) || 0)) / 2);
                const wheelSet = Math.round(((parseInt(w1.dataset[attr]) || 0) + (parseInt(w2.dataset[attr]) || 0) + (parseInt(w3.dataset[attr]) || 0) + (parseInt(w4.dataset[attr]) || 0)) / 4);
                return Math.round((deck + truckSet + wheelSet) / 3);
            };

            const tPop = calcPillarLogic('pop'), tSpeed = calcPillarLogic('speed'), tBal = calcPillarLogic('bal');
            const totalPower = tPop + tSpeed + tBal;

            document.getElementById('craft-stats-hud').innerHTML = `
                ${renderStat('INTEGRATED POP', tPop, 'stat-pop', 20)}
                ${renderStat('INTEGRATED BALANCE', tBal, 'stat-balance', 20)}
                ${renderStat('INTEGRATED SPEED', tSpeed, 'stat-speed', 20)}
                <div style="margin-top:15px; border-top:1px dashed #333; padding-top:15px;">
                    ${renderStat('TOTAL BUILD POWER', totalPower, 'stat-total', 60)}
                </div>
                <div style="margin-top:20px; padding:15px; background:rgba(0,240,255,0.05); border:1px solid var(--accent-cyan); border-radius:6px; text-align:center;">
                    <div style="color:var(--accent-cyan); font-size:0.6rem; font-family:'Orbitron'; letter-spacing:1px;">COMPLETION TRUTH SCORE</div>
                    <div style="font-family:'Bangers'; font-size:1.8rem; color:#fff;">${totalPower} / 60</div>
                </div>`;
            document.getElementById('initiate-blend-btn').disabled = false;
        }
    };

    async function loadCraftingData(user) {
        try {
            const res = await fetch(`${ATOMIC_API}/assets?collection_name=${COLLECTION}&owner=${user}&limit=300`);
            const json = await res.json();
            if (json.success) {
                const mapSel = (id, arr) => {
                    document.getElementById(id).innerHTML = `<option value="">-- SELECT PART --</option>` + arr.map(n => `<option value="${n.asset_id}" data-pop="${n.data.pop||0}" data-speed="${n.data.speed||0}" data-bal="${n.data.balance||0}">${n.name}</option>`).join('');
                };
                mapSel('craft-deck-select', json.data.filter(a => a.schema.schema_name === 'decks'));
                const trk = json.data.filter(a => a.schema.schema_name === 'trucks');
                mapSel('craft-truck1-select', trk); mapSel('craft-truck2-select', trk);
                const whl = json.data.filter(a => a.schema.schema_name === 'wheels');
                mapSel('craft-wheel1-select', whl); mapSel('craft-wheel2-select', whl); mapSel('craft-wheel3-select', whl); mapSel('craft-wheel4-select', whl);
            }
        } catch(e) {}
    }

    async function fetchInventory(user) {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = `<h3 style="grid-column: 1/-1; text-align: center; color: var(--accent-cyan); font-family: 'Orbitron';">FETCHING TRUNK...</h3>`;
        try {
            const res = await fetch(`${ATOMIC_API}/assets?collection_name=${COLLECTION}&schema_name=${currentSchema}&owner=${user}&limit=12`);
            const json = await res.json();
            if (json.success) {
                grid.innerHTML = json.data.map(n => `<div class="skate-card"><div class="rarity-header" style="background:var(--rarity-${(n.data.rarity||'common').toLowerCase()});"><div class="mint-badge">#${n.template_mint}</div></div><div class="img-wrap"><img src="https://ipfs.io/ipfs/${n.data.img||n.template.immutable_data.img}" class="skate-img"></div><div class="card-body"><div class="board-name">${n.name}</div></div></div>`).join('');
            }
        } catch (e) {}
    }

    window.toggleAuthModal = () => { if(!currentSession) document.getElementById('onboarding-modal').style.display = 'flex'; else location.reload(); };
    document.getElementById('login-trigger').addEventListener('click', async () => { const { session } = await sessionKit.login(); location.reload(); });

    window.executeBlend = async () => {
        const memo = "BLUEPRINT_REQUEST: Integrated Assembly (Cap 60)";
        try {
            const action = { account: 'eosio.token', name: 'transfer', authorization: [currentSession.permissionLevel], data: { from: currentSession.actor.toString(), to: 'ufuau.wam', quantity: '0.00000001 WAX', memo: memo } };
            await currentSession.transact({ action });
            alert("BLUEPRINT SUBMITTED TO ufuau.wam");
        } catch (e) {}
    };
</script>
</body>
</html>
