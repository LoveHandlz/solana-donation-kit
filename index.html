<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SK8COIN | Skate2Earn 1.5</title>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data:; audio-src 'self' https:;">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Bangers&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>

<style>
:root {
  --bg-deep:#0a132f;
  --bg-panel:#0f1a47;
  --accent-red:#ff2d55;
  --accent-orange:#ff9500;
  --accent-cyan:#00f0ff;
  --accent-gold:#ffd700; 
  --accent-green:#4ade80;
  --text-primary:#e0f7ff;
  --text-secondary:#a5d8ff;
  --card-border:rgba(0,240,255,0.14);
  
  --bronze-font: #cd7f32;
  --silver-font: #c0c0c0;
  --gold-font: #ffd700;
  --diamond-font: #b9f2ff;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--bg-deep);
  color:var(--text-primary);
  font-family:'Orbitron',sans-serif;
  line-height: 1.6;
  overflow-x: hidden;
}

header{
  background:rgba(10,19,47,0.95);
  backdrop-filter:blur(12px);
  position:fixed;
  top:0;left:0;right:0;
  z-index:100;
  padding:1rem 0;
  border-bottom:1px solid var(--card-border);
}

.header-inner{
  max-width:1440px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 1rem;
}

.logo{height:50px;}

nav ul{display:flex;gap:1.4rem;list-style:none;}
nav a{color:var(--text-secondary);text-decoration:none;font-weight:bold;transition:0.3s;font-size:0.9rem;}
nav a:hover{color:var(--accent-gold);}

.wallet-btn {
  background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange));
  border: none;
  padding: .7rem 1.4rem;
  border-radius: 50px;
  cursor: pointer;
  font-family: 'Orbitron';
  font-weight: bold;
  color: #000;
  transition: 0.3s;
}

#sol-balance {
  background: rgba(0,0,0,0.3);
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--accent-gold);
  font-size: 0.75rem;
  color: var(--accent-gold);
  font-weight: 900;
}

main {
  padding-top: 120px;
  max-width: 1440px;
  margin: auto;
  padding-left: 20px;
  padding-right: 20px;
  padding-bottom: 60px;
}

.hero { text-align: center; margin-bottom: 3rem; }
.hero h1 { 
  font-size: 5rem;
  background: linear-gradient(to bottom, #fff, var(--accent-gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1.5rem;
}
.video-card {
  background: var(--bg-panel);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  overflow: hidden;
  transition: 0.3s;
  position: relative;
}
.video-card:hover { border-color: var(--accent-gold); transform: scale(1.02); }
.video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; background: #000;}
.video-wrapper iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:none; z-index: 1;}

.video-mask {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(45deg, rgba(10,19,47,0.98), rgba(15,26,71,0.95));
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  z-index: 10; transition: 0.4s ease;
}
.unlocked .video-mask { opacity: 0; pointer-events: none; visibility: hidden; }

.card-info { padding: 1rem; }
.card-title { font-size: 0.85rem; font-weight: bold; margin-bottom: 0.5rem; height: 35px; overflow: hidden; }

.skater-wallet-bal {
  font-size: 0.7rem;
  color: var(--accent-cyan);
  margin-bottom: 0.8rem;
  font-weight: bold;
}

.donate-btn {
  background: var(--accent-gold);
  color: #000;
  border: none;
  padding: 8px 15px;
  border-radius: 4px;
  font-family: 'Orbitron';
  font-weight: 900;
  font-size: 0.7rem;
  cursor: pointer;
  width: 100%;
}

.view-profile-btn {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--card-border);
    margin-top: 5px;
    padding: 5px;
    font-size: 0.6rem;
    cursor: pointer;
    width: 100%;
    text-transform: uppercase;
}

/* 1.5 NEW PROFILE VIEW STYLES */
#profile-content {
    background: linear-gradient(145deg, var(--bg-panel), #050a1f);
    border: 1px solid var(--accent-gold);
    border-radius: 30px;
    padding: 3rem;
    max-width: 1100px;
    margin: auto;
}

.profile-layout {
    display: grid;
    grid-template-columns: 350px 1fr;
    gap: 40px;
}

.profile-pic {
    width: 100%;
    border-radius: 20px;
    border: 3px solid var(--accent-cyan);
    margin-bottom: 20px;
}

.style-tag {
    display: inline-block;
    padding: 4px 10px;
    background: rgba(0, 240, 255, 0.1);
    color: var(--accent-cyan);
    border-radius: 50px;
    font-size: 0.65rem;
    margin: 4px;
    border: 1px solid var(--accent-cyan);
}

.modal-overlay {
  display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
  background:rgba(0,0,0,0.9); z-index:1000; justify-content:center; align-items:center;
}
.modal-content {
  background:var(--bg-panel); padding:2.5rem; border-radius:20px; border:1px solid var(--accent-gold); width:90%; max-width:450px; text-align: center;
}

.tier-btn {
  width: 100%; padding: 12px; margin-bottom: 10px; background: transparent; border: 1px solid var(--accent-gold); color: var(--accent-gold); font-family: 'Orbitron'; cursor: pointer; text-transform: uppercase; font-weight: bold;
}

@media (max-width: 900px) { .profile-layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <img src="https://i.postimg.cc/VSvxfXsr/sk8coin-logo-biig.png" class="logo" onclick="navigateTo('home')" style="cursor:pointer;">
    <nav>
      <ul>
        <li><a href="javascript:void(0)" onclick="navigateTo('home')">HOME</a></li>
        <li><a href="javascript:void(0)" onclick="navigateTo('video')">VIDEOS</a></li>
        <li><a href="javascript:void(0)" onclick="navigateTo('leaderboard')">LEADERBOARD</a></li>
        <li><a href="javascript:void(0)" onclick="navigateTo('donate')">TREASURY</a></li>
      </ul>
    </nav>
    <div id="wallet-ui">
        <span id="sol-balance" style="display: none;">0.0000 SOL</span>
        <button id="connect-wallet-btn" class="wallet-btn" onclick="handleWalletAction()">CONNECT WALLET</button>
    </div>
  </div>
</header>

<main>
  <div id="home-content">
    <section class="hero">
        <h1>SKATE2EARN</h1>
        <p style="color:var(--text-secondary);">Decentralized P2P Sponsorship Marketplace.</p>
    </section>
    <div class="video-grid" id="home-grid-preview">
        </div>
  </div>

  <div id="video-content" style="display:none;">
    <div class="hero"><h1>SK8 VIDEOS</h1><p style="color:var(--accent-gold);">SPONSOR TO UNLOCK</p></div>
    <div class="video-grid" id="main-video-grid">
        </div>
  </div>

  <div id="profile-content" style="display:none;">
    <div class="profile-layout">
        <div class="profile-sidebar">
            <img id="p-img" src="" class="profile-pic">
            <h2 id="p-name" style="font-family:'Bangers'; font-size:3.5rem;"></h2>
            <div id="p-tags"></div>
            <div style="background:rgba(0,0,0,0.4); padding:20px; border-radius:15px; margin-top:20px; border:1px dashed var(--accent-gold);">
                <p style="font-size:0.6rem; opacity:0.6;">SKATER WALLET</p>
                <p id="p-wallet" style="font-family:monospace; font-size:0.55rem; word-break:break-all;"></p>
                <button onclick="openSponsorshipModalFromProfile()" class="donate-btn" style="margin-top:15px;">BLESS THIS SKATER</button>
            </div>
        </div>
        <div class="profile-main">
            <h3 style="color:var(--accent-gold); margin-bottom:20px;">BIO & STYLE</h3>
            <p id="p-bio" style="color:var(--text-secondary); line-height:1.8; margin-bottom:30px;"></p>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                <div style="background:var(--bg-panel); padding:20px; border-radius:10px; border:1px solid var(--card-border);">
                    <p style="font-size:0.6rem;">RANK</p>
                    <p id="p-rank" style="color:var(--accent-cyan); font-weight:900;"></p>
                </div>
                <div style="background:var(--bg-panel); padding:20px; border-radius:10px; border:1px solid var(--card-border);">
                    <p style="font-size:0.6rem;">ON-CHAIN BLESSINGS</p>
                    <p id="p-blessings" style="color:var(--accent-green); font-weight:900;">0.00 SOL</p>
                </div>
            </div>
            <button onclick="navigateTo('video')" class="view-profile-btn" style="margin-top:40px; padding:15px;">BACK TO VIDEOS</button>
        </div>
    </div>
  </div>

  <div id="leaderboard-content" style="display:none;"><div class="hero"><h1>BOARDROOM</h1></div></div>
  <div id="donate-content" style="display:none;"><div class="hero"><h1>TREASURY</h1></div></div>
</main>

<div id="sponsor-modal" class="modal-overlay">
  <div class="modal-content">
    <h3 style="color:var(--accent-gold); margin-bottom: 15px;">Choose Blessing Level</h3>
    <button class="tier-btn" onclick="selectAmount(0.1)">PRO (0.1 SOL)</button>
    <button class="tier-btn" onclick="selectAmount(0.05)">AMATEUR (0.05 SOL)</button>
    <button class="tier-btn" onclick="selectAmount(0.01)">FLOW (0.01 SOL)</button>
    <button onclick="closeModal()" style="background:transparent; color:#888; border:none; cursor:pointer;">[ Close ]</button>
  </div>
</div>

<script>
let publicKey = null; let provider = null; let activeVideoId = null; let currentSkaterTarget = "";
const RPC_URL = "https://solana-rpc.publicnode.com";

// THE 12 CORE SKATERS
const SKATERS = [
    { id: "vid-1", name: "LEO STREETS", wallet: "Gek2TJ4ya1uU87jexKg38ao1eTbaGDkYUjBaVbBrLGE6", rank: "PRO", styles: ["Street", "Technical"], pic: "https://i.pravatar.cc/400?img=11", bio: "Tech street master from downtown LA.", yt: "On2BmcreKTM" },
    { id: "vid-2", name: "GAP KILLER", wallet: "GzTbU3tnUCm6Y55Jxo1cPoBNkEzvRPeM3HDYcZqyCqPZ", rank: "AM", styles: ["Gaps", "Stairs"], pic: "https://i.pravatar.cc/400?img=12", bio: "Sending it over every stair set in sight.", yt: "3JZ_D3ELwOQ" },
    { id: "vid-3", name: "MANUAL MIKE", wallet: "4GtFZZj2KCoLnNhKH9SoNH7jsapzToiEYKpNyhnT6RWi", rank: "FLOW", styles: ["Balance", "Flatground"], pic: "https://i.pravatar.cc/400?img=13", bio: "Wheelie king of the local park.", yt: "9bZkp7q19f0" },
    { id: "vid-4", name: "VERT VICTOR", wallet: "6LjficeW9qWXd6Wa9ygn8yidteU7aRExgLbxFdMgByiW", rank: "PRO", styles: ["Vert", "Transition"], pic: "https://i.pravatar.cc/400?img=14", bio: "Highest airs in the revolution.", yt: "kXYiU_JCYtU" },
    { id: "vid-5", name: "SHREDDER 5", wallet: "BxEQSVXxYojLMijwnactZcHZKUMdVWryWXxZVqmgyRgi", rank: "AM", styles: ["Park", "Flow"], pic: "https://i.pravatar.cc/400?img=15", bio: "Style and flow over everything.", yt: "Wg_jwgmwt-U" },
    { id: "vid-6", name: "SHREDDER 6", wallet: "9smXB7M5NYXQRm4h6hrw3gdfNYs7tQgTgATGBvuLBozH", rank: "AM", styles: ["Street"], pic: "https://i.pravatar.cc/400?img=16", bio: "Raw street talent.", yt: "MFSx4jWmDfY" },
    { id: "vid-7", name: "SHREDDER 7", wallet: "5dCFGUTNAxCVJGbGUFSUEukTGKBd4ffUm9Q425efXZzm", rank: "PRO", styles: ["Technical"], pic: "https://i.pravatar.cc/400?img=17", bio: "Precision skating.", yt: "qqPjQpTe9W4" },
    { id: "vid-8", name: "SHREDDER 8", wallet: "9W8TxzG3ThA8i5bH6XCgXSF6wjf6D629dcfkUkNKj8Dj", rank: "AM", styles: ["Big Rails"], pic: "https://i.pravatar.cc/400?img=18", bio: "Handrail specialist.", yt: "Zq3kl6z_aEM" },
    { id: "vid-9", name: "SHREDDER 9", wallet: "HrXXR5VUKrH5ozCXsL6v5YCTTiVuKWp7KHuTYTiqHdCq", rank: "PRO", styles: ["Gaps"], pic: "https://i.pravatar.cc/400?img=19", bio: "Big gap hunter.", yt: "8_B_6vX1pXU" },
    { id: "vid-10", name: "SHREDDER 10", wallet: "DwvZscExkDYdiHEus2moUWUGxfchwZ2RnrXZEgBfih2b", rank: "AM", styles: ["Technical"], pic: "https://i.pravatar.cc/400?img=20", bio: "Ledge master.", yt: "T9yZzS7L-98" },
    { id: "vid-11", name: "SHREDDER 11", wallet: "E7tz7UK3obmpySK8ubyww8XWrVfZz4gLRwwyuHmTPWT7", rank: "FLOW", styles: ["Flatground"], pic: "https://i.pravatar.cc/400?img=21", bio: "Creative flatground skating.", yt: "6i1YyB7g-Ew" },
    { id: "vid-12", name: "SHREDDER 12", wallet: "DwvZscExkDYdiHEus2moUWUGxfchwZ2RnrXZEgBfih2b", rank: "AM", styles: ["Street"], pic: "https://i.pravatar.cc/400?img=22", bio: "All-round street skater.", yt: "P6Ff-e9V270" }
];

function initGrids() {
    const mainGrid = document.getElementById('main-video-grid');
    mainGrid.innerHTML = SKATERS.map(s => `
        <div class="video-card" id="${s.id}">
            <div class="video-wrapper">
                <div class="video-mask"><i class="fas fa-lock"></i><p>Sponsor to Unlock</p></div>
                <iframe src="" data-src="https://www.youtube.com/embed/${s.yt}"></iframe>
            </div>
            <div class="card-info">
                <div class="card-title">${s.name} Clip</div>
                <div class="skater-wallet-bal" data-wallet="${s.wallet}">Blessings: ...</div>
                <button class="donate-btn" onclick="openSponsorModal('${s.wallet}', '${s.id}')">SPONSOR</button>
                <button class="view-profile-btn" onclick="navigateTo('profile', '${s.wallet}')">VIEW PROFILE</button>
            </div>
        </div>
    `).join('');
    checkPersistence();
}

function navigateTo(page, wallet = null) {
    ["home", "video", "leaderboard", "donate", "profile"].forEach(id => {
        const el = document.getElementById(id + "-content");
        if(el) el.style.display = 'none';
    });
    document.getElementById(page + "-content").style.display = 'block';
    if(page === 'profile' && wallet) renderProfile(wallet);
}

async function renderProfile(wallet) {
    const skater = SKATERS.find(s => s.wallet === wallet);
    document.getElementById('p-name').innerText = skater.name;
    document.getElementById('p-img').src = skater.pic;
    document.getElementById('p-bio').innerText = skater.bio;
    document.getElementById('p-rank').innerText = skater.rank;
    document.getElementById('p-wallet').innerText = wallet;
    document.getElementById('p-tags').innerHTML = skater.styles.map(t => `<span class="style-tag">${t}</span>`).join('');
    
    const connection = new solanaWeb3.Connection(RPC_URL, "confirmed");
    const bal = await connection.getBalance(new solanaWeb3.PublicKey(wallet));
    document.getElementById('p-blessings').innerText = (bal / 1e9).toFixed(4) + " SOL";
}

function openSponsorModal(wallet, id) {
    currentSkaterTarget = wallet; activeVideoId = id;
    document.getElementById('sponsor-modal').style.display = 'flex';
}

function openSponsorshipModalFromProfile() {
    const wallet = document.getElementById('p-wallet').innerText;
    openSponsorModal(wallet, null);
}

function closeModal() { document.getElementById('sponsor-modal').style.display = 'none'; }

async function handleWalletAction() {
    provider = window.phantom?.solana;
    const resp = await provider.connect();
    publicKey = resp.publicKey.toString();
    const isSkater = SKATERS.find(s => s.wallet === publicKey);
    if(isSkater) navigateTo('profile', publicKey);
}

function checkPersistence() {
    SKATERS.forEach(s => {
        if(localStorage.getItem(s.id) === 'true') {
            const card = document.getElementById(s.id);
            if(card) {
                const ifr = card.querySelector('iframe');
                ifr.src = ifr.dataset.src;
                card.classList.add('unlocked');
            }
        }
    });
}

async function selectAmount(amt) {
    try {
        const connection = new solanaWeb3.Connection(RPC_URL, "confirmed");
        const transaction = new solanaWeb3.Transaction().add(
            solanaWeb3.SystemProgram.transfer({
                fromPubkey: new solanaWeb3.PublicKey(publicKey),
                toPubkey: new solanaWeb3.PublicKey(currentSkaterTarget),
                lamports: amt * 1e9
            })
        );
        const { blockhash } = await connection.getLatestBlockhash();
        transaction.recentBlockhash = blockhash;
        transaction.feePayer = new solanaWeb3.PublicKey(publicKey);
        const signed = await provider.signTransaction(transaction);
        await connection.sendRawTransaction(signed.serialize());
        
        if(activeVideoId) {
            localStorage.setItem(activeVideoId, 'true');
            checkPersistence();
        }
        closeModal();
    } catch(e) { console.log("Tx Failed"); }
}

window.onload = initGrids;
</script>
</body>
</html>
