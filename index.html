<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SK8 PORTAL | Zero-Fail WAX Engine</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Bangers&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #0a132f;
      --bg-panel: #0f1a47;
      --accent-cyan: #00f0ff;
      --accent-gold: #ffd700; 
      --accent-red: #ff2d55;
      --card-border: rgba(0,240,255,0.14);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg-deep); color: #e0f7ff; font-family: 'Inter', sans-serif; padding: 2rem; min-height: 100vh; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 1rem; margin-bottom: 2rem; }
    .header-title { font-family: 'Orbitron'; font-size: 1.8rem; color: var(--accent-cyan); font-weight: 900; }
    .wax-login-btn { background: linear-gradient(135deg, #f78e1e, #ffb347); color: #000; border: none; padding: 12px 25px; border-radius: 50px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; }
    .portal-layout { display: grid; grid-template-columns: 2.5fr 1fr; gap: 2rem; max-width: 1300px; margin: 0 auto; }
    .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
    .slot { aspect-ratio: 1 / 1; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); position: relative; cursor: pointer; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    .slot-img { width: 80%; height: 80%; object-fit: contain; }
    .inspector-panel { background: var(--bg-panel); border: 1px solid var(--card-border); border-radius: 16px; padding: 1.5rem; position: sticky; top: 2rem; min-height: 500px; text-align: center; }
    #system-message { display:none; padding: 15px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; text-align: center; margin-bottom: 15px; font-family: 'Orbitron'; border: 1px solid var(--accent-red); color: var(--accent-red); background: rgba(255, 45, 85, 0.1); }
    .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,19,47,0.9); display: none; justify-content: center; align-items: center; z-index: 50; flex-direction: column; }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">SK8 PORTAL</div>
    <div id="wax-auth-container">
        <button class="wax-login-btn" id="wax-login-btn" onclick="masterBootSequence()">CONNECT WAX</button>
    </div>
  </div>

  <div id="system-message"></div>

  <div class="portal-layout">
    <div style="position: relative;">
      <div class="inventory-grid" id="grid"></div>
      <div class="loading-overlay" id="api-loading">
          <i class="fas fa-circle-notch fa-spin" style="font-size:2rem; color:var(--accent-cyan); margin-bottom:1rem;"></i>
          <p>SYNCING BLOCKCHAIN...</p>
      </div>
    </div>
    <div class="inspector-panel" id="inspector-content">
        <i class="fas fa-mouse-pointer" style="font-size: 3rem; margin-top: 5rem; opacity: 0.2;"></i>
        <p style="margin-top: 1rem; opacity: 0.5;">Select a skatecoinwax NFT</p>
    </div>
  </div>

<script>
  let wax = null;
  const COLLECTION = "skatecoinwax";
  let inventory = [];

  // ⚡ THE MASTER BOOT: Forced Script Injection
  async function masterBootSequence() {
      const btn = document.getElementById('wax-login-btn');
      const errorBox = document.getElementById('system-message');
      btn.innerText = "LOADING ENGINE...";
      errorBox.style.display = 'none';

      if (typeof window.waxjs === 'undefined') {
          console.log("WaxJS missing. Injecting now...");
          const script = document.createElement('script');
          script.src = "https://unpkg.com/@waxio/waxjs@1.3.0/dist/index.js";
          script.onload = () => initiateLogin();
          script.onerror = () => {
              btn.innerText = "CONNECT WAX";
              errorBox.innerText = "ENGINE FAILED TO DOWNLOAD. CHECK CONNECTION.";
              errorBox.style.display = 'block';
          };
          document.head.appendChild(script);
      } else {
          initiateLogin();
      }
  }

  async function initiateLogin() {
      try {
          wax = new window.waxjs.WaxJS({ 
              rpcEndpoint: 'https://wax.greymass.com',
              tryAutoLogin: false 
          });
          const user = await wax.login();
          document.getElementById('wax-auth-container').innerHTML = `<span style="font-family:monospace; color:var(--accent-gold); font-weight:bold;">${user.toUpperCase()}</span>`;
          fetchAssets(user);
      } catch (e) {
          document.getElementById('wax-login-btn').innerText = "CONNECT WAX";
          document.getElementById('system-message').innerText = "LOGIN ERROR: " + e.message;
          document.getElementById('system-message').style.display = 'block';
      }
  }

  async function fetchAssets(wallet) {
    document.getElementById('api-loading').style.display = 'flex';
    const nodes = ["https://wax.api.atomicassets.io", "https://atomic.wax.eosrio.io", "https://atomic.3dkrender.com"];
    let dataFetched = false;

    for (let node of nodes) {
        try {
            const r = await fetch(`${node}/atomicassets/v1/assets?owner=${wallet}&collection_name=${COLLECTION}&limit=12&order=desc&sort=asset_id`);
            const j = await r.json();
            if (j.success) {
                inventory = j.data;
                renderUI();
                dataFetched = true;
                break;
            }
        } catch (err) { console.warn("Node blocked, trying next..."); }
    }

    document.getElementById('api-loading').style.display = 'none';
    if (!dataFetched) {
        document.getElementById('system-message').innerText = "WAX NETWORK UNREACHABLE. REFRESH.";
        document.getElementById('system-message').style.display = 'block';
    }
  }

  function renderUI() {
    const grid = document.getElementById('grid');
    grid.innerHTML = inventory.map(item => {
        const hash = item.data.img || (item.template && item.template.immutable_data.img);
        return `
            <div class="slot" onclick="inspect('${item.asset_id}')">
                <img src="https://atomichub-ipfs.com/ipfs/${hash}" class="slot-img" onerror="this.src='https://via.placeholder.com/150/0f1a47/ff2d55?text=ERROR'">
                <div class="slot-name" style="display:none">${item.data.name}</div>
            </div>`;
    }).join('') + Array(Math.max(0, 12 - inventory.length)).fill('<div class="slot" style="opacity:0.1;"><i class="fas fa-plus"></i></div>').join('');
  }

  function inspect(id) {
      const item = inventory.find(x => x.asset_id === id);
      const hash = item.data.img || (item.template && item.template.immutable_data.img);
      document.getElementById('inspector-content').innerHTML = `
          <img src="https://atomichub-ipfs.com/ipfs/${hash}" style="width:100%; border-radius:12px; margin-bottom:1rem; border: 1px solid var(--card-border);">
          <h2 style="font-family:'Bangers'; font-size:2rem; color:var(--accent-gold);">${item.data.name || 'SK8 NFT'}</h2>
          <p style="font-family:monospace; font-size:0.7rem; margin: 1rem 0;">ID: ${item.asset_id}<br>MINT: #${item.template_mint}</p>
          <button class="wax-login-btn" style="width:100%;" onclick="window.open('https://neftyblocks.com/collection/${COLLECTION}/blends', '_blank')">CRAFT / BLEND</button>
      `;
  }
</script>
</body>
</html>
