<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>$SKATE REWARDS PORTAL | THE GARAGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050a1a;
            --bg-panel: rgba(15, 26, 71, 0.95);
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
            --thps-blue: #0066ff;
            
            /* Rarity Palette */
            --rarity-common: #94a3b8;
            --rarity-uncommon: #4caf50;
            --rarity-rare: #2196f3;
            --rarity-mythic: #a855f7;
            --rarity-legendary: #f97316;
            --rarity-epic: #f43f5e;
        }

        body {
            background-color: var(--bg-deep);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 0;
            background-image: 
                radial-gradient(circle at 50% 50%, #162a5e 0%, #050a1a 100%),
                repeating-linear-gradient(45deg, rgba(0,240,255,0.02) 0px, rgba(0,240,255,0.02) 1px, transparent 1px, transparent 10px);
            background-attachment: fixed;
        }

        /* --- PRICE TICKER --- */
        .ticker-bar {
            background: rgba(0, 0, 0, 0.95);
            border-bottom: 2px solid var(--accent-cyan);
            padding: 10px 0;
            display: flex;
            justify-content: center;
            gap: 40px;
            font-weight: 900;
            font-size: 0.75rem;
            letter-spacing: 2px;
        }
        .ticker-item span { color: var(--accent-cyan); }
        .ticker-item b { color: var(--accent-gold); }

        nav {
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 15px 0;
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        nav a { color: #fff; text-decoration: none; font-size: 0.8rem; letter-spacing: 2px; font-weight: 900; }
        nav button { background: transparent; border: none; color: #ff4d4d; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; display: none; }

        header { text-align: center; margin: 40px 0; }
        h1 { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 3.5rem; margin: 0; letter-spacing: 4px; text-shadow: 0 0 20px var(--thps-blue); }
        .protocol-tag { color: var(--accent-cyan); font-size: 0.8rem; letter-spacing: 8px; margin-top: 10px; font-weight: 900; text-transform: uppercase; }

        /* --- GRID --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            max-width: 1400px;
            margin: auto;
            padding: 20px 40px;
        }

        .skate-card {
            background: var(--bg-panel);
            border: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            padding: 0; /* Removing padding for full-width rarity header */
            overflow: hidden;
        }
        .skate-card:hover { transform: scale(1.05); border-color: var(--accent-cyan); }

        /* Proud Rarity Header */
        .rarity-header {
            padding: 8px;
            text-align: center;
            font-weight: 900;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #000;
            text-transform: uppercase;
        }

        .img-wrap { width: 100%; height: 180px; display: flex; justify-content: center; align-items: center; background: #000; }
        .skate-img { height: 85%; object-fit: contain; filter: none; } /* NO GLOW */

        .card-body { padding: 15px; flex: 1; }
        .board-name { font-family: 'Bangers'; font-size: 1.6rem; color: var(--accent-gold); margin: 0; }
        
        /* VIDEO GAME STATS HUD */
        .hud-stats { margin: 15px 0; }
        .stat-row { margin-bottom: 8px; }
        .stat-meta { display: flex; justify-content: space-between; font-size: 0.55rem; font-weight: 900; color: var(--accent-cyan); margin-bottom: 2px; }
        .stat-bar-bg { height: 6px; background: #000; border-radius: 2px; border: 1px solid #333; overflow: hidden; }
        .stat-bar-fill { height: 100%; background: var(--accent-gold); width: 0%; transition: width 1s ease-out; }

        /* Additional Metadata Specs */
        .spec-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.55rem;
            color: #888;
            border-top: 1px dashed rgba(255,255,255,0.1);
            padding-top: 10px;
        }
        .spec-item b { color: #fff; display: block; margin-bottom: 2px; }

        .claim-zone {
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .reward-amt { font-family: 'Bangers'; font-size: 1.6rem; color: #fff; }
        .claim-btn { background: var(--accent-cyan); color: #000; border: none; padding: 8px 15px; font-weight: 900; font-size: 0.6rem; cursor: pointer; }

        .big-connect-btn { background: var(--accent-gold); border: none; padding: 20px 50px; font-weight: 900; font-size: 1.5rem; cursor: pointer; font-family: 'Orbitron'; }

        @media (max-width: 1100px) { .dashboard-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>

    <script>window.global = window;</script>
    <script type="module">
        import { Buffer } from 'https://esm.sh/buffer?bundle';
        window.Buffer = Buffer;
    </script>
</head>
<body>

<div class="ticker-bar">
    <div class="ticker-bar" id="price-ticker">SYNCING ALCOR MARKET DATA...</div>
</div>

<nav>
    <a href="#">HOME</a>
    <a href="#" class="active">GARAGE</a>
    <a href="#">TREASURY</a>
    <button id="logout-trigger">DISCONNECT</button>
</nav>

<header>
    <h1>$SKATE REWARDS PORTAL</h1>
    <div class="protocol-tag">SKATE2EARN PROTOCOL 2026</div>
</header>

<div id="auth-view" style="text-align: center; padding: 50px;">
    <button class="big-connect-btn" id="login-trigger">CONNECT WAX WALLET</button>
</div>

<div class="dashboard-grid" id="main-grid"></div>

<script type="module">
    import { SessionKit } from 'https://esm.sh/@wharfkit/session?bundle';
    import { WebRenderer } from 'https://esm.sh/@wharfkit/web-renderer?bundle';
    import { WalletPluginCloudWallet } from 'https://esm.sh/@wharfkit/wallet-plugin-cloudwallet?bundle';

    const ATOMIC_API = "https://wax.api.atomicassets.io/atomicassets/v1";
    const WAX_RPC = "https://wax.greymass.com";
    const SKATE_CONTRACT = "skatecoinwax";

    const sessionKit = new SessionKit({
        appName: 'SkateRewardsPortal2026',
        chains: [{ id: '1064487b3cd1a897ce03ae5b6a865651747e2e152090f99c1d19d44e01aea5a4', url: WAX_RPC }],
        ui: new WebRenderer(),
        walletPlugins: [ new WalletPluginCloudWallet() ]
    });

    const mainGrid = document.getElementById('main-grid');
    const ticker = document.getElementById('price-ticker');

    async function syncPrices() {
        try {
            const res = await fetch("https://api.alcor.exchange/api/v2/tickers");
            const data = await res.json();
            const wax = data.find(t => t.ticker_id === "eosio.token-wax-usdc.alcor-usdc");
            const skate = data.find(t => t.ticker_id === "skatecoinwax-skate-eosio.token-wax");
            
            const wPrice = parseFloat(wax?.last_price || 0).toFixed(4);
            const sWax = parseFloat(skate?.last_price || 0).toFixed(4);
            const sUsd = (parseFloat(sWax) * parseFloat(wPrice)).toFixed(6);

            ticker.innerHTML = `<div class="ticker-bar"><span>WAX/USD:</span> <b>$${wPrice}</b> | <span>SKATE/USD:</span> <b>$${sUsd}</b> | <span>SKATE/WAX:</span> <b>${sWax}</b></div>`;
        } catch (e) { ticker.innerText = "ALCOR OFFLINE"; }
    }

    document.getElementById('login-trigger').addEventListener('click', async () => {
        const { session } = await sessionKit.login();
        startApp(session);
    });

    document.getElementById('logout-trigger').addEventListener('click', async () => {
        await sessionKit.logout();
        location.reload();
    });

    sessionKit.restore().then(s => { if(s) startApp(s); });

    async function startApp(session) {
        document.getElementById('auth-view').style.display = 'none';
        document.getElementById('logout-trigger').style.display = 'block';
        const user = session.actor.toString();
        
        syncPrices();
        fetchInventory(user);
    }

    async function fetchInventory(user) {
        mainGrid.innerHTML = `<h2>SCANNING ATOMIC ASSETS...</h2>`;
        // Fetch all assets, merging template data to get full hardware specs
        const res = await fetch(`${ATOMIC_API}/assets?collection_name=skatecoinwax&schema_name=skateboards&owner=${user}&limit=12`);
        const json = await res.json();
        
        if (json.success && json.data.length > 0) {
            mainGrid.innerHTML = json.data.map(nft => {
                const m = nft.data; // Asset specific stats
                const t = nft.template ? nft.template.immutable_data : {}; // Template hardware specs
                
                const rarity = (m.rarity || 'common').toLowerCase();
                const img = m.img || t.img;
                const reward = ({"common":1000, "uncommon":2500, "rare":5000, "mythic":10000, "legendary":25000, "epic":50000}[rarity] || 1000);

                return `
                    <div class="skate-card">
                        <div class="rarity-header" style="background: var(--rarity-${rarity});">
                            ${rarity} EDITION
                        </div>
                        <div class="img-wrap"><img src="https://ipfs.io/ipfs/${img}" class="skate-img"></div>
                        <div class="card-body">
                            <div class="board-name">${nft.name}</div>
                            
                            <div class="hud-stats">
                                <div class="stat-row">
                                    <div class="stat-meta">SPEED <span>${m.speed || 0}/10</span></div>
                                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(m.speed || 0) * 10}%"></div></div>
                                </div>
                                <div class="stat-row">
                                    <div class="stat-meta">POP <span>${m.pop || 0}/10</span></div>
                                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(m.pop || 0) * 10}%; background:#007bff;"></div></div>
                                </div>
                                <div class="stat-row">
                                    <div class="stat-meta">BALANCE <span>${m.balance || 0}/10</span></div>
                                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(m.balance || 0) * 10}%; background:#9c27b0;"></div></div>
                                </div>
                            </div>

                            <div class="spec-grid">
                                <div class="spec-item"><b>DECK</b> ${t.deck || 'N/A'}</div>
                                <div class="spec-item"><b>WHEELS</b> ${t.wheels || 'N/A'}</div>
                                <div class="spec-item"><b>TRUCKS</b> ${t.trucks || 'N/A'}</div>
                                <div class="spec-item"><b>BRGS</b> ${t.bearings || 'N/A'}</div>
                            </div>
                        </div>
                        <div class="claim-zone">
                            <div class="reward-amt">${reward.toLocaleString()}</div>
                            <button class="claim-btn">CLAIM</button>
                        </div>
                    </div>
                `;
            }).join('');
        } else {
            mainGrid.innerHTML = `<h2>NO SKATEBOARDS DETECTED</h2>`;
        }
    }

    syncPrices();
    setInterval(syncPrices, 60000);
</script>
</body>
</html>
