<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WAC PORTAL | $SKATE REWARDS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050a1a;
            --bg-panel: rgba(15, 26, 71, 0.85);
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
            --fortnite-blue: #007bff;
            --epic-purple: #9c27b0;
        }

        body {
            background-color: var(--bg-deep); color: #fff; font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 0;
            background-image: 
                radial-gradient(circle at 50% 50%, #162a5e 0%, #050a1a 100%),
                repeating-linear-gradient(45deg, rgba(0,240,255,0.02) 0px, rgba(0,240,255,0.02) 1px, transparent 1px, transparent 10px);
            background-attachment: fixed;
        }

        /* --- PRICE TICKER BAR --- */
        .ticker-bar {
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 1px solid var(--accent-cyan);
            padding: 8px 0;
            font-size: 0.7rem;
            color: var(--accent-cyan);
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        nav {
            background: rgba(0, 0, 0, 0.9); border-bottom: 3px solid var(--fortnite-blue);
            padding: 10px 0; display: flex; justify-content: center; gap: 30px;
            position: sticky; top: 0; z-index: 1000;
        }

        nav a, nav button {
            color: #fff; text-decoration: none; font-weight: 900; font-size: 0.8rem;
            letter-spacing: 2px; padding: 10px 20px; transition: 0.3s;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            background: transparent; border: none; cursor: pointer; font-family: 'Orbitron';
        }

        nav a:hover, nav button:hover { background: var(--fortnite-blue); }
        .logout-btn { color: #ff4d4d !important; display: none; }

        header { text-align: center; margin: 40px 0; }
        h1 { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 3.5rem; margin: 0; color: #fff; letter-spacing: 6px; text-shadow: 0 0 20px var(--fortnite-blue); }
        .protocol-tag { color: var(--accent-cyan); font-size: 0.8rem; letter-spacing: 8px; margin-top: 10px; font-weight: 900; }

        /* Dashboard Tokens */
        .token-header { display: none; justify-content: center; gap: 20px; padding: 20px; }
        .token-pill {
            background: rgba(15, 26, 71, 0.9); border: 2px solid var(--accent-cyan);
            padding: 10px 25px; border-radius: 4px; text-align: center;
        }

        /* 12-Item Grid */
        .dashboard-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px;
            max-width: 1400px; margin: auto; padding: 20px 40px;
        }

        .skate-card {
            background: var(--bg-panel); border: 2px solid rgba(255,255,255,0.1);
            position: relative; transition: 0.3s; display: flex; flex-direction: column;
        }
        .skate-card:hover { transform: scale(1.03); border-color: var(--accent-cyan); box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); }

        .img-wrap { width: 100%; height: 200px; display: flex; justify-content: center; align-items: center; background: #000; }
        .skate-img { height: 90%; object-fit: contain; filter: drop-shadow(0 0 10px var(--accent-cyan)); }
        
        .card-body { padding: 15px; flex: 1; }
        .board-name { font-family: 'Bangers'; font-size: 1.8rem; color: var(--accent-gold); margin: 0; }
        
        .hud-stats { margin: 10px 0; }
        .stat-row { margin-bottom: 8px; }
        .stat-meta { display: flex; justify-content: space-between; font-size: 0.55rem; font-weight: 900; color: var(--accent-cyan); }
        .stat-bar-bg { height: 6px; background: #000; border-radius: 2px; border: 1px solid #333; overflow: hidden; }
        .stat-bar-fill { height: 100%; background: var(--accent-gold); width: 0%; transition: width 1s ease-out; }

        .claim-zone {
            padding: 15px; background: rgba(0,0,0,0.3); border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center;
        }
        .skate-reward { font-family: 'Bangers'; font-size: 1.6rem; color: var(--accent-gold); }
        .claim-btn { background: var(--accent-cyan); color: #000; border: none; padding: 8px 15px; font-weight: 900; font-size: 0.6rem; cursor: pointer; }

        .big-connect-btn { background: var(--accent-gold); border: none; padding: 20px 50px; font-weight: 900; font-size: 1.5rem; cursor: pointer; font-family: 'Orbitron'; }

        @media (max-width: 1100px) { .dashboard-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>

    <script>window.global = window;</script>
    <script type="module">
        import { Buffer } from 'https://esm.sh/buffer?bundle';
        window.Buffer = Buffer;
    </script>
</head>
<body>

<div class="ticker-bar" id="price-ticker">SYNCING ALCOR MARKET DATA...</div>

<nav>
    <a href="#" class="active">GARAGE</a>
    <a href="#">REWARDS</a>
    <a href="#">STAKING</a>
    <button id="logout-trigger" class="logout-btn">DISCONNECT</button>
</nav>

<div class="token-header" id="token-header">
    <div class="token-pill">
        <div style="font-size: 0.5rem; color: #888;">WAX BALANCE</div>
        <div class="token-val" id="wax-bal">0.00</div>
    </div>
    <div class="token-pill">
        <div style="font-size: 0.5rem; color: #888;">$SKATE REWARDS</div>
        <div class="token-val" id="skate-bal">0.00</div>
    </div>
</div>

<header>
    <h1>$SKATE REWARDS PORTAL</h1>
    <div class="protocol-tag">SKATE2EARN PROTOCOL</div>
</header>

<div id="auth-view" style="text-align: center; padding: 50px;">
    <button class="big-connect-btn" id="login-trigger">CONNECT WAX WALLET</button>
</div>

<div class="dashboard-grid" id="main-grid"></div>

<script type="module">
    import { SessionKit } from 'https://esm.sh/@wharfkit/session?bundle';
    import { WebRenderer } from 'https://esm.sh/@wharfkit/web-renderer?bundle';
    import { WalletPluginCloudWallet } from 'https://esm.sh/@wharfkit/wallet-plugin-cloudwallet?bundle';

    const ATOMIC_API = "https://wax.api.atomicassets.io/atomicassets/v1";
    const WAX_RPC = "https://wax.greymass.com";
    const SKATE_CONTRACT = "skatecoinwax";

    const sessionKit = new SessionKit({
        appName: 'SkateRewardsPortal',
        chains: [{ id: '1064487b3cd1a897ce03ae5b6a865651747e2e152090f99c1d19d44e01aea5a4', url: WAX_RPC }],
        ui: new WebRenderer(),
        walletPlugins: [ new WalletPluginCloudWallet() ]
    });

    const mainGrid = document.getElementById('main-grid');
    const ticker = document.getElementById('price-ticker');

    // --- ALCOR PRICE FEED ---
    async function updateTickers() {
        try {
            const res = await fetch("https://api.alcor.exchange/api/v2/tickers");
            const data = await res.json();
            
            // Find WAX/USDC and SKATE/WAX
            const waxTicker = data.find(t => t.ticker_id === "eosio.token-wax-usdc.alcor-usdc");
            const skateTicker = data.find(t => t.ticker_id === "skatecoinwax-skate-eosio.token-wax");
            
            const waxPrice = waxTicker ? parseFloat(waxTicker.last_price).toFixed(4) : "0.00";
            const skateWax = skateTicker ? parseFloat(skateTicker.last_price).toFixed(4) : "0.00";
            const skateUsd = (parseFloat(skateWax) * parseFloat(waxPrice)).toFixed(6);

            ticker.innerHTML = `WAX/USD: $${waxPrice} | SKATE/USD: $${skateUsd} | SKATE/WAX: ${skateWax}`;
        } catch (e) { ticker.innerText = "ALCOR API OFFLINE"; }
    }

    // --- AUTH & APP LOGIC ---
    document.getElementById('login-trigger').addEventListener('click', async () => {
        const { session } = await sessionKit.login();
        startPortal(session);
    });

    document.getElementById('logout-trigger').addEventListener('click', async () => {
        await sessionKit.logout();
        location.reload();
    });

    sessionKit.restore().then(s => { if(s) startPortal(s); });

    async function startPortal(session) {
        document.getElementById('auth-view').style.display = 'none';
        document.getElementById('token-header').style.display = 'flex';
        document.getElementById('logout-trigger').style.display = 'block';
        const user = session.actor.toString();
        
        updateTickers();
        fetchBalances(user);
        fetchInventory(user);
    }

    async function fetchBalances(user) {
        const wax = await fetch(`${WAX_RPC}/v1/chain/get_currency_balance`, {
            method: 'POST', body: JSON.stringify({ code: 'eosio.token', account: user, symbol: 'WAX' })
        }).then(r => r.json());
        document.getElementById('wax-bal').innerText = wax[0] || "0.00 WAX";

        const skate = await fetch(`${WAX_RPC}/v1/chain/get_currency_balance`, {
            method: 'POST', body: JSON.stringify({ code: SKATE_CONTRACT, account: user, symbol: 'SKATE' })
        }).then(r => r.json());
        document.getElementById('skate-bal').innerText = skate[0] || "0.00 SKATE";
    }

    async function fetchInventory(user) {
        mainGrid.innerHTML = `<h2>SCANNING GARAGE...</h2>`;
        const res = await fetch(`${ATOMIC_API}/assets?collection_name=skatecoinwax&schema_name=skateboards&owner=${user}&limit=12`);
        const json = await res.json();
        
        if (json.success && json.data.length > 0) {
            mainGrid.innerHTML = json.data.map(nft => {
                const m = nft.data;
                const rarity = (m.rarity || 'common').toLowerCase();
                const img = m.img || nft.template.immutable_data.img;
                return `
                    <div class="skate-card">
                        <div class="img-wrap"><img src="https://ipfs.io/ipfs/${img}" class="skate-img"></div>
                        <div class="card-body">
                            <div class="board-name">${nft.name}</div>
                            <div class="hud-stats">
                                <div class="stat-row">
                                    <div class="stat-meta">SPEED <span>${m.speed}/10</span></div>
                                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${m.speed * 10}%"></div></div>
                                </div>
                                <div class="stat-row">
                                    <div class="stat-meta">POP <span>${m.pop}/10</span></div>
                                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${m.pop * 10}%; background:var(--fortnite-blue);"></div></div>
                                </div>
                            </div>
                        </div>
                        <div class="claim-zone">
                            <button class="claim-btn">CLAIM REWARD</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
    }

    updateTickers();
    setInterval(updateTickers, 30000); // Update prices every 30s
</script>
</body>
</html>
