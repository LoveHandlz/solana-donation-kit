<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WAC ARTIST COLLABS | SEASON 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a132f;
            --bg-panel: rgba(15, 26, 71, 0.95);
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
            --thps-blue: #0066ff;
            /* Rarity Reward Scale */
            --common: #888; --uncommon: #4caf50; --rare: #2196f3; 
            --mythic: #9c27b0; --legendary: #ff9800; --epic: #ff2d55; 
            --ridiculous: #00f0ff;
        }

        body {
            background: var(--bg-deep);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 20px;
            background-image: radial-gradient(circle at 50% 50%, #162a5e 0%, #0a132f 100%);
            overflow-x: hidden;
        }

        header { text-align: center; margin-bottom: 3rem; }
        h1 {
            font-family: 'Bangers', cursive;
            font-size: 4rem;
            color: #fff;
            margin: 0;
            -webkit-text-stroke: 1px var(--thps-blue);
            text-shadow: 4px 4px 0px var(--thps-blue);
            letter-spacing: 3px;
        }

        /* 12-ITEM FORCED GRID (Crypto Clips Standard) */
        .collab-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1440px;
            margin: auto;
            padding-bottom: 50px;
        }

        .iframe-card {
            background: var(--bg-panel);
            border: 3px solid #fff;
            padding: 12px;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% 92%, 92% 100%, 0 100%);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            min-height: 520px;
        }

        .iframe-card:hover {
            border-color: var(--accent-cyan);
            transform: scale(1.03) rotate(-1deg);
            z-index: 10;
        }

        .rarity-banner {
            position: absolute;
            top: 5px; left: -5px;
            padding: 2px 12px;
            font-weight: 900;
            font-size: 0.65rem;
            transform: rotate(-5deg);
            box-shadow: 3px 3px 0 #000;
            z-index: 5;
            text-transform: uppercase;
        }

        .nft-media {
            width: 100%;
            aspect-ratio: 1/1;
            background: #000;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 12px;
            object-fit: contain;
        }

        .deck-title {
            font-family: 'Bangers';
            font-size: 1.6rem;
            color: var(--accent-gold);
            margin: 0;
            line-height: 1;
        }

        /* THPS HUD STATS */
        .stat-row { margin: 8px 0; }
        .stat-label { font-size: 0.55rem; color: var(--accent-cyan); display: flex; justify-content: space-between; font-weight: 900; }
        .bar-bg { background: #000; height: 8px; border: 1px solid #333; margin-top: 2px; }
        .bar-fill { background: var(--accent-gold); height: 100%; box-shadow: 0 0 10px var(--accent-gold); }

        .meta-specs {
            font-size: 0.55rem;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 4px;
            color: #aaa;
            margin: 10px 0;
            border-left: 3px solid var(--accent-cyan);
            line-height: 1.4;
        }

        .reward-box {
            margin-top: auto;
            text-align: center;
            border-top: 1px dashed rgba(255,255,255,0.2);
            padding-top: 12px;
        }

        .skate-val { font-weight: 900; color: #fff; font-size: 1.3rem; display: block; text-shadow: 0 0 10px var(--accent-gold); }
        .wax-val { font-size: 0.6rem; color: var(--accent-cyan); font-weight: bold; }

        .select-btn {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            padding: 12px;
            font-family: 'Orbitron';
            font-weight: 900;
            cursor: pointer;
            margin-top: 10px;
            clip-path: polygon(0 0, 100% 0, 90% 100%, 0 100%);
            text-transform: uppercase;
        }

        .select-btn:hover { background: var(--accent-gold); letter-spacing: 1px; }

        @media (max-width: 1100px) { .collab-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 650px) { .collab-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
    <h1>WAC ARTIST COLLABS: S1</h1>
    <p style="letter-spacing: 5px; font-size: 0.8rem; color: var(--accent-cyan);">PRO-SKATER METADATA DECODED // $SKATE REWARDS</p>
</header>

<div id="grid-mount" class="collab-grid">
    </div>

<script>
    const HELIUS_KEY = "29c35e1d-2cbb-4f50-b9fd-7df5a828e6bb"; //
    const ATOMIC_API = "https://wax.api.atomicassets.io/atomicassets/v1";

    const SKATE_REWARDS = {
        'common': 100, 'uncommon': 250, 'rare': 500, 'mythic': 1000, 
        'legendary': 2000, 'epic': 5000, 'ridiculous': 10000
    };

    // Specific Boards Requested by User
    const TARGET_IDS = ["854945", "857734", "1099949334880", "847825", "791658"];

    async function initSeasonOne() {
        const mount = document.getElementById('grid-mount');
        const artists = new Set();
        const displayData = [];

        try {
            // Fetch the specific asset IDs first
            for(let id of TARGET_IDS) {
                const res = await fetch(`${ATOMIC_API}/assets/${id}`);
                const json = await res.json();
                if(json.success) processNFT(json.data, artists, displayData);
            }

            // Fill remaining 7 slots with random unique artists from the collection
            const res = await fetch(`${ATOMIC_API}/assets?collection_name=skatecoinwax&schema_name=skateboards&limit=50&order=desc&api_key=${HELIUS_KEY}`);
            const json = await res.json();
            
            if(json.success) {
                for(let nft of json.data) {
                    if(displayData.length < 12) processNFT(nft, artists, displayData);
                }
            }

            render(displayData);
        } catch (e) { mount.innerHTML = "SYNC FAILED"; }
    }

    function processNFT(nft, artistSet, list) {
        const m = nft.data;
        const art = m.artist || "Pro Artist";
        if (artistSet.has(art)) return;
        artistSet.add(art);

        const rarity = (m.rarity || "common").toLowerCase();
        list.push({
            id: nft.asset_id,
            name: nft.name || m.name,
            img: `https://ipfs.io/ipfs/${m.img || nft.template.immutable_data.img}`,
            rarity: rarity,
            artist: art,
            deck: m.deck || "Hybrid Creatures",
            pop: parseInt(m.pop) || Math.floor(Math.random() * 5) + 5,
            speed: parseInt(m.speed) || Math.floor(Math.random() * 5) + 5,
            balance: parseInt(m.balance) || Math.floor(Math.random() * 5) + 5,
            trucks: m.trucks || "Gold/Red",
            wheels: m.wheels || "Purple",
            bearings: m.bearings || "RGB",
            skate: SKATE_REWARDS[rarity] || 100,
            wax: nft.prices && nft.prices[0] ? (nft.prices[0].amount / 100000000).toFixed(2) + " WAX" : "COLLECTIBLE"
        });
    }

    function render(list) {
        document.getElementById('grid-mount').innerHTML = list.map(b => `
            <div class="iframe-card">
                <div class="rarity-banner" style="background:var(--${b.rarity})">${b.rarity}</div>
                <img src="${b.img}" class="nft-media" onerror="this.src='https://via.placeholder.com/300?text=Syncing...'">
                
                <div class="deck-title">${b.name}</div>
                <div style="font-size:0.5rem; color:#888; margin-bottom:8px;">ARTIST: ${b.artist}</div>

                <div class="stat-row">
                    <div class="stat-label">SPEED <span>${b.speed}/10</span></div>
                    <div class="bar-bg"><div class="bar-fill" style="width:${b.speed * 10}%"></div></div>
                </div>
                <div class="stat-row">
                    <div class="stat-label">POP <span>${b.pop}/10</span></div>
                    <div class="bar-bg"><div class="bar-fill" style="width:${b.pop * 10}%"></div></div>
                </div>
                <div class="stat-row">
                    <div class="stat-label">BALANCE <span>${b.balance}/10</span></div>
                    <div class="bar-bg"><div class="bar-fill" style="width:${b.balance * 10}%"></div></div>
                </div>

                <div class="meta-specs">
                    <strong>DECK:</strong> ${b.deck}<br>
                    <strong>TRUCKS:</strong> ${b.trucks}<br>
                    <strong>WHEELS:</strong> ${b.wheels} | <strong>BRG:</strong> ${b.bearings}
                </div>

                <div class="reward-box">
                    <span class="wax-val">${b.wax}</span>
                    <span class="skate-val">${b.skate} $SKATE</span>
                    <button class="select-btn" onclick="window.open('https://wax.atomichub.io/explorer/asset/${b.id}')">COLLECT BOARD</button>
                </div>
            </div>
        `).join('');
    }

    initSeasonOne();
</script>
</body>
</html>
