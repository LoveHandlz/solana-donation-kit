<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WAX PORTAL | SKATE REWARD CENTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050a1a;
            --fortnite-blue: #007bff;
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
            --epic-purple: #9c27b0;
            --rarity-legendary: linear-gradient(135deg, #ff8c00, #ff0000);
            --rarity-epic: linear-gradient(135deg, #b026ff, #5500ff);
        }

        body {
            background-color: var(--bg-deep);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 0;
            background-image: 
                radial-gradient(circle at 50% 50%, #162a5e 0%, #050a1a 100%),
                repeating-linear-gradient(45deg, rgba(0,240,255,0.02) 0px, rgba(0,240,255,0.02) 1px, transparent 1px, transparent 10px);
            background-attachment: fixed;
        }

        /* --- FORTNITE STYLE NAV --- */
        nav {
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 3px solid var(--fortnite-blue);
            padding: 10px 0;
            display: flex;
            justify-content: center;
            gap: 30px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav a {
            color: #fff; text-decoration: none; font-weight: 900; font-size: 0.8rem;
            letter-spacing: 2px; padding: 10px 20px; transition: 0.3s;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        nav a:hover { background: var(--fortnite-blue); color: #fff; }

        /* --- TOKEN DASHBOARD --- */
        .token-header {
            display: flex; justify-content: center; gap: 20px; padding: 20px;
            background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(0,240,255,0.2);
        }

        .token-pill {
            background: rgba(15, 26, 71, 0.9); border: 2px solid var(--accent-cyan);
            padding: 10px 25px; border-radius: 50px; text-align: center;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .token-label { font-size: 0.6rem; color: #888; text-transform: uppercase; margin-bottom: 4px; }
        .token-val { font-size: 1.2rem; font-weight: 900; color: var(--accent-gold); }

        header { text-align: center; margin: 40px 0; }
        h1 { font-family: 'Bangers', cursive; font-size: 5rem; margin: 0; color: #fff; letter-spacing: 4px; text-shadow: 5px 5px 0px var(--fortnite-blue); }

        /* --- ITEM SHOP GRID --- */
        .dashboard-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px;
            max-width: 1400px; margin: auto; padding: 20px 40px;
        }

        .skate-card {
            background: var(--bg-panel); border: 2px solid rgba(255,255,255,0.1);
            position: relative; overflow: hidden; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; cursor: pointer;
        }

        .skate-card:hover {
            transform: scale(1.05); border-color: var(--accent-cyan);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
        }

        .rarity-header {
            height: 6px; width: 100%; background: #ccc;
        }

        .img-wrap {
            width: 100%; height: 220px; background: rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center; position: relative;
        }

        .skate-img { height: 90%; object-fit: contain; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); }

        .card-body { padding: 15px; flex: 1; display: flex; flex-direction: column; background: rgba(15, 26, 71, 0.8); }

        .board-name { font-family: 'Bangers'; font-size: 1.8rem; color: #fff; margin-bottom: 5px; }
        
        /* VIDEO GAME STATS HUD */
        .hud-stats { margin: 10px 0; }
        .stat-row { margin-bottom: 8px; }
        .stat-meta { display: flex; justify-content: space-between; font-size: 0.55rem; font-weight: 900; color: var(--accent-cyan); margin-bottom: 2px; }
        .stat-bar-bg { height: 6px; background: #000; border-radius: 3px; overflow: hidden; border: 1px solid #333; }
        .stat-bar-fill { height: 100%; background: var(--accent-gold); box-shadow: 0 0 10px var(--accent-gold); width: 0%; transition: width 1s ease-out; }

        .claim-zone {
            margin-top: auto; padding: 15px; background: rgba(0,0,0,0.3); border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center;
        }

        .skate-reward { font-family: 'Bangers'; font-size: 1.5rem; color: var(--accent-gold); }

        .claim-btn {
            background: var(--accent-cyan); color: #000; border: none; padding: 8px 15px;
            font-family: 'Orbitron'; font-weight: 900; font-size: 0.7rem; cursor: pointer;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        /* --- CONNECT OVERLAY --- */
        .connect-hero { text-align: center; padding: 60px; }
        .big-connect-btn {
            background: var(--accent-gold); color: #000; border: none; padding: 20px 60px;
            font-family: 'Orbitron'; font-weight: 900; font-size: 1.5rem; cursor: pointer;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%); transition: 0.3s;
        }
        .big-connect-btn:hover { background: #fff; transform: scale(1.1); box-shadow: 0 0 30px var(--accent-gold); }

        @media (max-width: 1200px) { .dashboard-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>

    <script>window.global = window;</script>
    <script type="module">
        import { Buffer } from 'https://esm.sh/buffer?bundle';
        window.Buffer = Buffer;
    </script>
</head>
<body>

<nav>
    <a href="#" class="active">GARAGE</a>
    <a href="#">COMPETITIONS</a>
    <a href="#">$SKATE STAKING</a>
    <a href="#">MARKET</a>
</nav>

<div class="token-header" id="token-header" style="display: none;">
    <div class="token-pill">
        <div class="token-label">WAX BALANCE</div>
        <div class="token-val" id="wax-bal">0.00000000</div>
    </div>
    <div class="token-pill">
        <div class="token-label">$SKATE EARNED</div>
        <div class="token-val" id="skate-bal">0.0000</div>
    </div>
</div>

<header>
    <h1>SKATE PORTAL</h1>
    <div style="color: var(--accent-cyan); letter-spacing: 8px; font-weight: 900; font-size: 0.7rem;">SEASON 1 // REWARD PROTOCOL</div>
</header>

<div id="auth-view" class="connect-hero">
    <button class="big-connect-btn" id="login-trigger">CONNECT WAX WALLET</button>
</div>

<div class="dashboard-grid" id="main-grid"></div>

<script type="module">
    import { SessionKit } from 'https://esm.sh/@wharfkit/session?bundle';
    import { WebRenderer } from 'https://esm.sh/@wharfkit/web-renderer?bundle';
    import { WalletPluginCloudWallet } from 'https://esm.sh/@wharfkit/wallet-plugin-cloudwallet?bundle';

    const ATOMIC_API = "https://wax.api.atomicassets.io/atomicassets/v1";
    const WAX_RPC = "https://wax.greymass.com";
    const TOKEN_CONTRACT = "skatecoinwax"; 

    const sessionKit = new SessionKit({
        appName: 'Skate_Portal_S1',
        chains: [{ id: '1064487b3cd1a897ce03ae5b6a865651747e2e152090f99c1d19d44e01aea5a4', url: WAX_RPC }],
        ui: new WebRenderer(),
        walletPlugins: [ new WalletPluginCloudWallet() ]
    });

    const authView = document.getElementById('auth-view');
    const tokenHeader = document.getElementById('token-header');
    const mainGrid = document.getElementById('main-grid');

    document.getElementById('login-trigger').addEventListener('click', async () => {
        const { session } = await sessionKit.login();
        startApp(session);
    });

    sessionKit.restore().then(s => { if(s) startApp(s); });

    function startApp(session) {
        authView.style.display = 'none';
        tokenHeader.style.display = 'flex';
        const user = session.actor.toString();
        
        updateBalances(user);
        fetchSkateboards(user);
    }

    async function updateBalances(user) {
        try {
            // WAX
            const wax = await fetch(`${WAX_RPC}/v1/chain/get_currency_balance`, {
                method: 'POST', body: JSON.stringify({ code: 'eosio.token', account: user, symbol: 'WAX' })
            }).then(r => r.json());
            document.getElementById('wax-bal').innerText = wax[0] || "0.0000";

            // SKATE
            const skate = await fetch(`${WAX_RPC}/v1/chain/get_currency_balance`, {
                method: 'POST', body: JSON.stringify({ code: TOKEN_CONTRACT, account: user, symbol: 'SKATE' })
            }).then(r => r.json());
            document.getElementById('skate-bal').innerText = skate[0] || "0.0000";
        } catch (e) {}
    }

    async function fetchSkateboards(user) {
        mainGrid.innerHTML = `<h2 style="grid-column: 1/-1; text-align: center; color: var(--accent-cyan);">LOADING COMPLETED DECKS...</h2>`;
        
        // Strictly fetch Completed Skateboards from your collection
        const res = await fetch(`${ATOMIC_API}/assets?collection_name=skatecoinwax&schema_name=skateboards&owner=${user}&limit=100`);
        const json = await res.json();
        
        if (json.success && json.data.length > 0) {
            renderShop(json.data);
        } else {
            mainGrid.innerHTML = `<h2 style="grid-column: 1/-1; text-align: center;">NO SKATEBOARDS DETECTED.</h2>`;
        }
    }

    function renderShop(assets) {
        mainGrid.innerHTML = assets.map(nft => {
            const m = nft.data;
            const rarity = (m.rarity || 'common').toLowerCase();
            const reward = calculateReward(rarity);
            const img = m.img || nft.template.immutable_data.img;

            return `
                <div class="skate-card">
                    <div class="rarity-header" style="background: var(--rarity-${rarity}, #888)"></div>
                    <div class="img-wrap">
                        <img src="https://ipfs.io/ipfs/${img}" class="skate-img">
                    </div>
                    <div class="card-body">
                        <div class="board-name">${nft.name}</div>
                        <div style="font-size: 0.5rem; color: var(--accent-cyan); text-transform: uppercase; margin-bottom: 10px;">${rarity} EDITION</div>

                        <div class="hud-stats">
                            <div class="stat-row">
                                <div class="stat-meta">SPEED <span>${m.speed}/10</span></div>
                                <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${m.speed * 10}%"></div></div>
                            </div>
                            <div class="stat-row">
                                <div class="stat-meta">POP <span>${m.pop}/10</span></div>
                                <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${m.pop * 10}%; background: var(--fortnite-blue); box-shadow: 0 0 10px var(--fortnite-blue);"></div></div>
                            </div>
                            <div class="stat-row">
                                <div class="stat-meta">BALANCE <span>${m.balance}/10</span></div>
                                <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${m.balance * 10}%; background: var(--epic-purple); box-shadow: 0 0 10px var(--epic-purple);"></div></div>
                            </div>
                        </div>
                    </div>
                    <div class="claim-zone">
                        <div class="skate-reward">${reward} <span style="font-size: 0.6rem;">$SKATE</span></div>
                        <button class="claim-btn">CLAIM</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function calculateReward(rarity) {
        const rates = { 'common': 100, 'uncommon': 250, 'rare': 500, 'mythic': 1000, 'legendary': 2500, 'epic': 5000 };
        return rates[rarity] || 100;
    }
</script>
</body>
</html>
