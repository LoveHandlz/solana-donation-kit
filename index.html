<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>$SKATE REWARDS PORTAL | THE GARAGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Bangers&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050a1a;
            --bg-panel: rgba(15, 26, 71, 0.95);
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
            --accent-green: #00ff88; /* From Crypto Clips USD display */
            --card-border: rgba(0, 240, 255, 0.2);
            --thps-blue: #0066ff;
            
            /* Rarity Palette - Revamped with Crypto Clips Glow */
            --rarity-common: #94a3b8;
            --rarity-uncommon: #4caf50;
            --rarity-rare: #2196f3;
            --rarity-mythic: #a855f7;
            --rarity-legendary: var(--accent-gold);
            --rarity-epic: #f43f5e;
        }

        body {
            background-color: var(--bg-deep);
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            background-image: 
                radial-gradient(circle at 50% 50%, #162a5e 0%, #050a1a 100%),
                repeating-linear-gradient(45deg, rgba(0,240,255,0.02) 0px, rgba(0,240,255,0.02) 1px, transparent 1px, transparent 10px);
            background-attachment: fixed;
        }

        /* --- CRYPTO CLIPS HEADER INTEGRATION --- */
        header {
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid var(--accent-cyan);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .header-inner {
            display: flex;
            align-items: center;
            gap: 40px;
            width: 100%;
            max-width: 1400px;
            margin: auto;
        }

        .logo { height: 45px; cursor: pointer; transition: 0.3s; }
        .logo:hover { filter: drop-shadow(0 0 10px var(--accent-cyan)); }

        nav ul { display: flex; list-style: none; gap: 25px; margin: 0; padding: 0; }
        nav a { 
            color: #fff; 
            text-decoration: none; 
            font-family: 'Orbitron'; 
            font-size: 0.75rem; 
            font-weight: 900; 
            letter-spacing: 2px;
            transition: 0.3s;
        }
        nav a:hover { color: var(--accent-cyan); text-shadow: 0 0 10px var(--accent-cyan); }

        /* Ticker Bar from WAX Portal, styled like Crypto Clips Wallet UI */
        .ticker-bar {
            background: rgba(0, 240, 255, 0.05);
            border-bottom: 1px solid var(--card-border);
            padding: 8px 0;
            display: flex;
            justify-content: center;
            gap: 40px;
            font-family: 'Orbitron';
            font-weight: 900;
            font-size: 0.65rem;
            letter-spacing: 1px;
        }
        .ticker-item span { color: var(--accent-cyan); }
        .ticker-item b { color: var(--accent-gold); }

        /* HERO SECTION */
        .hero-v2 {
            text-align: center;
            padding: 60px 20px;
        }
        .hero-v2 h1 { 
            font-family: 'Orbitron'; 
            font-weight: 900; 
            font-size: 3.5rem; 
            margin: 0; 
            background: linear-gradient(to bottom, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }
        .hero-subtext { color: var(--accent-gold); font-family: 'Bangers'; font-size: 1.2rem; letter-spacing: 2px; margin-top: 10px; }

    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <img src="https://i.postimg.cc/VSvxfXsr/sk8coin-logo-biig.png" class="logo" onclick="location.reload()">
        <nav>
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#" style="color: var(--accent-cyan);">GARAGE</a></li>
                <li><a href="#">TREASURY</a></li>
                <li><a href="#">DAO</a></li>
            </ul>
        </nav>
    </div>
</header>

<div class="ticker-bar" id="price-ticker">
    <div class="ticker-item">INITIALIZING SKATE-LINK...</div>
</div>

<section class="hero-v2">
    <h1>REWARDS PORTAL</h1>
    <div class="hero-subtext">WAX PORTAL // SKATE2EARN PROTOCOL 2026</div>
</section>

    <style>
    /* --- HUD CARD STYLING --- */
    .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 30px;
        max-width: 1400px;
        margin: auto;
        padding: 40px;
    }

    .skate-card {
        background: var(--bg-panel);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        overflow: hidden;
        transition: transform 0.3s, border-color 0.3s;
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* THE YELLOW FRAME HOVER */
    .skate-card:hover {
        transform: translateY(-10px);
        border-color: var(--accent-gold);
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
    }

    .rarity-header {
        padding: 10px;
        text-align: center;
        font-family: 'Orbitron';
        font-weight: 900;
        font-size: 0.7rem;
        letter-spacing: 3px;
        color: #000;
        text-transform: uppercase;
    }

    .img-wrap { 
        width: 100%; 
        height: 220px; 
        background: #000; 
        display: flex; 
        justify-content: center; 
        align-items: center;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .skate-img { max-height: 85%; max-width: 85%; object-fit: contain; }

    .card-body { padding: 20px; flex: 1; }
    .board-name { font-family: 'Bangers'; font-size: 1.8rem; color: #fff; margin-bottom: 15px; }

    /* STAT HUD (CRYPTO CLIPS STYLE) */
    .hud-stats { margin-bottom: 20px; }
    .stat-row { margin-bottom: 12px; }
    .stat-meta { display: flex; justify-content: space-between; font-family: 'Orbitron'; font-size: 0.6rem; font-weight: 900; color: var(--accent-cyan); margin-bottom: 4px; }
    .stat-bar-bg { height: 8px; background: #000; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; }
    .stat-bar-fill { height: 100%; background: var(--accent-gold); transition: width 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

    /* CLAIM ZONE */
    .claim-zone {
        padding: 20px;
        background: rgba(0,0,0,0.4);
        border-top: 1px solid rgba(255,255,255,0.05);
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .reward-row { display: flex; justify-content: space-between; align-items: flex-end; }
    .reward-skate { font-family: 'Bangers'; font-size: 2rem; color: #fff; line-height: 1; }
    .reward-usd { font-family: 'Inter'; font-size: 0.8rem; color: var(--accent-green); font-weight: 900; }
    
    .claim-btn { 
        background: var(--accent-cyan); 
        color: #000; 
        border: none; 
        padding: 12px; 
        font-family: 'Orbitron'; 
        font-weight: 900; 
        font-size: 0.8rem; 
        cursor: pointer;
        clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
        transition: 0.2s;
    }
    .claim-btn:hover { background: #fff; transform: scale(1.02); }
</style>

<script>
    // Logic for Reward Calculation with $SKATE/USD pairing
    function renderNFTCard(nft, skateUsdPrice) {
        const m = nft.data; 
        const t = nft.template ? nft.template.immutable_data : {};
        const rarity = (m.rarity || 'common').toLowerCase();
        
        // STANDARD REWARD LOGIC: 1000 $SKATE base
        const skateReward = 1000; 
        const usdValue = (skateReward * skateUsdPrice).toFixed(2);

        return `
            <div class="skate-card">
                <div class="rarity-header" style="background: var(--rarity-${rarity});">
                    ${rarity} EDITION
                </div>
                <div class="img-wrap"><img src="https://ipfs.io/ipfs/${m.img || t.img}" class="skate-img"></div>
                <div class="card-body">
                    <div class="board-name">${nft.name}</div>
                    
                    <div class="hud-stats">
                        <div class="stat-row">
                            <div class="stat-meta">SPEED <span>${m.speed || 0}/10</span></div>
                            <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(m.speed || 0) * 10}%"></div></div>
                        </div>
                        <div class="stat-row">
                            <div class="stat-meta">POP <span>${m.pop || 0}/10</span></div>
                            <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(m.pop || 0) * 10}%; background:var(--thps-blue);"></div></div>
                        </div>
                    </div>
                    <div style="font-size:0.6rem; color:#666; font-family:'Orbitron';">
                        PART ID: #${nft.asset_id} | WAX PROTOCOL
                    </div>
                </div>
                <div class="claim-zone">
                    <div class="reward-row">
                        <div class="reward-skate">🛹 ${skateReward.toLocaleString()} $SKATE</div>
                        <div class="reward-usd">$${usdValue} USD</div>
                    </div>
                    <button class="claim-btn">CLAIM REWARDS</button>
                </div>
            </div>
        `;
    }
</script>
</body>
</html>
