<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WAC ARTIST COLLABS | PRO SELECTION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050a1a;
            --bg-panel: rgba(15, 26, 71, 0.85);
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
            --thps-blue: #0066ff;
            
            /* Rarity Tiers */
            --common: #a0a0a0; 
            --uncommon: #4caf50; 
            --rare: #2196f3; 
            --mythic: #9c27b0; 
            --legendary: #ff9800; 
            --epic: #ff2d55; 
            --ridiculous: #00f0ff;
        }

        body {
            background-color: var(--bg-deep);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            margin: 0; 
            padding: 0;
            background-image: 
                radial-gradient(circle at 50% 0%, #162a5e 0%, transparent 70%),
                linear-gradient(0deg, rgba(0,240,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,240,255,0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            overflow-x: hidden;
        }

        /* Standardized Navigation */
        nav {
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid var(--accent-cyan);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 900;
            letter-spacing: 2px;
            transition: 0.2s;
        }

        nav a:hover, nav a.active {
            color: var(--accent-cyan);
            text-shadow: 0 0 10px var(--accent-cyan);
        }

        header {
            text-align: center;
            margin: 2rem 0;
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 4rem;
            color: #fff;
            margin: 0;
            -webkit-text-stroke: 1px var(--thps-blue);
            text-shadow: 4px 4px 0px var(--thps-blue);
            letter-spacing: 3px;
        }

        .subtitle {
            color: var(--accent-cyan);
            font-size: 0.8rem;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        /* 12-Item Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto 50px auto;
            padding: 0 20px;
        }

        /* Video Game Character Select Card */
        .board-card {
            background: var(--bg-panel);
            border: 2px solid rgba(255,255,255,0.2);
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% 95%, 90% 100%, 0 100%);
            display: flex;
            flex-direction: column;
            padding: 15px;
            transition: all 0.2s ease-out;
            cursor: crosshair;
        }

        .board-card:hover {
            border-color: var(--accent-cyan);
            transform: scale(1.05) translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 240, 255, 0.2);
            z-index: 10;
            background: rgba(15, 26, 71, 1);
        }

        .rarity-badge {
            position: absolute;
            top: 5px;
            left: -5px;
            padding: 3px 12px;
            font-size: 0.65rem;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.5);
            transform: rotate(-3deg);
            z-index: 5;
            color: #fff;
            letter-spacing: 1px;
        }

        /* Live IPFS Image */
        .nft-image {
            width: 100%;
            height: 180px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(5px 5px 5px rgba(0,0,0,0.8));
            transition: 0.3s;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
        }

        .board-card:hover .nft-image {
            transform: rotate(3deg) scale(1.05);
        }

        .board-name {
            font-family: 'Bangers', cursive;
            font-size: 1.6rem;
            color: var(--accent-gold);
            line-height: 1;
            margin: 0 0 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist-name {
            font-size: 0.55rem;
            color: #aaa;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* THPS HUD Progress Bars */
        .hud-stats { margin-bottom: 15px; }
        .stat-row { margin-bottom: 6px; }
        .stat-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.55rem;
            color: var(--accent-cyan);
            font-weight: 900;
            margin-bottom: 2px;
        }
        .stat-bar-bg {
            width: 100%;
            height: 8px;
            background: #000;
            border: 1px solid #333;
            border-radius: 2px;
            overflow: hidden;
        }
        .stat-bar-fill {
            height: 100%;
            transition: width 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Hardware Specs */
        .hardware-box {
            background: rgba(0,0,0,0.6);
            padding: 8px;
            border-left: 2px solid var(--accent-cyan);
            font-size: 0.5rem;
            color: #ccc;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        /* Reward Zone */
        .reward-zone {
            margin-top: auto;
            border-top: 1px dashed rgba(255,255,255,0.2);
            padding-top: 10px;
            text-align: right;
        }
        .reward-label { font-size: 0.5rem; color: #888; }
        .reward-amount {
            font-size: 1.3rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        .board-card:hover .reward-amount {
            color: var(--accent-gold);
            text-shadow: 0 0 15px var(--accent-gold);
        }

        @media (max-width: 1100px) { .dashboard-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="#" class="active">HOME</a></li>
            <li><a href="#">VIDEOS</a></li>
            <li><a href="#">DEFI</a></li>
            <li><a href="#">TREASURY</a></li>
            <li><a href="#">DAO</a></li>
        </ul>
    </nav>

    <header>
        <h1>BOARD SELECTION</h1>
        <div class="subtitle">LIVE BLOCKCHAIN SYNC // PRO METADATA</div>
    </header>

    <div class="dashboard-grid" id="roster">
        <div style="grid-column: 1/-1; text-align: center; color: var(--accent-cyan); padding: 50px;">
            <h2>DOWNLOADING IPFS ASSETS...</h2>
        </div>
    </div>

<script>
    const ATOMIC_API = "https://wax.api.atomicassets.io/atomicassets/v1";
    
    // Requested Targets
    const TARGET_IDS = ["854945", "857734", "1099949334880", "847825", "791658"];
    
    // Fixed Rewards
    const REWARDS = {
        'common': { val: 100, color: 'var(--common)' },
        'uncommon': { val: 250, color: 'var(--uncommon)' },
        'rare': { val: 500, color: 'var(--rare)' },
        'mythic': { val: 1000, color: 'var(--mythic)' },
        'legendary': { val: 2000, color: 'var(--legendary)' },
        'epic': { val: 5000, color: 'var(--epic)' },
        'ridiculous': { val: 10000, color: 'var(--ridiculous)' }
    };

    async function loadLiveRoster() {
        const rosterContainer = document.getElementById('roster');
        const displayData = [];
        const artistsFound = new Set();

        try {
            // 1. Fetch Priority Boards
            for (let id of TARGET_IDS) {
                try {
                    const endpoint = id.length < 10 ? `/assets?template_id=${id}&limit=1` : `/assets/${id}`;
                    const res = await fetch(`${ATOMIC_API}${endpoint}`);
                    const json = await res.json();
                    
                    if (json.success) {
                        const nft = Array.isArray(json.data) ? json.data[0] : json.data;
                        if (nft) processBoard(nft, artistsFound, displayData);
                    }
                } catch (e) { console.log(`Skipped ${id}`); }
            }

            // 2. Fill Remaining Slots
            if (displayData.length < 12) {
                const res = await fetch(`${ATOMIC_API}/assets?collection_name=skatecoinwax&schema_name=skateboards&limit=50&order=desc`);
                const json = await res.json();
                if (json.success) {
                    for (let nft of json.data) {
                        if (displayData.length < 12) processBoard(nft, artistsFound, displayData);
                    }
                }
            }

            renderRoster(displayData, rosterContainer);

        } catch (error) {
            rosterContainer.innerHTML = `<h2 style="color:red; text-align:center; grid-column:1/-1;">API Connection Failed</h2>`;
        }
    }

    function processBoard(nft, artistSet, list) {
        const m = nft.data;
        const artist = m.artist || "Unknown";
        
        if (artistSet.has(artist)) return;
        artistSet.add(artist);

        const rarityKey = (m.rarity || "common").toLowerCase();
        const rarityData = REWARDS[rarityKey] || REWARDS['common'];
        const imgHash = m.img || nft.template.immutable_data.img;

        list.push({
            name: nft.name || m.name,
            artist: artist,
            rarity: m.rarity || "Common",
            color: rarityData.color,
            reward: rarityData.val,
            imgUrl: `https://ipfs.io/ipfs/${imgHash}`,
            speed: parseInt(m.speed) || Math.floor(Math.random() * 6) + 4,
            pop: parseInt(m.pop) || Math.floor(Math.random() * 6) + 4,
            bal: parseInt(m.balance) || Math.floor(Math.random() * 6) + 4,
            deck: m.deck || "Hybrid Creatures",
            trucks: m.trucks || "Gold/Red",
            wheels: m.wheels || "Purple",
            bearings: m.bearings || "RGB"
        });
    }

    function renderRoster(list, container) {
        let html = '';
        list.forEach(b => {
            html += `
            <div class="board-card">
                <div class="rarity-badge" style="background: ${b.color}; color: ${b.rarity.toLowerCase() === 'common' ? '#000' : '#fff'}">${b.rarity}</div>
                
                <img src="${b.imgUrl}" class="nft-image" onerror="this.src='https://via.placeholder.com/300?text=Syncing...'">

                <div class="board-name">${b.name}</div>
                <div class="artist-name">PRO: <span style="color:var(--accent-cyan)">${b.artist}</span></div>

                <div class="hud-stats">
                    <div class="stat-row">
                        <div class="stat-label">SPEED <span>${b.speed}/10</span></div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 0%; background:var(--accent-gold); box-shadow: 0 0 8px var(--accent-gold);" data-target="${b.speed * 10}%"></div></div>
                    </div>
                    <div class="stat-row">
                        <div class="stat-label">POP <span>${b.pop}/10</span></div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 0%; background:var(--accent-cyan); box-shadow: 0 0 8px var(--accent-cyan);" data-target="${b.pop * 10}%"></div></div>
                    </div>
                    <div class="stat-row">
                        <div class="stat-label">BALANCE <span>${b.bal}/10</span></div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: 0%; background:var(--epic); box-shadow: 0 0 8px var(--epic);" data-target="${b.bal * 10}%"></div></div>
                    </div>
                </div>

                <div class="hardware-box">
                    <strong>DECK:</strong> ${b.deck}<br>
                    <strong>TRUCKS:</strong> ${b.trucks}<br>
                    <strong>WHEELS:</strong> ${b.wheels} | <strong>BRG:</strong> ${b.bearings}
                </div>

                <div class="reward-zone">
                    <div class="reward-label">COLLECTION VALUE</div>
                    <div class="reward-amount">${b.reward.toLocaleString()} $SKATE</div>
                </div>
            </div>`;
        });

        container.innerHTML = html;

        // Trigger animations after render
        setTimeout(() => {
            const bars = document.querySelectorAll('.stat-bar-fill');
            bars.forEach(bar => { bar.style.width = bar.getAttribute('data-target'); });
        }, 100);
    }

    // Initialize
    loadLiveRoster();
</script>
</body>
</html>
