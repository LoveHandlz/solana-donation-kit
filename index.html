<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SK8COIN | Skate2Earn 6.9.2 (IG Feed Edition)</title>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data:; audio-src 'self' https:;">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Bangers&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
  
  <script async src="//www.instagram.com/embed.js"></script>

<style>
:root {
  --bg-deep:#0a132f;
  --bg-panel:#0f1a47;
  --accent-red:#ff2d55;
  --accent-orange:#ff9500;
  --accent-cyan:#00f0ff;
  --accent-gold:#ffd700; 
  --accent-green:#4ade80;
  --text-primary:#e0f7ff;
  --text-secondary:#a5d8ff;
  --card-border:rgba(0,240,255,0.14);
  
  --bronze-font: #cd7f32;
  --silver-font: #c0c0c0;
  --gold-font: #ffd700;
  --diamond-font: #b9f2ff;
}

*{margin:0;padding:0;box-sizing:border-box;}

html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

body{
  background:var(--bg-deep);
  color:var(--text-primary);
  font-family:'Orbitron',sans-serif;
  line-height: 1.6;
}

header{
  background:rgba(10,19,47,0.95);
  backdrop-filter:blur(12px);
  position:fixed;
  top:0;left:0;right:0;
  z-index:100;
  border-bottom:1px solid var(--card-border);
}

.header-inner{
  max-width:1440px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding: 1rem 20px;
  position: relative;
}

.logo{height:45px; z-index: 101;}

nav#mobile-nav { 
    display: flex; 
    flex: 1; 
    justify-content: center; 
}
nav#mobile-nav ul {
    display:flex;
    gap:1.8rem;
    list-style:none;
}
nav#mobile-nav a {
    color:var(--text-secondary);
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
    font-size:0.9rem;
    letter-spacing: 1px;
}
nav#mobile-nav a:hover{color:var(--accent-gold);}

.header-controls {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 15px;
    z-index: 101;
}

.hamburger {
    display: none;
    font-size: 1.8rem;
    color: var(--accent-gold);
    cursor: pointer;
    transition: 0.3s;
}
.hamburger:hover { color: var(--accent-cyan); }

.wallet-btn {
  background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange));
  border: none;
  padding: .7rem 1.4rem;
  border-radius: 50px;
  cursor: pointer;
  font-family: 'Orbitron';
  font-weight: bold;
  color: #000;
  transition: 0.3s;
  white-space: nowrap;
}

main {
  padding-top: 120px; 
  max-width: 1440px;
  margin: auto;
  padding-left: 20px;
  padding-right: 20px;
  padding-bottom: 60px;
}

.hero { text-align: center; margin-bottom: 2.5rem; }
.hero h1 { 
  font-size: 4.5rem;
  background: linear-gradient(to bottom, #fff, var(--accent-gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  line-height: 1.1;
}

.hero-subtext {
  font-size: 1.3rem; 
  margin: 1rem auto 2rem; 
  color: var(--text-secondary); 
  max-width: 720px;
}

.stats-row {
  display: flex;
  justify-content: center;
  gap: 3rem;
  margin-top: 1.5rem;
}
.stat { font-size: 0.9rem; color: var(--text-secondary); text-transform: uppercase; }
.stat-value { display: block; font-size: 2rem; color: var(--accent-gold); font-weight: 900; }

.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.5rem;
}
.menu-item {
  background: var(--bg-panel);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 2rem;
  cursor: pointer;
  transition: 0.3s;
}
.menu-item:hover {
  border-color: var(--accent-gold);
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(255, 215, 0, 0.1);
}
.menu-icon { font-size: 2.2rem; margin-bottom: 0.8rem; }
.menu-title { font-size: 1.1rem; font-weight: 900; margin-bottom: 0.5rem; color: var(--accent-cyan); }
.menu-desc { font-size: 0.8rem; color: var(--text-secondary); }

/* VIDEO GRID (HOME) */
.video-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1.5rem;
}
.video-card {
  background: var(--bg-panel);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  overflow: hidden;
  transition: 0.3s;
  position: relative;
  width: 100%;
}
.video-card:hover { border-color: var(--accent-gold); transform: scale(1.02); }
.video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; background: #000;}
.video-wrapper iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:none; z-index: 1;}

.video-mask {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(45deg, rgba(10,19,47,0.98), rgba(15,26,71,0.95));
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  z-index: 10; transition: 0.4s ease;
}
.video-mask i { font-size: 2rem; color: var(--accent-gold); margin-bottom: 8px; }
.video-mask p { font-size: 0.6rem; letter-spacing: 2px; color: #fff; text-transform: uppercase; font-weight: bold;}
.unlocked .video-mask { opacity: 0; pointer-events: none; visibility: hidden; }

.donate-btn {
  background: var(--accent-gold);
  color: #000;
  border: none;
  padding: 10px;
  border-radius: 6px;
  font-family: 'Orbitron';
  font-weight: 900;
  font-size: 0.75rem;
  cursor: pointer;
  width: 100%;
}

.view-profile-btn {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--card-border);
    margin-top: 8px;
    padding: 8px;
    font-size: 0.7rem;
    cursor: pointer;
    width: 100%;
    text-transform: uppercase;
    font-family: 'Orbitron';
    transition: 0.3s;
    border-radius: 6px;
}
.view-profile-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }

/* PROFILE PAGE STYLES */
#profile-content {
    background: linear-gradient(145deg, var(--bg-panel), #050a1f);
    border: 1px solid var(--accent-gold);
    border-radius: 20px;
    padding: 2.5rem;
    max-width: 1100px;
    margin: auto;
    box-shadow: 0 0 50px rgba(0, 240, 255, 0.05);
}

.profile-layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 40px;
}

.profile-pic {
    width: 100%;
    max-width: 250px;
    border-radius: 20px;
    border: 3px solid var(--accent-cyan);
    margin-bottom: 25px;
    object-fit: cover;
    transition: all 0.3s ease;
}

.style-tag {
    display: inline-block;
    padding: 8px 16px;
    background: rgba(0, 240, 255, 0.1);
    color: var(--accent-cyan);
    border-radius: 50px;
    font-size: 0.75rem;
    margin: 6px;
    border: 1px solid var(--accent-cyan);
    letter-spacing: 0.5px;
}

.gear-tag {
    display: inline-block;
    padding: 6px 12px;
    background: rgba(255, 215, 0, 0.05);
    color: var(--text-secondary);
    border-radius: 6px;
    font-size: 0.65rem;
    margin: 6px;
    border: 1px solid rgba(255, 215, 0, 0.3);
    text-transform: uppercase;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.5px;
}
.gear-tag i { color: var(--accent-gold); margin-right: 5px; }

/* FEED CONTAINER STYLING */
.ig-feed-wrapper {
    width: 100%;
    min-height: 450px;
    background: #000;
    border-radius: 16px;
    border: 1px solid var(--card-border);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.leaderboard-container { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 2rem; }
.leaderboard-box { background: var(--bg-panel); border: 1px solid var(--accent-cyan); border-radius: 16px; padding: 1.5rem; }

.modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100vh; background:rgba(0,0,0,0.9); z-index:1000; justify-content:center; align-items:center; }
.modal-content { 
    background:var(--bg-panel); padding:2rem; border-radius:15px; border:1px solid var(--accent-gold); width:92%; max-width:400px; text-align: center; position: relative; 
}

@media (max-width: 768px) { 
    .hamburger { display: block; } 
    .profile-layout { grid-template-columns: 1fr; text-align: center; gap: 30px;}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <img src="https://i.postimg.cc/VSvxfXsr/sk8coin-logo-biig.png" class="logo" onclick="navigateTo('home')" style="cursor:pointer;">
    <nav id="mobile-nav">
        <ul>
          <li><a href="javascript:void(0)" onclick="navigateTo('home')">HOME</a></li>
          <li><a href="javascript:void(0)" onclick="navigateTo('video')">VIDEOS</a></li>
          <li><a href="javascript:void(0)" onclick="navigateTo('leaderboard')">LEADERBOARD</a></li>
          <li><a href="javascript:void(0)" onclick="navigateTo('donate')">TREASURY</a></li>
        </ul>
    </nav>
    <div class="header-controls">
        <div id="wallet-ui" style="display: flex; align-items: center; gap: 10px;">
            <div id="skater-auth-panel" style="display: none; align-items: center; gap: 6px; background: rgba(0, 240, 255, 0.05); padding: 4px 10px; border-radius: 50px; border: 1px solid var(--accent-cyan);">
                <span id="auth-skater-rank" style="font-size: 0.6rem; color: #fff; font-weight: bold;">RANK: PRO</span>
                <button onclick="navigateToProfileView('skater')" style="background: var(--accent-cyan); color: #000; border: none; padding: 3px 8px; border-radius: 20px; font-size: 0.6rem; font-weight: 900; cursor: pointer;">⚙️</button>
            </div>
            <div id="wallet-balance-container" style="display: none; align-items: center; gap: 6px; background: rgba(255,255,255,0.05); padding: 5px 10px; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.1);">
                <span id="sol-balance" style="font-size: 0.65rem; color: #fff; font-weight: 900;">0.00 SOL</span>
            </div>
            <button id="connect-wallet-btn" class="wallet-btn" onclick="handleWalletAction()">CONNECT</button>
        </div>
    </div>
  </div>
</header>

<main>
  <div id="home-content">
    <section class="hero"><h1>SKATE2EARN</h1><p class="hero-subtext">The decentralized street culture protocol.</p></section>
    <div class="menu-grid">
      <div class="menu-item" onclick="navigateTo('video')">
        <div class="menu-icon">📺</div>
        <div class="menu-title">VIDEOS</div>
        <div class="menu-desc">Watch videos and sponsor skaters.</div>
      </div>
      <div class="menu-item" onclick="navigateTo('donate')">
        <div class="menu-icon" style="color: var(--accent-gold);">💸</div>
        <div class="menu-title">TREASURY</div>
        <div class="menu-desc">Fuel the community movement.</div>
      </div>
    </div>
  </div>

  <div id="video-content" style="display:none;">
    <div class="hero"><h1 style="font-size:2.8rem;">SK8 VIDEOS</h1></div>
    <div class="video-grid" id="main-video-grid"></div>
  </div>

  <div id="profile-content" style="display:none;">
    <div class="profile-layout">
        <div class="profile-sidebar" style="text-align: center;">
            <img id="p-img" src="" class="profile-pic">
            <h2 id="p-name" style="font-family:'Bangers'; font-size:3rem; margin-bottom: 10px;"></h2>
            <div id="p-tags" style="margin-bottom: 20px;"></div>
            <div id="p-gear" style="margin-bottom: 25px;"></div>
            
            <div style="background:rgba(0,0,0,0.4); padding:20px; border-radius:15px; border:1px dashed var(--accent-gold);">
                <p id="p-wallet" style="font-family:monospace; font-size:0.55rem; word-break:break-all; color: var(--text-secondary); margin-bottom: 15px;"></p>
                <button id="edit-profile-btn" onclick="openEditModal()" class="wallet-btn" style="display:none; width:100%; background: #fff; color: #000; padding: 12px; font-size: 0.8rem; margin-bottom: 10px;">⚙️ EDIT PROFILE</button>
                <button id="profile-donate-btn" onclick="openSponsorshipModalFromProfile()" class="donate-btn">BLESS SKATER</button>
            </div>
        </div>
        <div class="profile-main">
            <h3 style="color:var(--accent-gold); margin-bottom:20px;">BIO & STYLE</h3>
            <p id="p-bio" style="color:var(--text-secondary); line-height:1.7; margin-bottom:25px; font-size: 1rem;"></p>
            
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom: 30px;">
                <div style="background:var(--bg-panel); padding:18px; border-radius:12px; border:1px solid var(--card-border);"><p style="font-size:0.6rem;">RANK</p><p id="p-rank" style="font-weight:900;"></p></div>
                <div style="background:var(--bg-panel); padding:18px; border-radius:12px; border:1px solid var(--card-border);"><p style="font-size:0.6rem;">BLESSINGS</p><p id="p-blessings" style="color:var(--accent-green); font-weight:900;">0.00 SOL</p></div>
            </div>
            
            <div id="p-ig-feed-section" style="display:none; margin-bottom: 35px;">
                <h3 style="color:var(--accent-gold); margin-bottom:20px; font-size: 1.1rem; border-bottom: 1px solid var(--card-border); padding-bottom: 10px;">📸 INSTAGRAM FEED</h3>
                <div id="ig-feed-container" class="ig-feed-wrapper">
                    </div>
            </div>

            <button onclick="navigateTo('home')" class="view-profile-btn" style="padding:15px; font-weight: bold; width: auto;">BACK TO HOME</button>
        </div>
    </div>
  </div>
</main>

<div id="edit-modal" class="modal-overlay">
  <div class="modal-content">
    <h3 style="color:var(--accent-gold); margin-bottom: 20px;">UPDATE PROFILE</h3>
    <input type="text" id="edit-name" placeholder="Name" style="width:100%; padding:10px; margin-bottom:12px; background:#000; color:#fff; border:1px solid var(--accent-cyan); border-radius:5px;">
    <input type="text" id="edit-pic" placeholder="Pic URL" style="width:100%; padding:10px; margin-bottom:12px; background:#000; color:#fff; border:1px solid var(--accent-cyan); border-radius:5px;">
    
    <label style="font-size: 0.65rem; color: var(--accent-gold);">INSTAGRAM REEL / POST LINK</label>
    <input type="text" id="edit-ig" placeholder="https://instagram.com/reel/..." style="width:100%; padding:10px; margin-bottom:12px; background:#000; color:#fff; border:1px solid var(--accent-gold); border-radius:5px;">
    
    <textarea id="edit-bio" placeholder="Bio" rows="3" style="width:100%; padding:10px; margin-bottom:15px; background:#000; color:#fff; border:1px solid var(--accent-cyan); border-radius:5px;"></textarea>
    <button onclick="saveProfileWeb3()" id="save-btn" class="donate-btn">SIGN & SAVE</button>
    <button onclick="closeEditModal()" style="width:100%; background:transparent; border:none; color:#888; margin-top:10px;">[ CANCEL ]</button>
  </div>
</div>

<script>
let publicKey = null; let provider = null; let activeTarget = "";
const RPC_URL = "https://solana-rpc.publicnode.com";
const TREASURY = "5xC5dQwRTqt6GvLurRJ4yxpBPmYM9egXQ1NokH4xFTNc";
const MEMO_ID = new solanaWeb3.PublicKey("MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr");

const SKATER_REGISTRY = ["FqEnog4mFG3tGqnqG2dVwPHwPitxTRenr1zfvBxQZMsW","GzTbU3tnUCm6Y55Jxo1cPoBNkEzvRPeM3HDYcZqyCqPZ"];
const SKATER_PROFILES = [
    { wallet: "FqEnog4mFG3tGqnqG2dVwPHwPitxTRenr1zfvBxQZMsW", name: "GREG VALENCIA", ig: "https://www.instagram.com/reels/DAp8P9vS7zV/", pic: "https://i.pravatar.cc/400?img=11", styles: ["Street"] },
    { wallet: "GzTbU3tnUCm6Y55Jxo1cPoBNkEzvRPeM3HDYcZqyCqPZ", name: "GAP KILLER", ig: "https://www.instagram.com/reels/DAp8P9vS7zV/", pic: "https://i.pravatar.cc/400?img=12", styles: ["Gaps"] }
];

async function handleWalletAction() {
    if (publicKey) { publicKey = null; updateUI(); return; }
    provider = window.phantom?.solana;
    if (!provider) { alert("Phantom required"); return; }
    const resp = await provider.connect();
    publicKey = resp.publicKey.toString();
    updateUI();
}

function updateUI() {
    const btn = document.getElementById("connect-wallet-btn");
    btn.innerText = publicKey ? "CONNECTED" : "CONNECT";
    document.getElementById("skater-auth-panel").style.display = publicKey ? "flex" : "none";
    document.getElementById("wallet-balance-container").style.display = publicKey ? "flex" : "none";
}

/* STRATEGIC MEDIA RENDERER */
function getIGEmbed(url) {
    if (!url) return "";
    const cleanUrl = url.split('?')[0];
    return `<blockquote class="instagram-media" data-instgrm-permalink="${cleanUrl}" data-instgrm-version="14" style="width:100%;"></blockquote>`;
}

async function renderProfile(wallet) {
    const sk = SKATER_PROFILES.find(s => s.wallet === wallet) || { name: "Anon", styles: ["New"], pic: "https://i.pravatar.cc/400?u="+wallet, ig: "" };
    
    // FETCH ON-CHAIN MEMO FOR PROFILE OVERRIDE
    try {
        const sigs = await new solanaWeb3.Connection(RPC_URL, "confirmed").getSignaturesForAddress(new solanaWeb3.PublicKey(wallet), { limit: 5 });
        for (let s of sigs) { if(s.memo && s.memo.includes('"sk8":"v1"')) { 
            const d = JSON.parse(s.memo.replace(/^\[\d+\]\s*/, ''));
            sk.name = d.name || sk.name; sk.pic = d.pic || sk.pic; sk.bio = d.bio || sk.bio; sk.ig = d.ig || sk.ig; break;
        } }
    } catch(e) {}

    document.getElementById('p-name').innerText = sk.name;
    document.getElementById('p-img').src = sk.pic;
    document.getElementById('p-wallet').innerText = wallet;
    document.getElementById('p-bio').innerText = sk.bio || "No bio set.";
    document.getElementById('p-tags').innerHTML = sk.styles.map(t => `<span class="style-tag">${t}</span>`).join('');
    
    const feedSec = document.getElementById('p-ig-feed-section');
    const container = document.getElementById('ig-feed-container');

    if (sk.ig) {
        feedSec.style.display = 'block';
        container.innerHTML = getIGEmbed(sk.ig);
        // STRATEGIC: HYDRATE THE EMBED
        if (window.instgrm) {
            window.instgrm.Embeds.process();
        }
    } else {
        feedSec.style.display = 'none';
    }

    const isOwner = publicKey === wallet;
    document.getElementById('edit-profile-btn').style.display = isOwner ? 'block' : 'none';
    document.getElementById('profile-donate-btn').style.display = isOwner ? 'none' : 'block';
    activeTarget = wallet;
}

function navigateTo(page, wallet = null) {
    ["home", "video", "leaderboard", "donate", "profile"].forEach(id => document.getElementById(id + "-content").style.display = 'none');
    document.getElementById(page + "-content").style.display = 'block';
    if(page === 'profile' && wallet) renderProfile(wallet);
    window.scrollTo(0,0);
}

function openEditModal() {
    document.getElementById('edit-name').value = document.getElementById('p-name').innerText;
    document.getElementById('edit-pic').value = document.getElementById('p-img').src;
    document.getElementById('edit-bio').value = document.getElementById('p-bio').innerText;
    document.getElementById('edit-ig').value = ""; // Populate from data if needed
    document.getElementById('edit-modal').style.display = 'flex';
}

function closeEditModal() { document.getElementById('edit-modal').style.display = 'none'; }

async function saveProfileWeb3() {
    const name = document.getElementById("edit-name").value;
    const pic = document.getElementById("edit-pic").value;
    const bio = document.getElementById("edit-bio").value;
    const ig = document.getElementById("edit-ig").value;
    
    const data = JSON.stringify({ sk8: "v1", name, pic, bio, ig });
    const encoded = new TextEncoder().encode(data);
    
    const conn = new solanaWeb3.Connection(RPC_URL, "confirmed");
    const tx = new solanaWeb3.Transaction().add(new solanaWeb3.TransactionInstruction({
        keys: [{ pubkey: new solanaWeb3.PublicKey(publicKey), isSigner: true, isWritable: true }],
        programId: MEMO_ID,
        data: encoded
    }));
    
    tx.recentBlockhash = (await conn.getLatestBlockhash()).blockhash;
    tx.feePayer = new solanaWeb3.PublicKey(publicKey);
    const signed = await provider.signTransaction(tx);
    await conn.sendRawTransaction(signed.serialize());
    alert("Profile Saved!");
    closeEditModal();
}
</script>
</body>
</html>
