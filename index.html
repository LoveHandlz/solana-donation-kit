<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WAX ARTIST COLLABS | SEASON 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a132f;
            --bg-panel: rgba(15, 26, 71, 0.95);
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
            /* Reward Tiers */
            --common: #888; --uncommon: #4caf50; --rare: #2196f3; 
            --mythic: #9c27b0; --legendary: #ff9800; --epic: #ff2d55; 
            --ridiculous: #00f0ff;
        }

        body {
            background: var(--bg-deep);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 20px;
            background-image: radial-gradient(circle at 50% 50%, #162a5e 0%, #0a132f 100%);
        }

        header { text-align: center; margin-bottom: 2rem; }
        h1 {
            font-family: 'Bangers', cursive;
            font-size: 3.5rem;
            color: #fff;
            margin: 0;
            text-shadow: 4px 4px 0px #0066ff;
            letter-spacing: 2px;
        }

        /* FORCED 12-ITEM GRID (4 COLUMNS) */
        .pro-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1440px;
            margin: auto;
        }

        .board-card {
            background: var(--bg-panel);
            border: 2px solid #fff;
            padding: 15px;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% 92%, 92% 100%, 0 100%);
            display: flex;
            flex-direction: column;
            transition: 0.3s;
        }

        .board-card:hover { border-color: var(--accent-cyan); transform: scale(1.02); }

        .rarity-tag {
            position: absolute;
            top: 5px; left: -5px;
            padding: 2px 10px;
            font-weight: 900;
            font-size: 0.6rem;
            transform: rotate(-5deg);
            box-shadow: 2px 2px 0 #000;
            text-transform: uppercase;
        }

        .nft-img { width: 100%; aspect-ratio: 1/1; background: #000; border-radius: 4px; margin-bottom: 10px; object-fit: contain; }

        /* THPS STYLE STATS */
        .stat-bar-container { margin: 8px 0; }
        .stat-label { font-size: 0.5rem; color: var(--accent-cyan); display: flex; justify-content: space-between; }
        .stat-bg { background: #111; height: 8px; border: 1px solid #444; margin-top: 2px; }
        .stat-fill { background: var(--accent-gold); height: 100%; box-shadow: 0 0 8px var(--accent-gold); }

        .meta-text { font-size: 0.55rem; color: #aaa; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 4px; margin: 10px 0; }
        .reward-box { text-align: center; border-top: 1px dashed #444; padding-top: 10px; margin-top: auto; }
        .skate-val { font-weight: 900; color: #fff; font-size: 1.1rem; }

        .collect-btn {
            width: 100%; background: #fff; color: #000; border: none; padding: 10px;
            font-family: 'Orbitron'; font-weight: 900; cursor: pointer; margin-top: 10px; font-size: 0.7rem;
        }
        .collect-btn:hover { background: var(--accent-gold); }
    </style>
</head>
<body>

<header>
    <h1>WAC ARTIST COLLABS: S1</h1>
    <p style="color: var(--accent-cyan); font-size: 0.7rem;">DECODING UNIQUE ARTIST METADATA</p>
</header>

<div id="grid-mount" class="pro-grid">
    <div style="grid-column: 1/-1; text-align: center;">FETCHING 12 UNIQUE ARTISTS...</div>
</div>

<script>
    const HELIUS_KEY = "29c35e1d-2cbb-4f50-b9fd-7df5a828e6bb";
    const ATOMIC_API = "https://wax.api.atomicassets.io/atomicassets/v1";

    const REWARDS = {
        'common': 100, 'uncommon': 250, 'rare': 500,
        'mythic': 1000, 'legendary': 2000, 'epic': 5000, 'ridiculous': 10000
    };

    async function fetch12Frames() {
        const mount = document.getElementById('grid-mount');
        const artistsFound = new Set();
        const displayList = [];

        try {
            const res = await fetch(`${ATOMIC_API}/assets?collection_name=skatecoinwax&schema_name=skateboards&limit=100&order=desc&api_key=${HELIUS_KEY}`);
            const json = await res.json();

            if (json.success) {
                for (let nft of json.data) {
                    const m = nft.data;
                    const art = m.artist || "Pro Artist";

                    if (!artistsFound.has(art) && displayList.length < 12) {
                        artistsFound.add(art);
                        const rarity = (m.rarity || "common").toLowerCase();
                        
                        displayList.push({
                            id: nft.asset_id,
                            name: nft.name,
                            img: m.img || nft.template.immutable_data.img,
                            rarity: rarity,
                            artist: art,
                            pop: parseInt(m.pop) || Math.floor(Math.random() * 5) + 5,
                            speed: parseInt(m.speed) || Math.floor(Math.random() * 5) + 5,
                            balance: parseInt(m.balance) || Math.floor(Math.random() * 5) + 5,
                            deck: m.deck || "Hybrid Creatures",
                            trucks: m.trucks || "Gold/Red",
                            wheels: m.wheels || "Purple",
                            bearings: m.bearings || "RGB",
                            skate: REWARDS[rarity] || 100
                        });
                    }
                }
                render(displayList);
            }
        } catch (e) { mount.innerHTML = "SYNC ERROR"; }
    }

    function render(list) {
        document.getElementById('grid-mount').innerHTML = list.map(b => `
            <div class="board-card">
                <div class="rarity-tag" style="background:var(--${b.rarity})">${b.rarity}</div>
                <img src="https://ipfs.io/ipfs/${b.img}" class="nft-img">
                <div style="font-family:'Bangers'; color:var(--accent-gold); font-size:1.4rem;">${b.name}</div>
                <div style="font-size:0.5rem; color:#888;">ARTIST: ${b.artist}</div>

                <div class="stat-bar-container">
                    <div class="stat-label">POP <span>${b.pop}/10</span></div>
                    <div class="stat-bg"><div class="stat-fill" style="width:${b.pop*10}%"></div></div>
                </div>
                <div class="stat-bar-container">
                    <div class="stat-label">SPEED <span>${b.speed}/10</span></div>
                    <div class="stat-bg"><div class="stat-fill" style="width:${b.speed*10}%"></div></div>
                </div>
                <div class="stat-bar-container">
                    <div class="stat-label">BALANCE <span>${b.balance}/10</span></div>
                    <div class="stat-bg"><div class="stat-fill" style="width:${b.balance*10}%"></div></div>
                </div>

                <div class="meta-text">
                    DECK: ${b.deck}<br>
                    TRUCKS: ${b.trucks} | WHEELS: ${b.wheels}<br>
                    BEARINGS: ${b.bearings}
                </div>

                <div class="reward-box">
                    <div class="skate-val">${b.skate} $SKATE</div>
                    <button class="collect-btn" onclick="window.open('https://wax.atomichub.io/explorer/asset/${b.id}')">SELECT</button>
                </div>
            </div>
        `).join('');
    }

    fetch12Frames();
</script>
</body>
</html>
