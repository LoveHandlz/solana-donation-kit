<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SK8COIN | PRO COLLECTOR PORTAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a132f;
            --bg-panel: #0f1a47;
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
            --cc-red: #ff2d55;
            --card-border: rgba(0, 240, 255, 0.14);
            /* Rarity Colors */
            --common: #888; --uncommon: #4caf50; --rare: #2196f3; 
            --mythic: #9c27b0; --legendary: #ff9800; --epic: #ff2d55; 
            --ridiculous: #00f0ff;
        }

        body {
            background: var(--bg-deep);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1rem;
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 3rem;
            color: var(--accent-gold);
            margin: 0;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .collector-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            max-width: 1440px;
            margin: auto;
        }

        .collector-card {
            background: var(--bg-panel);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 1rem;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: 0.2s ease-in-out;
        }

        .collector-card:hover { border-color: var(--accent-cyan); transform: translateY(-3px); }

        .rarity-tag {
            position: absolute;
            top: 10px; right: 10px;
            font-size: 0.5rem;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .nft-img {
            width: 100%;
            aspect-ratio: 1/1;
            background: #000;
            border-radius: 5px;
            margin-bottom: 10px;
            object-fit: contain;
        }

        .meta-label { font-size: 0.55rem; color: var(--accent-cyan); margin-top: 4px; font-weight: bold;}
        .meta-val { color: #fff; font-size: 0.65rem; }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
            margin: 10px 0;
            background: rgba(0,0,0,0.2);
            padding: 5px;
            border-radius: 4px;
        }

        .stat-item { text-align: center; font-size: 0.5rem; color: #aaa; }
        .stat-num { display: block; color: var(--accent-gold); font-size: 0.75rem; font-weight: 900; }

        .reward-zone {
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: auto;
            padding-top: 10px;
            text-align: center;
        }

        .skate-amount { color: var(--accent-gold); font-size: 1.1rem; font-weight: 900; }
        .wax-price { font-size: 0.6rem; color: #4caf50; display: block; margin-bottom: 5px; }

        .claim-btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            font-family: 'Orbitron';
            font-weight: 900;
            font-size: 0.65rem;
            cursor: pointer;
        }

        @media (max-width: 1100px) { .collector-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

<header>
    <h1>UNIQUE SKATEBOARD COLLECTOR</h1>
    <p style="color: var(--accent-cyan); font-size: 0.7rem; letter-spacing: 1px;">SYNCING ATOMIC HUB // FILTERING UNIQUE ARTISTS</p>
</header>

<div id="collector-container" class="collector-grid">
    <div style="grid-column: 1/-1; text-align: center; padding: 50px;">INITIALIZING REWARD ENGINE...</div>
</div>

<script>
    const HELIUS_KEY = "29c35e1d-2cbb-4f50-b9fd-7df5a828e6bb";
    const ATOMIC_API = "https://wax.api.atomicassets.io/atomicassets/v1";

    const SKATE_TIERS = {
        'common': 100, 'uncommon': 250, 'rare': 500,
        'mythic': 1000, 'legendary': 2000, 'epic': 5000, 'ridiculous': 10000
    };

    async function fetchPortal() {
        const container = document.getElementById('collector-container');
        const artistsFound = new Set();
        const displayList = [];

        try {
            // Fetch assets from skateboards schema
            const response = await fetch(`${ATOMIC_API}/assets?collection_name=skatecoinwax&schema_name=skateboards&limit=100&order=desc&sort=created&api_key=${HELIUS_KEY}`);
            const result = await response.json();

            if (result.success) {
                for (let nft of result.data) {
                    const m = nft.data; // Metadata
                    const artist = m.artist || "Unknown";

                    if (!artistsFound.has(artist) && displayList.length < 12) {
                        artistsFound.add(artist);
                        
                        // Parse fixed fields + metadata scores
                        const rarity = (m.rarity || "common").toLowerCase();
                        const reward = SKATE_TIERS[rarity] || 100;
                        
                        // Attempt to find WAX price (if listed on market)
                        let waxPrice = "VIEW ON HUB";
                        if (nft.prices && nft.prices.length > 0) {
                            waxPrice = `${(nft.prices[0].amount / Math.pow(10, nft.prices[0].token_precision)).toFixed(2)} WAX`;
                        }

                        displayList.push({
                            id: nft.asset_id,
                            name: nft.name || m.name,
                            img: m.img || nft.template.immutable_data.img,
                            rarity: rarity,
                            artist: artist,
                            brand: m.brand || "Standard",
                            deck: m.deck || "Standard",
                            pop: m.pop || "0",
                            speed: m.speed || "0",
                            balance: m.balance || "0",
                            trucks: m.trucks || "Standard",
                            wheels: m.wheels || "Standard",
                            bearings: m.bearings || "Standard",
                            skateReward: reward,
                            waxPrice: waxPrice
                        });
                    }
                }
                renderGrid(displayList);
            }
        } catch (e) { container.innerHTML = "API SYNC ERROR"; }
    }

    function renderGrid(items) {
        const container = document.getElementById('collector-container');
        container.innerHTML = items.map(item => `
            <div class="collector-card">
                <span class="rarity-tag" style="background:var(--${item.rarity})">${item.rarity}</span>
                <img src="https://ipfs.io/ipfs/${item.img}" class="nft-img">
                
                <div class="meta-label">DECK / BRAND</div>
                <div class="meta-val">${item.deck} / ${item.brand}</div>
                
                <div class="stats-row">
                    <div class="stat-item">POP<span class="stat-num">${item.pop}</span></div>
                    <div class="stat-item">SPD<span class="stat-num">${item.speed}</span></div>
                    <div class="stat-item">BAL<span class="stat-num">${item.balance}</span></div>
                </div>

                <div class="meta-label">COMPONENTS</div>
                <div class="meta-val" style="font-size:0.5rem">TRUCKS: ${item.trucks} | WHEELS: ${item.wheels} | BRG: ${item.bearings}</div>

                <div class="reward-zone">
                    <span class="wax-price">${item.waxPrice}</span>
                    <div class="skate-amount">${item.skateReward} $SKATE</div>
                    <button class="claim-btn" onclick="window.open('https://wax.atomichub.io/explorer/asset/${item.id}', '_blank')">COLLECT</button>
                </div>
            </div>
        `).join('');
    }

    fetchPortal();
</script>
</body>
</html>
