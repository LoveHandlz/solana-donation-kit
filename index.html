<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SK8COIN | PRO SKATER SELECTION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a132f;
            --bg-panel: rgba(15, 26, 71, 0.9);
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
            --thps-blue: #0066ff;
            /* Rarity Tiers */
            --common: #888; --uncommon: #4caf50; --rare: #2196f3; 
            --mythic: #9c27b0; --legendary: #ff9800; --epic: #ff2d55; 
            --ridiculous: #00f0ff;
        }

        body {
            background: var(--bg-deep);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 20px;
            background-image: radial-gradient(circle at 50% 50%, #162a5e 0%, #0a132f 100%);
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 4rem;
            color: #fff;
            margin: 0;
            -webkit-text-stroke: 1px var(--thps-blue);
            text-shadow: 4px 4px 0px var(--thps-blue);
        }

        /* Forced 12 Grid matching Crypto Clips Standard */
        .pro-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 1400px;
            margin: auto;
        }

        .skater-card {
            background: var(--bg-panel);
            border: 3px solid #fff;
            padding: 10px;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% 90%, 90% 100%, 0 100%);
            transition: 0.2s;
        }

        .skater-card:hover {
            border-color: var(--accent-cyan);
            transform: skew(-2deg) scale(1.02);
            z-index: 10;
        }

        .rarity-banner {
            position: absolute;
            top: 5px; left: -5px;
            padding: 2px 10px;
            font-weight: 900;
            font-size: 0.6rem;
            transform: rotate(-5deg);
            box-shadow: 3px 3px 0 #000;
        }

        .nft-frame {
            width: 100%;
            aspect-ratio: 1/1;
            background: #000;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .deck-name {
            font-family: 'Bangers';
            font-size: 1.4rem;
            color: var(--accent-gold);
            margin: 5px 0;
            line-height: 1;
        }

        /* THPS Style Stats */
        .stat-group { margin: 8px 0; }
        .stat-label { font-size: 0.5rem; color: var(--accent-cyan); display: flex; justify-content: space-between; }
        .stat-bar-bg { background: #111; height: 8px; border: 1px solid #444; margin-top: 2px; position: relative; }
        .stat-bar-fill { background: var(--accent-gold); height: 100%; box-shadow: 0 0 8px var(--accent-gold); }

        .comp-list {
            font-size: 0.5rem;
            background: rgba(0,0,0,0.4);
            padding: 5px;
            border-radius: 3px;
            color: #ccc;
        }

        .reward-area {
            margin-top: 10px;
            text-align: right;
            border-top: 1px dashed #444;
            padding-top: 10px;
        }

        .skate-reward { font-weight: 900; color: #fff; font-size: 1.1rem; }
        .wax-val { font-size: 0.6rem; color: var(--accent-cyan); display: block; }

        .select-btn {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            padding: 8px;
            font-family: 'Orbitron';
            font-weight: 900;
            cursor: pointer;
            margin-top: 10px;
            clip-path: polygon(0 0, 100% 0, 100% 70%, 85% 100%, 0 100%);
        }

        .select-btn:hover { background: var(--accent-gold); }
    </style>
</head>
<body>

<header>
    <h1>SELECT YOUR BOARD</h1>
    <p style="letter-spacing: 4px; font-size: 0.7rem;">UNIQUE ARTIST SERIES // $SKATE REWARDS ENABLED</p>
</header>

<div id="grid-container" class="pro-grid">
    <div style="grid-column: 1/-1; text-align: center;">LOADING SKATERS...</div>
</div>

<script>
    const HELIUS_KEY = "29c35e1d-2cbb-4f50-b9fd-7df5a828e6bb";
    const ATOMIC_API = "https://wax.api.atomicassets.io/atomicassets/v1";

    const SKATE_VALUES = {
        'common': 100, 'uncommon': 250, 'rare': 500,
        'mythic': 1000, 'legendary': 2000, 'epic': 5000, 'ridiculous': 10000
    };

    async function loadProGrid() {
        const artists = new Set();
        const boards = [];

        try {
            const res = await fetch(`${ATOMIC_API}/assets?collection_name=skatecoinwax&schema_name=skateboards&limit=100&order=desc&api_key=${HELIUS_KEY}`);
            const json = await res.json();

            for (let nft of json.data) {
                const m = nft.data;
                const art = m.artist || "Pro";

                if (!artists.has(art) && boards.length < 12) {
                    artists.add(art);
                    
                    const rarity = (m.rarity || "common").toLowerCase();
                    const skate = SKATE_VALUES[rarity] || 100;
                    
                    // Stats normalization for THPS bars (out of 10)
                    const s_spd = parseInt(m.speed) || Math.floor(Math.random() * 5) + 3;
                    const s_pop = parseInt(m.pop) || Math.floor(Math.random() * 5) + 3;
                    const s_bal = parseInt(m.balance) || Math.floor(Math.random() * 5) + 3;

                    boards.push({
                        id: nft.asset_id,
                        name: nft.name,
                        img: m.img || nft.template.immutable_data.img,
                        rarity: rarity,
                        artist: art,
                        deck: m.deck || "Hybrid Creatures",
                        speed: s_spd, pop: s_pop, bal: s_bal,
                        trucks: m.trucks || "Gold/Red",
                        wheels: m.wheels || "Purple",
                        bearings: m.bearings || "RGB",
                        reward: skate,
                        wax: nft.prices && nft.prices[0] ? (nft.prices[0].amount / 100000000).toFixed(2) : "LISTED"
                    });
                }
            }
            render(boards);
        } catch (e) { document.getElementById('grid-container').innerHTML = "SYNC FAILED"; }
    }

    function render(list) {
        document.getElementById('grid-container').innerHTML = list.map(b => `
            <div class="skater-card">
                <div class="rarity-banner" style="background:var(--${b.rarity})">${b.rarity}</div>
                <img src="https://ipfs.io/ipfs/${b.img}" class="nft-frame">
                
                <div class="deck-name">${b.name}</div>
                <div style="font-size:0.5rem; color:#888;">ARTIST: ${b.artist}</div>

                <div class="stat-group">
                    <div class="stat-label">SPEED <span>${b.speed}/10</span></div>
                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${b.speed * 10}%"></div></div>
                </div>
                <div class="stat-group">
                    <div class="stat-label">POP <span>${b.pop}/10</span></div>
                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${b.pop * 10}%"></div></div>
                </div>
                <div class="stat-group">
                    <div class="stat-label">BALANCE <span>${b.bal}/10</span></div>
                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${b.bal * 10}%"></div></div>
                </div>

                <div class="comp-list">
                    TRUCKS: ${b.trucks}<br>
                    WHEELS: ${b.wheels}<br>
                    BEARINGS: ${b.bearings}
                </div>

                <div class="reward-area">
                    <span class="wax-val">${b.wax} WAX</span>
                    <div class="skate-reward">${b.reward} $SKATE</div>
                </div>

                <button class="select-btn" onclick="window.open('https://wax.atomichub.io/explorer/asset/${b.id}')">SELECT BOARD</button>
            </div>
        `).join('');
    }

    loadProGrid();
</script>
</body>
</html>
