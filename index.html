<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WAC DASHBOARD | WHARFKIT CONNECTION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Bangers&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050a1a;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at 50% 0%, #162a5e 0%, transparent 70%);
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 4rem;
            color: #fff;
            margin: 0 0 10px 0;
            -webkit-text-stroke: 1px #0066ff;
            text-shadow: 4px 4px 0px #0066ff;
            letter-spacing: 3px;
        }

        .connect-btn {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 15px 35px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            transition: 0.3s;
            margin-top: 20px;
            clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%);
        }

        .connect-btn:hover {
            background: #fff;
            box-shadow: 0 0 20px #ffd700;
            transform: scale(1.05);
        }

        #status-box {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0,0,0,0.5);
            border-left: 3px solid #00f0ff;
            font-size: 1.2rem;
            text-align: center;
            display: none;
        }

        .wallet-text {
            color: #00f0ff;
            font-weight: 900;
            font-size: 1.5rem;
            display: block;
            margin-top: 10px;
        }
    </style>

    <script>
        window.global = window;
    </script>
    <script type="module">
        import { Buffer } from 'https://esm.sh/buffer?bundle';
        window.Buffer = Buffer;
    </script>
</head>
<body>

    <h1>WAC PORTAL</h1>
    <p style="color: #00f0ff; letter-spacing: 4px;">OFFICIAL WHARFKIT SECURE LOGIN</p>

    <button id="connect-btn" class="connect-btn">CONNECT WALLET</button>
    
    <div id="status-box">
        SECURE CONNECTION ESTABLISHED
        <span id="wallet-address" class="wallet-text"></span>
    </div>

    <script type="module">
        import { SessionKit } from 'https://esm.sh/@wharfkit/session?bundle';
        import { WebRenderer } from 'https://esm.sh/@wharfkit/web-renderer?bundle';
        import { WalletPluginCloudWallet } from 'https://esm.sh/@wharfkit/wallet-plugin-cloudwallet?bundle';
        import { WalletPluginAnchor } from 'https://esm.sh/@wharfkit/wallet-plugin-anchor?bundle';

        // 1. Initialize the official UI popup
        const webRenderer = new WebRenderer();

        // 2. Configure Wharfkit for WAX Mainnet
        const sessionKit = new SessionKit({
            appName: 'WAC_Dashboard',
            chains: [{
                id: '1064487b3cd1a897ce03ae5b6a865651747e2e152090f99c1d19d44e01aea5a4', // Official WAX Chain ID
                url: 'https://wax.greymass.com'
            }],
            ui: webRenderer,
            walletPlugins: [
                new WalletPluginCloudWallet(),
                new WalletPluginAnchor()
            ]
        });

        const connectBtn = document.getElementById('connect-btn');
        const statusBox = document.getElementById('status-box');
        const walletAddressSpan = document.getElementById('wallet-address');

        // 3. The un-spoofed blockchain login trigger
        connectBtn.addEventListener('click', async () => {
            try {
                // Triggers the official Wharfkit modal
                const response = await sessionKit.login();
                
                // Extracts the exact WAX address connected (e.g., ufuau.wam)
                const accountName = response.session.actor.toString();
                
                // Update UI to prove the real connection
                connectBtn.style.display = 'none';
                statusBox.style.display = 'block';
                walletAddressSpan.innerText = accountName;

                // You now have a live session object to sign real transactions
                console.log("Live Session Data:", response.session);

            } catch (error) {
                console.error("Connection aborted or failed:", error);
                alert("Login Failed: " + error.message);
            }
        });

        // 4. Auto-restore the session if the user refreshes the page
        sessionKit.restore().then((session) => {
            if (session) {
                const accountName = session.actor.toString();
                connectBtn.style.display = 'none';
                statusBox.style.display = 'block';
                walletAddressSpan.innerText = accountName;
            }
        });
    </script>
</body>
</html>
