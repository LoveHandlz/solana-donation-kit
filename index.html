<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK8COIN | WAX PORTAL CLONE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a132f;
            --bg-panel: #0f1a47;
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
            --card-border: rgba(0, 240, 255, 0.2);
        }

        body {
            background: var(--bg-deep);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px dashed var(--accent-cyan);
            padding-bottom: 20px;
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 4rem;
            color: var(--accent-gold);
            letter-spacing: 3px;
            margin: 0;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .subtitle {
            color: var(--accent-cyan);
            font-size: 0.9rem;
            letter-spacing: 2px;
            font-weight: bold;
        }

        /* 12-item grid matching standard sk8coin feed */
        .nft-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1440px;
            margin: auto;
        }

        .nft-card {
            background: var(--bg-panel);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
            transition: 0.3s;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .nft-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        .nft-image {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #000;
            aspect-ratio: 1/1;
            object-fit: contain;
        }

        .collection-name {
            font-size: 0.6rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .asset-name {
            font-size: 0.9rem;
            font-weight: 900;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bless-btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            font-family: 'Orbitron';
            font-weight: 900;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .loading {
            text-align: center;
            font-size: 1.5rem;
            color: var(--accent-cyan);
            margin-top: 50px;
        }
    </style>
</head>
<body>

<header>
    <h1>WAX SKATEBOARDS</h1>
    <div class="subtitle">DECENTRALIZED WAX PORTAL // 12 RANDOM BLENDS</div>
</header>

<div id="loader" class="loading">SCANNING ATOMIC HUB...</div>
<div id="nft-container" class="nft-grid"></div>

<script>
    const collections = [
        'skatecoinwax', 'munstervision', 'captaindegen', 
        'labas', 'broken-dolls', 'nerds-unite', 
        'breadcritter', 'rugg-apes', 'wax-dao', 'wax-snails'
    ];

    async function fetchSkateboards() {
        const container = document.getElementById('nft-container');
        const loader = document.getElementById('loader');
        
        try {
            // Fetch 12 items from random collections in the list
            // Using skateboards schema specifically where applicable
            const nftsToFetch = 12;
            let html = '';

            for (let i = 0; i < nftsToFetch; i++) {
                const randomCollection = collections[Math.floor(Math.random() * collections.length)];
                
                // AtomicAssets API Endpoint
                const response = await fetch(`https://wax.api.atomicassets.io/atomicassets/v1/assets?collection_name=${randomCollection}&limit=1&page=${Math.floor(Math.random() * 10) + 1}&order=desc&sort=created`);
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    const nft = result.data[0];
                    const imgHash = nft.data.img || nft.template.immutable_data.img;
                    const imgUrl = `https://ipfs.io/ipfs/${imgHash}`;

                    html += `
                        <div class="nft-card">
                            <div class="collection-name">${nft.collection.collection_name}</div>
                            <img src="${imgUrl}" class="nft-image" onerror="this.src='https://via.placeholder.com/300?text=Board+Loading...'">
                            <div class="asset-name">${nft.name}</div>
                            <button class="bless-btn" onclick="window.open('https://wax.atomichub.io/explorer/asset/${nft.asset_id}', '_blank')">VIEW ON HUB</button>
                        </div>
                    `;
                }
            }

            loader.style.display = 'none';
            container.innerHTML = html;
        } catch (error) {
            console.error("API Error:", error);
            loader.innerText = "BLOCKCHAIN SYNC ERROR. RETRYING...";
        }
    }

    // Initialize the portal
    fetchSkateboards();
</script>

</body>
</html>
