<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WAX PORTAL | REWARD CLAIM SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050a1a;
            --bg-panel: rgba(15, 26, 71, 0.9);
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
            --epic: #ff2d55;
        }

        body {
            background-color: var(--bg-deep); color: #fff; font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 0;
            background-image: radial-gradient(circle at 50% 0%, #162a5e 0%, transparent 70%),
                              linear-gradient(0deg, rgba(0,240,255,0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,240,255,0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        /* Nav & Header */
        nav { background: rgba(0, 0, 0, 0.8); border-bottom: 2px solid var(--accent-cyan); padding: 15px 0; width: 100%; text-align: center; }
        nav a { color: #fff; text-decoration: none; margin: 0 20px; font-weight: 900; font-size: 0.8rem; letter-spacing: 2px; }
        
        header { text-align: center; margin: 3rem 0; }
        h1 { font-family: 'Bangers', cursive; font-size: 3.5rem; color: var(--accent-gold); margin: 0; text-shadow: 3px 3px 0 #000; }

        /* Reward Dashboard */
        .reward-banner {
            background: linear-gradient(90deg, transparent, rgba(0,240,255,0.1), transparent);
            border-top: 1px solid var(--accent-cyan);
            border-bottom: 1px solid var(--accent-cyan);
            padding: 20px; text-align: center; margin-bottom: 40px;
        }

        .claim-all-btn {
            background: var(--accent-cyan); color: #000; border: none; padding: 15px 40px;
            font-family: 'Orbitron'; font-weight: 900; cursor: pointer; text-transform: uppercase;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); transition: 0.3s;
        }

        .claim-all-btn:hover { background: #fff; box-shadow: 0 0 20px var(--accent-cyan); }

        /* Grid & Cards */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; max-width: 1300px; margin: auto; padding: 20px; }

        .reward-card {
            background: var(--bg-panel); border: 1px solid rgba(255,255,255,0.1); padding: 20px;
            position: relative; transition: 0.3s; display: flex; flex-direction: column;
        }
        .reward-card:hover { border-color: var(--accent-gold); transform: translateY(-5px); }

        .token-amount { font-family: 'Bangers'; font-size: 2.5rem; color: var(--accent-gold); margin: 10px 0; }
        
        .claim-btn {
            background: transparent; border: 1px solid var(--accent-gold); color: var(--accent-gold);
            padding: 10px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; margin-top: auto;
        }
        .claim-btn:hover { background: var(--accent-gold); color: #000; }
        .claimed { border-color: #555 !important; color: #555 !important; cursor: not-allowed; }

        .img-preview { width: 100%; height: 150px; object-fit: contain; margin-bottom: 15px; background: #000; border-radius: 4px; }
    </style>

    <script>window.global = window;</script>
    <script type="module">
        import { Buffer } from 'https://esm.sh/buffer?bundle';
        window.Buffer = Buffer;
    </script>
</head>
<body>

<nav>
    <a href="#">HOME</a>
    <a href="#">VIDEOS</a>
    <a href="#">REWARDS</a>
    <a href="#">DAO</a>
</nav>

<header>
    <h1>WAX REWARD PORTAL</h1>
    <p style="color: var(--accent-cyan); letter-spacing: 5px;">CLAIM YOUR $SKATE TOKENS</p>
</header>

<div class="reward-banner">
    <div id="wallet-info" style="margin-bottom: 15px; font-size: 0.9rem; color: #888;">WALLET NOT CONNECTED</div>
    <button id="main-connect-btn" class="claim-all-btn">CONNECT WAX WALLET</button>
</div>

<div class="dashboard-grid" id="reward-roster">
    </div>

<script type="module">
    import { SessionKit } from 'https://esm.sh/@wharfkit/session?bundle';
    import { WebRenderer } from 'https://esm.sh/@wharfkit/web-renderer?bundle';
    import { WalletPluginCloudWallet } from 'https://esm.sh/@wharfkit/wallet-plugin-cloudwallet?bundle';

    const ATOMIC_API = "https://wax.api.atomicassets.io/atomicassets/v1";
    
    // Reward multiplier based on Rarity Metadata
    const RARITY_REWARDS = {
        'common': 100,
        'uncommon': 250,
        'rare': 500,
        'mythic': 1000,
        'legendary': 2500,
        'epic': 5000
    };

    const sessionKit = new SessionKit({
        appName: 'Skate_Reward_Portal',
        chains: [{ id: '1064487b3cd1a897ce03ae5b6a865651747e2e152090f99c1d19d44e01aea5a4', url: 'https://wax.greymass.com' }],
        ui: new WebRenderer(),
        walletPlugins: [ new WalletPluginCloudWallet() ]
    });

    const connectBtn = document.getElementById('main-connect-btn');
    const walletInfo = document.getElementById('wallet-info');
    const roster = document.getElementById('reward-roster');

    connectBtn.addEventListener('click', async () => {
        const { session } = await sessionKit.login();
        setupUser(session);
    });

    sessionKit.restore().then(s => { if(s) setupUser(s); });

    function setupUser(session) {
        const user = session.actor.toString();
        walletInfo.innerText = `CONNECTED: ${user}`;
        connectBtn.innerText = "REFRESH INVENTORY";
        fetchClaimableAssets(user);
    }

    async function fetchClaimableAssets(owner) {
        roster.innerHTML = "SCANNING BLOCKCHAIN...";
        const res = await fetch(`${ATOMIC_API}/assets?collection_name=skatecoinwax&owner=${owner}&limit=50`);
        const json = await res.json();
        
        if (json.success && json.data.length > 0) {
            renderRewards(json.data);
        } else {
            roster.innerHTML = "NO SKATECOINWAX ASSETS DETECTED IN THIS WALLET.";
        }
    }

    function renderRewards(assets) {
        roster.innerHTML = assets.map(nft => {
            const rarity = (nft.data.rarity || 'common').toLowerCase();
            const rewardAmount = RARITY_REWARDS[rarity] || 100;
            const img = nft.data.img || (nft.template && nft.template.immutable_data.img);

            return `
                <div class="reward-card">
                    <img src="https://ipfs.io/ipfs/${img}" class="img-preview">
                    <div style="font-size: 0.7rem; color: var(--accent-cyan);">${nft.schema.schema_name.toUpperCase()}</div>
                    <div style="font-size: 1.2rem; font-weight: 900; margin-bottom: 5px;">${nft.name}</div>
                    <div style="font-size: 0.6rem; color: #888;">RARITY: ${rarity.toUpperCase()}</div>
                    
                    <div class="token-amount">${rewardAmount} $SKATE</div>
                    
                    <button class="claim-btn" onclick="alert('Sending ${rewardAmount} $SKATE to your wallet...')">
                        CLAIM REWARD
                    </button>
                    <div style="font-size: 0.5rem; color: #444; margin-top: 10px; text-align: center;">MINT #${nft.template_mint}</div>
                </div>
            `;
        }).join('');
    }
</script>
</body>
</html>
