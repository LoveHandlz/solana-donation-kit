<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>$SKATE REWARDS | DIGITAL GARAGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Bangers&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050a1a;
            --bg-panel: rgba(15, 26, 71, 0.95);
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
            --accent-green: #00ff88;
            --card-border: rgba(0, 240, 255, 0.2);
            
            /* UPDATED RARITY PALETTE: NO RED */
            --rarity-common: #94a3b8;        /* Silver/Gray */
            --rarity-uncommon: #00ffaa;      /* Crypto-Safe Mint Green */
            --rarity-rare: #2196f3;          /* Blue */
            --rarity-mythic: #a855f7;        /* Purple */
            --rarity-legendary: var(--accent-gold); /* Gold */
            --rarity-epic: #d946ef;          /* Fuchsia / Magenta (Replaced Red) */
            --rarity-stock: #ffffff;         /* White */
        }

        body {
            background-color: var(--bg-deep);
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            background-image: radial-gradient(circle at 50% 50%, #162a5e 0%, #050a1a 100%);
            background-attachment: fixed;
        }

        /* --- HEADER & BALANCES --- */
        header {
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid var(--accent-cyan);
            padding: 15px 40px;
            display: flex; justify-content: center;
            position: sticky; top: 0; z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .header-inner { width: 100%; max-width: 1400px; display: flex; justify-content: space-between; align-items: center; }
        .logo { height: 45px; cursor: pointer; }
        
        nav ul { display: flex; list-style: none; gap: 20px; margin: 0; padding: 0; }
        nav a { 
            color: #fff; text-decoration: none; font-family: 'Orbitron'; 
            font-size: 0.75rem; font-weight: 900; letter-spacing: 2px; 
            padding-bottom: 5px; border-bottom: 2px solid transparent; transition: 0.2s;
        }
        nav a:hover { color: var(--accent-cyan); }
        nav a.active { color: var(--accent-cyan); text-shadow: 0 0 8px var(--accent-cyan); border-bottom: 2px solid var(--accent-cyan); }

        .header-controls { display: flex; align-items: center; gap: 15px; }
        
        .balance-pill {
            background: rgba(0, 240, 255, 0.05); border: 1px solid var(--accent-cyan);
            padding: 6px 15px; border-radius: 50px; font-family: 'Orbitron';
            font-size: 0.65rem; display: flex; gap: 15px; color: #fff;
        }
        .balance-pill span { color: var(--accent-gold); font-weight: 900; }

        .ticker-bar {
            background: rgba(0, 240, 255, 0.05); border-bottom: 1px solid var(--card-border);
            padding: 10px 0; display: flex; justify-content: center; gap: 40px;
            font-family: 'Orbitron'; font-weight: 900; font-size: 0.7rem; color: var(--accent-cyan);
        }

        /* --- DASHBOARD GRID --- */
        .dashboard-wrapper { padding: 40px; max-width: 1400px; margin: auto; }
        .grid-header { text-align: center; color: var(--accent-cyan); font-family: 'Bangers'; letter-spacing: 2px; margin-bottom: 30px; font-size: 2rem; }
        
        .dashboard-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px;
        }

        .skate-card {
            background: var(--bg-panel); border: 1px solid var(--card-border);
            border-radius: 12px; overflow: hidden; transition: 0.3s;
            display: flex; flex-direction: column; position: relative;
        }
        .skate-card:hover { transform: translateY(-5px); border-color: var(--accent-gold); box-shadow: 0 5px 20px rgba(255,215,0,0.15); }
        
        .rarity-header { padding: 8px; text-align: center; font-weight: 900; font-size: 0.7rem; color: #000; text-transform: uppercase; letter-spacing: 2px; }
        
        .img-wrap { width: 100%; height: 220px; display: flex; justify-content: center; align-items: center; background: #000; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .skate-img { max-height: 85%; max-width: 85%; object-fit: contain; }

        .card-body { padding: 20px; flex: 1; }
        .board-name { font-family: 'Bangers'; font-size: 1.8rem; margin: 0 0 15px 0; color: #fff; line-height: 1.1; text-transform: uppercase; }
        
        /* METADATA HUD */
        .meta-group { margin-bottom: 12px; }
        .meta-title { font-family: 'Orbitron'; font-size: 0.55rem; color: #555; letter-spacing: 2px; margin-bottom: 4px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 2px; }
        .metadata-hud {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
            padding: 10px; background: rgba(0,0,0,0.4); border-radius: 6px;
            font-family: 'Orbitron'; font-size: 0.55rem; color: #888;
        }
        .metadata-hud span { color: var(--accent-cyan); font-weight: 900; float: right; text-transform: uppercase; }
        .hardware-hud span { color: #fff; }

        .claim-zone { padding: 20px; background: rgba(0,0,0,0.6); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
        .reward-skate { font-family: 'Bangers'; font-size: 1.8rem; color: #fff; line-height: 1; margin-bottom: 4px; }
        .reward-wax { font-family: 'Inter'; font-size: 0.75rem; color: var(--accent-gold); font-weight: 900; }
        
        .wallet-btn { 
            background: var(--accent-cyan); color: #000; border: none; padding: 10px 20px; 
            font-family: 'Orbitron'; font-weight: 900; cursor: pointer;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%); transition: 0.2s;
        }
        .wallet-btn:hover { background: #fff; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; display: none; align-items: center; justify-content: center;
        }
        .modal-content { background: var(--bg-panel); padding: 40px; border-radius: 15px; border: 2px solid var(--accent-cyan); text-align: center; max-width: 350px; }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <img src="https://i.postimg.cc/VSvxfXsr/sk8coin-logo-biig.png" class="logo" onclick="location.reload()">
        <nav>
            <ul>
                <li><a href="#" onclick="switchCategory('skateboards')" id="nav-skateboards" class="active">SKATEBOARDS</a></li>
                <li><a href="#" onclick="switchCategory('decks')" id="nav-decks">DECKS</a></li>
                <li><a href="#" onclick="switchCategory('wheels')" id="nav-wheels">WHEELS</a></li>
                <li><a href="#" onclick="switchCategory('trucks')" id="nav-trucks">TRUCKS</a></li>
            </ul>
        </nav>
        <div class="header-controls">
            <div id="wallet-balances" class="balance-pill" style="display: none;">
                <div>WAX: <span id="wax-bal">0.00</span></div>
                <div>SKATE: <span id="skate-bal">0.00</span></div>
            </div>
            <button id="connect-btn" class="wallet-btn" onclick="toggleModal()">CONNECT</button>
        </div>
    </div>
</header>

<div class="ticker-bar" id="price-ticker">
    <div>EXCHANGE RATE: <b>SYNCING PROTOCOL...</b></div>
</div>

<div class="dashboard-wrapper">
    <h2 id="grid-title" class="grid-header">CONNECT WALLET TO OPEN TRUNK</h2>
    <div class="dashboard-grid" id="main-grid">
        </div>
</div>

<div id="onboarding-modal" class="modal-overlay">
    <div class="modal-content">
        <h2 style="font-family:'Orbitron'; color:var(--accent-cyan); margin-bottom: 20px;">SYNC WAX WALLET</h2>
        <button class="wallet-btn" id="login-trigger" style="width: 100%;">CLOUD WALLET</button>
        <button onclick="toggleModal()" style="background:transparent; color:#555; border:none; margin-top:20px; cursor:pointer; font-family:'Orbitron'; font-size: 0.7rem;">[ CANCEL ]</button>
    </div>
</div>

<script type="module">
    import { SessionKit } from 'https://esm.sh/@wharfkit/session?bundle';
    import { WebRenderer } from 'https://esm.sh/@wharfkit/web-renderer?bundle';
    import { WalletPluginCloudWallet } from 'https://esm.sh/@wharfkit/wallet-plugin-cloudwallet?bundle';

    const ATOMIC_API = "https://wax.api.atomicassets.io/atomicassets/v1";
    const COLLECTION = "skatecoinwax";
    const WAX_RPC = "https://wax.greymass.com";

    const sessionKit = new SessionKit({
        appName: 'SkateTrunkV1.8.1',
        chains: [{ id: '1064487b3cd1a897ce03ae5b6a865651747e2e152090f99c1d19d44e01aea5a4', url: WAX_RPC }],
        ui: new WebRenderer(),
        walletPlugins: [ new WalletPluginCloudWallet() ]
    });

    let sWax = 0;
    let currentSession = null;
    let currentSchema = 'skateboards'; // Default category

    // --- CATEGORY ROUTER LOGIC ---
    window.switchCategory = (schema) => {
        currentSchema = schema;
        
        // Update Nav Styling
        document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
        document.getElementById(`nav-${schema}`).classList.add('active');

        // Update Dynamic Titles based on category
        const titles = {
            'skateboards': 'DIGGING THROUGH TRUNK: SKATEBOARDS',
            'decks': 'BROWSING DECK RACK',
            'wheels': 'CHECKING WHEEL STASH',
            'trucks': 'SORTING TRUCKS & HARDWARE'
        };
        
        if (currentSession) {
            document.getElementById('grid-title').innerText = titles[schema] || `LOADING ${schema.toUpperCase()}...`;
            loadInventory(currentSession.actor.toString());
        } else {
            document.getElementById('grid-title').innerText = `CONNECT WALLET TO VIEW ${schema.toUpperCase()}`;
        }
    };

    // --- ALCOR API SYNC (Direct Swap Pool Target) ---
    async function syncPrices() {
        try {
            const alcorRes = await fetch("https://wax.api.alcor.exchange/api/v2/tickers");
            const alcorData = await alcorRes.json();
            const skateWax = alcorData.find(t => t.base_currency === "SKATE" || t.target_currency === "SKATE");
            sWax = parseFloat(skateWax?.last_price || 0);

            document.getElementById('price-ticker').innerHTML = `
                <div>EXCHANGE RATE: <b>1 $SKATE = ${sWax.toFixed(4)} WAX</b></div>
                <div style="color:var(--accent-gold);">NETWORK STATUS: <b>SYNCED</b></div>
            `;
        } catch (e) { 
            console.error("Exchange Sync Error", e);
        }
    }

    // --- ON-CHAIN WALLET BALANCES ---
    async function updateBalances(user) {
        try {
            const waxRes = await fetch(`${WAX_RPC}/v1/chain/get_currency_balance`, {
                method: 'POST', body: JSON.stringify({ code: "eosio.token", account: user, symbol: "WAX" })
            });
            const waxBal = await waxRes.json();
            document.getElementById('wax-bal').innerText = waxBal[0] ? waxBal[0].replace(' WAX', '') : "0.00";

            const skateRes = await fetch(`${WAX_RPC}/v1/chain/get_currency_balance`, {
                method: 'POST', body: JSON.stringify({ code: "skatecoinwax", account: user, symbol: "SKATE" })
            });
            const skateBal = await skateRes.json();
            document.getElementById('skate-bal').innerText = skateBal[0] ? skateBal[0].replace(' SKATE', '') : "0.00";
            
            document.getElementById('wallet-balances').style.display = 'flex';
        } catch (e) { console.error("Failed to fetch balances", e); }
    }

    window.toggleModal = () => {
        const m = document.getElementById('onboarding-modal');
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
    };

    document.getElementById('login-trigger').addEventListener('click', async () => {
        const { session } = await sessionKit.login();
        currentSession = session;
        const user = session.actor.toString();
        document.getElementById('connect-btn').innerText = user.toUpperCase();
        toggleModal();
        updateBalances(user);
        
        // Trigger initial load based on currently selected schema
        switchCategory(currentSchema);
    });

    // --- DYNAMIC ATOMICASSETS INVENTORY FETCH ---
    async function loadInventory(user) {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = `<h3 style="grid-column: 1/-1; text-align: center; color: var(--accent-cyan); font-family: 'Orbitron';">SCANNING BLOCKCHAIN...</h3>`;
        
        try {
            // Uses dynamic currentSchema variable from the Router
            const res = await fetch(`${ATOMIC_API}/assets?collection_name=${COLLECTION}&schema_name=${currentSchema}&owner=${user}&limit=12`);
            const json = await res.json();
            
            if (json.success && json.data.length > 0) {
                grid.innerHTML = json.data.map(nft => {
                    const m = nft.data || {};
                    const t = nft.template ? nft.template.immutable_data : {};
                    
                    const rarityRaw = m.rarity || t.rarity || 'stock';
                    const rarity = rarityRaw.toLowerCase();
                    const imgHash = m.img || t.img || "";
                    
                    // Fallback logic covers both Mutable and Immutable data fields
                    const speed = m.speed || t.speed || 0;
                    const pop = m.pop || t.pop || 0;
                    const balance = m.balance || t.balance || 0;
                    const grind = m.grind || t.grind || 0;

                    const deck = m.deck || t.deck || "N/A";
                    const wheels = m.wheels || t.wheels || m.wheel || t.wheel || "N/A";
                    const trucks = m.trucks || t.trucks || m.truck || t.truck || "N/A";
                    const color = m.color || t.color || "STANDARD";

                    // Reward calc
                    const skateReward = 1000;
                    const waxValue = (skateReward * sWax).toFixed(2);

                    return `
                        <div class="skate-card">
                            <div class="rarity-header" style="background:var(--rarity-${rarity});">${rarity} EDITION</div>
                            
                            <div class="img-wrap">
                                <img src="https://ipfs.io/ipfs/${imgHash}" class="skate-img">
                            </div>
                            
                            <div class="card-body">
                                <div class="board-name">${nft.name}</div>
                                
                                <div class="meta-group">
                                    <div class="meta-title">PERFORMANCE</div>
                                    <div class="metadata-hud">
                                        <div>SPEED <span>${speed}/10</span></div>
                                        <div>POP <span>${pop}/10</span></div>
                                        <div>BALANCE <span>${balance}/10</span></div>
                                        <div>GRIND <span>${grind}/10</span></div>
                                    </div>
                                </div>

                                <div class="meta-group">
                                    <div class="meta-title">SPECS & HARDWARE</div>
                                    <div class="metadata-hud hardware-hud">
                                        <div>DECK <span>${deck}</span></div>
                                        <div>WHEELS <span>${wheels}</span></div>
                                        <div>TRUCKS <span>${trucks}</span></div>
                                        <div>COLOR <span>${color}</span></div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="claim-zone">
                                <div>
                                    <div class="reward-skate">🪙 ${skateReward.toLocaleString()}</div>
                                    <div class="reward-wax">≈ ${waxValue} WAX</div>
                                </div>
                                <button class="wallet-btn" style="padding: 10px 15px;">CLAIM</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                grid.innerHTML = `<h3 style="grid-column: 1/-1; text-align: center; color: #444; font-family: 'Orbitron';">NO ${currentSchema.toUpperCase()} IN INVENTORY</h3>`;
            }
        } catch (e) { 
            grid.innerHTML = `<h3 style="grid-column: 1/-1; text-align: center; color: #ff3366; font-family: 'Orbitron';">ERROR FETCHING ASSETS</h3>`; 
        }
    }

    syncPrices();
    setInterval(syncPrices, 60000); 
</script>
</body>
</html>
