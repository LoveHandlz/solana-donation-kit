<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WAX PORTAL | LIVE REWARD SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050a1a;
            --fortnite-blue: #007bff;
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
            --epic-purple: #9c27b0;
            --rarity-legendary: linear-gradient(135deg, #ff8c00, #ff0000);
            --rarity-epic: linear-gradient(135deg, #b026ff, #5500ff);
        }

        body {
            background-color: var(--bg-deep); color: #fff; font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 0; background-attachment: fixed;
            background-image: radial-gradient(circle at 50% 50%, #162a5e 0%, #050a1a 100%);
        }

        /* --- FORTNITE NAV --- */
        nav {
            background: rgba(0, 0, 0, 0.9); border-bottom: 3px solid var(--fortnite-blue);
            padding: 10px 0; display: flex; justify-content: center; gap: 30px;
            position: sticky; top: 0; z-index: 1000;
        }
        nav a { color: #fff; text-decoration: none; font-weight: 900; font-size: 0.7rem; letter-spacing: 2px; padding: 10px 20px; text-transform: uppercase; }
        nav a.active { background: var(--fortnite-blue); clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%); }

        /* --- PRICE & TOKEN FEED --- */
        .market-ticker {
            background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--accent-cyan);
            padding: 5px; font-size: 0.6rem; text-align: center; color: var(--accent-cyan);
        }

        .token-header {
            display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; padding: 20px;
        }

        .token-pill {
            background: rgba(15, 26, 71, 0.9); border: 2px solid var(--accent-cyan);
            padding: 10px 20px; border-radius: 8px; text-align: left; min-width: 180px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .token-label { font-size: 0.5rem; color: #888; text-transform: uppercase; margin-bottom: 4px; }
        .token-val { font-size: 1.1rem; font-weight: 900; color: var(--accent-gold); }
        .usd-val { font-size: 0.7rem; color: #4caf50; font-weight: 900; }

        .refresh-btn {
            background: var(--accent-cyan); border: none; padding: 10px 20px; font-family: 'Orbitron';
            font-weight: 900; font-size: 0.7rem; cursor: pointer; border-radius: 4px; color: #000;
        }

        header { text-align: center; margin: 30px 0; }
        h1 { font-family: 'Bangers', cursive; font-size: 4rem; margin: 0; text-shadow: 4px 4px 0px var(--fortnite-blue); }

        /* --- ITEM CARDS --- */
        .dashboard-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
            max-width: 1400px; margin: auto; padding: 20px;
        }

        .skate-card {
            background: rgba(15, 26, 71, 0.95); border: 1px solid rgba(255,255,255,0.1);
            position: relative; transition: 0.3s; display: flex; flex-direction: column;
        }
        .skate-card:hover { transform: scale(1.03); border-color: var(--accent-cyan); }

        .img-wrap { width: 100%; height: 200px; display: flex; justify-content: center; align-items: center; background: #000; }
        .skate-img { height: 90%; object-fit: contain; filter: drop-shadow(0 0 10px var(--accent-cyan)); }

        .card-body { padding: 15px; }
        .board-name { font-family: 'Bangers'; font-size: 1.6rem; color: #fff; margin: 0; }

        /* HUD STATS */
        .hud-stats { margin: 10px 0; }
        .stat-row { margin-bottom: 5px; }
        .stat-meta { display: flex; justify-content: space-between; font-size: 0.5rem; font-weight: 900; color: var(--accent-cyan); }
        .stat-bar-bg { height: 5px; background: #000; border-radius: 2px; border: 1px solid #333; overflow: hidden; }
        .stat-bar-fill { height: 100%; background: var(--accent-gold); width: 0%; transition: width 1s ease-out; }

        .claim-zone {
            margin-top: auto; padding: 15px; background: rgba(0,0,0,0.4);
            display: flex; justify-content: space-between; align-items: center;
        }
        .skate-reward { font-family: 'Bangers'; font-size: 1.6rem; color: var(--accent-gold); }
        .claim-btn {
            background: var(--accent-cyan); color: #000; border: none; padding: 8px 12px;
            font-family: 'Orbitron'; font-weight: 900; font-size: 0.6rem; cursor: pointer;
        }

        @media (max-width: 1100px) { .dashboard-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .dashboard-grid { grid-column: 1; } }
    </style>

    <script>window.global = window;</script>
    <script type="module">
        import { Buffer } from 'https://esm.sh/buffer?bundle';
        window.Buffer = Buffer;
    </script>
</head>
<body>

<div class="market-ticker" id="market-ticker">LOADING ALCOR MARKET PRICES...</div>

<nav>
    <a href="#" class="active">GARAGE</a>
    <a href="#">REWARDS</a>
    <a href="#">TREASURY</a>
    <button class="refresh-btn" id="refresh-trigger" style="margin-left: 20px;">SYNC FEED</button>
</nav>

<div class="token-header" id="token-header">
    <div class="token-pill">
        <div class="token-label">WAX BALANCE</div>
        <div id="wax-bal" class="token-val">0.00 WAX</div>
        <div id="wax-usd" class="usd-val">$0.00 USD</div>
    </div>
    <div class="token-pill">
        <div class="token-label">$SKATE BALANCE</div>
        <div id="skate-bal" class="token-val">0.00 SKATE</div>
        <div id="skate-usd" class="usd-val">$0.00 USD</div>
    </div>
</div>

<header>
    <h1>SKATE PORTAL</h1>
</header>

<div class="dashboard-grid" id="main-grid">
    <div style="grid-column: 1/-1; text-align: center;">
        <button class="refresh-btn" id="login-trigger" style="font-size: 1.5rem; padding: 20px 40px;">CONNECT WAX WALLET</button>
    </div>
</div>

<script type="module">
    import { SessionKit } from 'https://esm.sh/@wharfkit/session?bundle';
    import { WebRenderer } from 'https://esm.sh/@wharfkit/web-renderer?bundle';
    import { WalletPluginCloudWallet } from 'https://esm.sh/@wharfkit/wallet-plugin-cloudwallet?bundle';

    const ATOMIC_API = "https://wax.api.atomicassets.io/atomicassets/v1";
    const WAX_RPC = "https://wax.greymass.com";
    const SKATE_CONTRACT = "skatecoinwax";

    // Rewards x10 Upgrade
    const RATES = { 'common': 1000, 'uncommon': 2500, 'rare': 5000, 'mythic': 10000, 'legendary': 25000, 'epic': 50000 };

    const sessionKit = new SessionKit({
        appName: 'Skate_Portal_Live',
        chains: [{ id: '1064487b3cd1a897ce03ae5b6a865651747e2e152090f99c1d19d44e01aea5a4', url: WAX_RPC }],
        ui: new WebRenderer(),
        walletPlugins: [ new WalletPluginCloudWallet() ]
    });

    let activeUser = null;
    let prices = { wax_usd: 0, skate_wax: 0 };

    // --- PRICE FETCHING ---
    async function fetchMarketPrices() {
        try {
            const res = await fetch("https://api.alcor.exchange/api/v2/tickers");
            const data = await res.json();
            
            // Find WAX/USDC and SKATE/WAX
            const waxTicker = data.find(t => t.ticker_id === "eosio.token-wax-usdc.alcor-usdc");
            const skateTicker = data.find(t => t.ticker_id === "skatecoinwax-skate-eosio.token-wax");
            
            if (waxTicker) prices.wax_usd = waxTicker.last_price;
            if (skateTicker) prices.skate_wax = skateTicker.last_price;

            document.getElementById('market-ticker').innerText = 
                `WAX: $${prices.wax_usd.toFixed(4)} | SKATE: ${prices.skate_wax.toFixed(4)} WAX`;
        } catch (e) { console.error("Price Sync Failed"); }
    }

    // --- AUTH ---
    document.getElementById('login-trigger').addEventListener('click', async () => {
        const { session } = await sessionKit.login();
        activeUser = session.actor.toString();
        runSync();
    });

    document.getElementById('refresh-trigger').addEventListener('click', () => runSync());

    async function runSync() {
        if(!activeUser) return;
        await fetchMarketPrices();
        await updateWalletBalances();
        await fetchInventory();
    }

    async function updateWalletBalances() {
        const wax = await fetch(`${WAX_RPC}/v1/chain/get_currency_balance`, {
            method: 'POST', body: JSON.stringify({ code: 'eosio.token', account: activeUser, symbol: 'WAX' })
        }).then(r => r.json());
        
        const skate = await fetch(`${WAX_RPC}/v1/chain/get_currency_balance`, {
            method: 'POST', body: JSON.stringify({ code: SKATE_CONTRACT, account: activeUser, symbol: 'SKATE' })
        }).then(r => r.json());

        const waxVal = parseFloat(wax[0] || 0);
        const skateVal = parseFloat(skate[0] || 0);

        document.getElementById('wax-bal').innerText = `${waxVal.toFixed(2)} WAX`;
        document.getElementById('wax-usd').innerText = `$${(waxVal * prices.wax_usd).toFixed(2)} USD`;
        
        document.getElementById('skate-bal').innerText = `${skateVal.toFixed(2)} SKATE`;
        document.getElementById('skate-usd').innerText = `$${(skateVal * prices.skate_wax * prices.wax_usd).toFixed(2)} USD`;
    }

    async function fetchInventory() {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = `<h2 style="grid-column:1/-1; text-align:center;">SCANNING WALLET...</h2>`;

        const res = await fetch(`${ATOMIC_API}/assets?collection_name=skatecoinwax&schema_name=skateboards&owner=${activeUser}&limit=100`);
        const json = await res.json();
        
        if (json.success && json.data.length > 0) {
            grid.innerHTML = json.data.map(nft => {
                const m = nft.data;
                const rarity = (m.rarity || 'common').toLowerCase();
                const reward = RATES[rarity] || 1000;
                const img = m.img || nft.template.immutable_data.img;

                return `
                    <div class="skate-card">
                        <div class="img-wrap"><img src="https://ipfs.io/ipfs/${img}" class="skate-img"></div>
                        <div class="card-body">
                            <div class="board-name">${nft.name}</div>
                            <div class="hud-stats">
                                <div class="stat-row">
                                    <div class="stat-meta">SPEED <span>${m.speed}/10</span></div>
                                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${m.speed * 10}%"></div></div>
                                </div>
                                <div class="stat-row">
                                    <div class="stat-meta">POP <span>${m.pop}/10</span></div>
                                    <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${m.pop * 10}%; background: var(--fortnite-blue);"></div></div>
                                </div>
                            </div>
                        </div>
                        <div class="claim-zone">
                            <div class="skate-reward">${reward.toLocaleString()}</div>
                            <button class="claim-btn">CLAIM</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
    }

    fetchMarketPrices();
</script>
</body>
</html>
