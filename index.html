<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAX Wharfkit Connection</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050a1a;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { color: #00f0ff; }
        #connect-btn {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 8px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        #connect-btn:hover {
            background: #fff;
            box-shadow: 0 0 15px #ffd700;
        }
        #status {
            margin-top: 20px;
            font-size: 1.5rem;
            color: #4caf50;
        }
        #error-msg {
            margin-top: 20px;
            color: #ff2d55;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>WAX MAINNET CONNECTION</h1>
    <p style="color: #888; margin-bottom: 40px;">Powered by Wharfkit & Antelope</p>

    <button id="connect-btn">Connect WAX Wallet</button>
    <div id="status"></div>
    <div id="error-msg"></div>

    <script type="module">
        import { SessionKit } from 'https://esm.sh/@wharfkit/session@1.2.3';
        import { WebRenderer } from 'https://esm.sh/@wharfkit/web-renderer@1.0.4';
        import { WalletPluginCloudWallet } from 'https://esm.sh/@wharfkit/wallet-plugin-cloudwallet@1.0.2';
        import { WalletPluginAnchor } from 'https://esm.sh/@wharfkit/wallet-plugin-anchor@1.0.3';

        // 1. Initialize the UI Renderer (This handles the popup dialogs)
        const webRenderer = new WebRenderer();

        // 2. Configure the SessionKit for WAX Mainnet
        const sessionKit = new SessionKit({
            appName: 'WAC Artist Collabs',
            chains: [{
                id: '1064487b3cd1a897ce03ae5b6a865651747e2e152090f99c1d19d44e01aea5a4', // Official WAX Mainnet Chain ID
                url: 'https://wax.greymass.com', // Official Greymass API Node
            }],
            ui: webRenderer,
            // Include Cloud Wallet (MyCloudWallet) and Anchor as options
            walletPlugins: [
                new WalletPluginCloudWallet(),
                new WalletPluginAnchor()
            ]
        });

        const connectBtn = document.getElementById('connect-btn');
        const statusDiv = document.getElementById('status');
        const errorDiv = document.getElementById('error-msg');

        // 3. The Login Function
        async function login() {
            errorDiv.innerText = ''; // Clear previous errors
            try {
                // Trigger the Wharfkit login flow
                const response = await sessionKit.login();
                
                // Extract the connected account name
                const accountName = response.session.actor.toString();
                
                // Update UI
                connectBtn.style.display = 'none';
                statusDiv.innerText = `Connected: ${accountName}`;
                
                console.log("Full Session Data:", response.session);
                
                // If you log in with ufuau.wam, the UI will reflect exactly that.
                if(accountName === 'ufuau.wam') {
                    statusDiv.innerHTML += '<br><span style="font-size:1rem; color:#00f0ff;">Welcome back, ufuau.wam!</span>';
                }

            } catch (error) {
                console.error("Login failed:", error);
                errorDiv.innerText = `Error: ${error.message}`;
            }
        }

        // 4. Check for an existing session on load
        async function checkSession() {
            const session = await sessionKit.restore();
            if (session) {
                const accountName = session.actor.toString();
                connectBtn.style.display = 'none';
                statusDiv.innerText = `Restored Session: ${accountName}`;
            }
        }

        // Attach event listener to the button
        connectBtn.addEventListener('click', login);
        
        // Check if user is already logged in when the page loads
        checkSession();

    </script>
</body>
</html>
