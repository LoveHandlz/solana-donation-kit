<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WAX PORTAL | SkateCoin Live</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Bangers&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/@waxio/waxjs/dist/index.js"></script>

  <style>
    :root {
      --bg-deep: #0a132f;
      --bg-panel: #0f1a47;
      --accent-red: #ff2d55;
      --accent-orange: #ff9500;
      --accent-cyan: #00f0ff;
      --accent-gold: #ffd700; 
      --accent-green: #4ade80;
      --text-primary: #e0f7ff;
      --text-secondary: #a5d8ff;
      --card-border: rgba(0,240,255,0.14);
      --rarity-legendary: #ffd700;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg-deep); color: var(--text-primary); font-family: 'Inter', sans-serif; padding: 2rem; min-height: 100vh; }
    h1, h2, h3 { font-family: 'Orbitron', sans-serif; }

    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 1rem; margin-bottom: 2rem; }
    .header-title { font-size: 2rem; color: var(--accent-cyan); font-weight: 900; }
    
    .wax-login-btn { background: linear-gradient(135deg, #f78e1e, #ffb347); color: #000; border: none; padding: 12px 25px; border-radius: 50px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; transition: 0.3s; box-shadow: 0 0 15px rgba(247, 142, 30, 0.3); }
    .auth-badge { background: rgba(0,240,255,0.05); border: 1px solid var(--accent-cyan); padding: 8px 15px; border-radius: 50px; font-size: 0.75rem; font-weight: bold; display: none; align-items: center; gap: 10px; }
    
    .portal-layout { display: grid; grid-template-columns: 2.5fr 1fr; gap: 2rem; max-width: 1300px; margin: 0 auto; }
    .inventory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    
    .slot { aspect-ratio: 1 / 1; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); position: relative; cursor: pointer; transition: 0.3s; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .slot.active { border: 2px solid var(--accent-gold); box-shadow: 0 0 20px rgba(255,215,0,0.3); }
    .slot-img { width: 70%; height: 70%; object-fit: contain; }
    .slot-name { position: absolute; bottom: 0; width: 100%; background: rgba(10,19,47,0.9); padding: 5px; font-size: 0.55rem; text-align: center; font-weight: bold; text-transform: uppercase; }

    .inspector-panel { background: var(--bg-panel); border: 1px solid var(--card-border); border-radius: 16px; padding: 1.5rem; position: sticky; top: 2rem; min-height: 500px; }
    .inspector-header { font-size: 0.8rem; color: var(--accent-gold); border-bottom: 1px solid var(--card-border); padding-bottom: 10px; margin-bottom: 15px; }
    
    .action-btn { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 6px; font-family: 'Orbitron'; font-weight: bold; font-size: 0.75rem; cursor: pointer; border: none; }
    .btn-craft { background: var(--accent-cyan); color: #000; }

    #system-message { display:none; padding: 15px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; text-align: center; margin-bottom: 15px; font-family: 'Orbitron'; border: 1px solid var(--accent-red); color: var(--accent-red); background: rgba(255, 45, 85, 0.1); }
    
    .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,19,47,0.9); display: none; justify-content: center; align-items: center; z-index: 50; flex-direction: column; }

    @media (max-width: 900px) { .portal-layout { grid-template-columns: 1fr; } .inventory-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">SK8 PORTAL</div>
    <div style="display: flex; gap: 15px; align-items: center;">
        <div class="auth-badge" id="wax-auth-badge">
          <i class="fas fa-link" style="color:var(--accent-gold);"></i> 
          <span id="wax-wallet-display" style="color:#fff; font-family:monospace;"></span>
        </div>
        <button class="wax-login-btn" id="wax-login-btn" onclick="loginWAX()">CONNECT WAX</button>
    </div>
  </div>

  <div id="system-message"></div>

  <div class="portal-layout">
    <div style="position: relative;">
      <div class="inventory-grid" id="grid"></div>
      <div class="loading-overlay" id="api-loading">
          <i class="fas fa-circle-notch fa-spin" style="font-size:3rem; color:var(--accent-cyan); margin-bottom:1rem;"></i>
          <p>FETCHING ATOMIC DATA...</p>
      </div>
    </div>

    <div class="inspector-panel">
      <div class="inspector-header">ASSET INSPECTOR</div>
      <div id="inspector-content" style="text-align: center; opacity: 0.5;">
          <i class="fas fa-mouse-pointer" style="font-size: 3rem; margin-bottom: 1rem;"></i>
          <p>Select a skatecoinwax NFT</p>
      </div>
    </div>
  </div>

<script>
  // SECURE INITIALIZATION
  let wax = null;
  const TARGET_COLLECTION = "skatecoinwax"; 
  let rawInventory = [];

  function initWax() {
      if (!wax) {
          wax = new waxjs.WaxJS({ 
              rpcEndpoint: 'https://wax.greymass.com',
              tryAutoLogin: false 
          });
      }
  }

  async function loginWAX() {
    document.getElementById('system-message').style.display = 'none';
    initWax(); // Ensure wax is ready before calling it
    try {
      const userAccount = await wax.login();
      document.getElementById('wax-auth-badge').style.display = 'flex';
      document.getElementById('wax-wallet-display').innerText = userAccount.toUpperCase();
      document.getElementById('wax-login-btn').style.display = 'none';
      fetchAtomicAssets(userAccount);
    } catch (e) {
      document.getElementById('system-message').innerText = "AUTH ERROR: " + e.message;
      document.getElementById('system-message').style.display = 'block';
    }
  }

  async function fetchAtomicAssets(wallet) {
    const loadingEl = document.getElementById('api-loading');
    loadingEl.style.display = 'flex';
    
    // Multiple API Fallbacks for Vercel
    const nodes = ["https://wax.api.atomicassets.io", "https://atomic.wax.eosrio.io", "https://atomic.3dkrender.com"];
    let found = false;

    for (let node of nodes) {
        try {
            const r = await fetch(`${node}/atomicassets/v1/assets?owner=${wallet}&collection_name=${TARGET_COLLECTION}&limit=12`);
            const j = await r.json();
            if (j.success) {
                rawInventory = j.data;
                renderGrid();
                found = true;
                break;
            }
        } catch (err) { console.warn("Node failed: " + node); }
    }

    loadingEl.style.display = 'none';
    if (!found) {
        document.getElementById('system-message').innerText = "NO NFTS FOUND IN THIS COLLECTION";
        document.getElementById('system-message').style.display = 'block';
    }
  }

  function renderGrid() {
    const gridEl = document.getElementById('grid');
    gridEl.innerHTML = '';
    
    // Fill 12 slots
    for (let i = 0; i < 12; i++) {
        if (i < rawInventory.length) {
            const item = rawInventory[i];
            const img = item.data.img || item.template.immutable_data.img;
            gridEl.innerHTML += `
                <div class="slot" onclick="inspect('${item.asset_id}')">
                    <img src="https://atomichub-ipfs.com/ipfs/${img}" class="slot-img">
                    <div class="slot-name">${item.data.name || 'SK8 NFT'}</div>
                </div>`;
        } else {
            gridEl.innerHTML += `<div class="slot" style="opacity:0.2;"><i class="fas fa-plus"></i></div>`;
        }
    }
  }

  function inspect(id) {
      const item = rawInventory.find(x => x.asset_id === id);
      const img = item.data.img || item.template.immutable_data.img;
      const content = document.getElementById('inspector-content');
      content.style.opacity = "1";
      content.innerHTML = `
          <img src="https://atomichub-ipfs.com/ipfs/${img}" style="width:100%; border-radius:10px; margin-bottom:1rem;">
          <h2 style="font-family:'Bangers'; font-size:2rem; color:var(--accent-gold);">${item.data.name}</h2>
          <p style="font-size:0.7rem; margin-bottom:1rem;">ID: ${item.asset_id}</p>
          <button class="action-btn btn-craft" onclick="window.open('https://neftyblocks.com/collection/skatecoinwax/blends', '_blank')">OPEN BLENDER</button>
      `;
  }
</script>
</body>
</html>
