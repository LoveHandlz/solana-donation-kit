<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WAC ARTIST COLLABS | 12 NATIVE IFRAMES</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a132f;
            --bg-panel: rgba(15, 26, 71, 0.95);
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
        }

        body {
            background: var(--bg-deep);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 20px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 50%, #162a5e 0%, #0a132f 100%);
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 1px dashed var(--accent-cyan);
            padding-bottom: 1rem;
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 3.5rem;
            color: var(--accent-gold);
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        /* The 12-Frame 4-Column Layout */
        .iframe-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1440px;
            margin: auto;
            padding-bottom: 50px;
        }

        .iframe-container {
            background: var(--bg-panel);
            border: 2px solid var(--accent-cyan);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            transition: 0.3s;
            height: 600px; /* Forces enough height to see the NFT inside the frame */
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .iframe-container:hover {
            border-color: var(--accent-gold);
            transform: translateY(-5px);
            box-shadow: 0 5px 25px rgba(255, 215, 0, 0.2);
        }
        
        .iframe-label {
            font-family: 'Bangers';
            font-size: 1.2rem;
            color: #fff;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .raw-iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: #000;
            border-radius: 8px;
            /* Allows scaling down large marketplace pages */
            transform: scale(0.95);
            transform-origin: top center;
        }

        @media (max-width: 1100px) { .iframe-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 650px) { .iframe-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
