<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SK8COIN | UNIQUE COLLECTOR PORTAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a132f;
            --bg-panel: #0f1a47;
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
            --cc-red: #ff2d55;
            --card-border: rgba(0, 240, 255, 0.14);
        }

        body {
            background: var(--bg-deep);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 2rem;
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 3.5rem;
            color: var(--accent-gold);
            margin: 0;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .collector-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            max-width: 1440px;
            margin: auto;
        }

        .collector-card {
            background: var(--bg-panel);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.2rem;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: 0.3s ease;
        }

        .collector-card:hover {
            border-color: var(--accent-gold);
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
        }

        /* Rarity Dynamic Styling */
        .rarity-tag {
            position: absolute;
            top: 10px; right: 10px;
            font-size: 0.5rem;
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: 900;
            text-transform: uppercase;
            z-index: 5;
        }

        .nft-img {
            width: 100%;
            aspect-ratio: 1/1;
            background: #000;
            border-radius: 8px;
            margin-bottom: 1rem;
            object-fit: contain;
        }

        .artist-label {
            font-size: 0.55rem;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stats-box {
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            padding: 8px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
            margin-bottom: 1rem;
        }

        .stat { font-size: 0.5rem; text-align: center; color: #888; }
        .stat-val { display: block; color: #fff; font-weight: bold; font-size: 0.7rem; }

        .reward-banner {
            background: linear-gradient(90deg, transparent, rgba(0,240,255,0.1), transparent);
            text-align: center;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .skate-val { color: var(--accent-gold); font-weight: 900; font-size: 1rem; }

        .claim-btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-family: 'Orbitron';
            font-weight: 900;
            font-size: 0.65rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .loading-screen { text-align: center; padding: 4rem; color: var(--accent-cyan); }
    </style>
</head>
<body>

<header>
    <h1>UNIQUE ARTIST PORTAL</h1>
    <p style="color: var(--accent-cyan); font-size: 0.75rem; letter-spacing: 2px;">COLLECTOR REWARDS // POWERED BY $SKATE</p>
</header>

<div id="collector-container" class="collector-grid">
    <div class="loading-screen">SCANNING METADATA FOR UNIQUE ARTISTS...</div>
</div>

<script>
    const HELIUS_KEY = "29c35e1d-2cbb-4f50-b9fd-7df5a828e6bb";
    const ATOMIC_API = "https://wax.api.atomicassets.io/atomicassets/v1/assets";

    async function fetchUniqueCollectorGrid() {
        const container = document.getElementById('collector-container');
        const artistsFound = new Set();
        const displayData = [];

        try {
            // Fetch initial batch to process
            const response = await fetch(`${ATOMIC_API}?collection_name=skatecoinwax&schema_name=skateboards&limit=100&order=desc&sort=created&api_key=${HELIUS_KEY}`);
            const result = await response.json();

            if (result.success) {
                // Filter for Unique Artists using metadata
                for (let nft of result.data) {
                    const artist = nft.data.artist || nft.template.immutable_data.artist || "Unknown Legend";
                    
                    if (!artistsFound.has(artist) && displayData.length < 12) {
                        artistsFound.add(artist);
                        
                        // Decipher stats from metadata
                        const speed = nft.data.speed || Math.floor(Math.random() * 50) + 50;
                        const pop = nft.data.pop || Math.floor(Math.random() * 50) + 50;
                        const balance = nft.data.balance || Math.floor(Math.random() * 50) + 50;
                        const rarity = nft.data.rarity || "Common";

                        // Calculate $SKATE rewards based on rarity and total stats
                        let baseReward = rarity.toLowerCase() === 'legendary' ? 50 : rarity.toLowerCase() === 'rare' ? 20 : 5;
                        let statBonus = (speed + pop + balance) / 10;
                        let totalReward = (baseReward + statBonus).toFixed(2);

                        displayData.push({ nft, artist, speed, pop, balance, rarity, totalReward });
                    }
                }

                renderGrid(displayData);
            }
        } catch (e) {
            container.innerHTML = "METADATA SYNC ERROR.";
        }
    }

    function renderGrid(items) {
        const container = document.getElementById('collector-container');
        let html = '';

        items.forEach(item => {
            const imgHash = item.nft.data.img || item.nft.template.immutable_data.img;
            const imgUrl = `https://ipfs.io/ipfs/${imgHash}`;
            
            // Dynamic rarity colors
            const rarityColor = item.rarity.toLowerCase() === 'legendary' ? 'var(--rarity-legendary)' : 
                                item.rarity.toLowerCase() === 'rare' ? 'var(--accent-cyan)' : '#888';

            html += `
                <div class="collector-card">
                    <span class="rarity-tag" style="background:${rarityColor}">${item.rarity}</span>
                    <div class="artist-label">ARTIST: ${item.artist}</div>
                    <img src="${imgUrl}" class="nft-img" onerror="this.src='https://via.placeholder.com/300?text=Board+Syncing...'">
                    
                    <div class="stats-box">
                        <div class="stat">SPEED <span class="stat-val">${item.speed}</span></div>
                        <div class="stat">POP <span class="stat-val">${item.pop}</span></div>
                        <div class="stat">BAL <span class="stat-val">${item.balance}</span></div>
                    </div>

                    <div class="reward-banner">
                        <div style="font-size:0.5rem; color:#888;">COLLECTION REWARD</div>
                        <div class="skate-val">${item.totalReward} $SKATE</div>
                    </div>

                    <button class="claim-btn" onclick="window.open('https://wax.atomichub.io/explorer/asset/${item.nft.asset_id}', '_blank')">CLAIM ASSET</button>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    fetchUniqueCollectorGrid();
</script>
</body>
</html>
