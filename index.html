<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WAC ARTIST COLLABS | LITERAL IFRAME GRID</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a132f;
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
        }

        body {
            background: var(--bg-deep);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 20px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 1px dashed var(--accent-cyan);
            padding-bottom: 1rem;
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 3.5rem;
            color: var(--accent-gold);
            margin: 0;
            letter-spacing: 2px;
        }

        /* 12-Item Forced Grid Standard */
        .iframe-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 1440px;
            margin: auto;
            padding-bottom: 40px;
        }

        /* The Literal Iframe Wrapper */
        .raw-iframe {
            width: 100%;
            height: 600px;
            border: 2px solid var(--accent-cyan);
            border-radius: 8px;
            background: #000;
            transition: 0.3s;
        }

        .raw-iframe:hover {
            border-color: var(--accent-gold);
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.2);
        }

        @media (max-width: 1100px) { .iframe-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .iframe-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
    <h1>WAC ARTIST COLLABS</h1>
    <p style="color: var(--accent-cyan); font-size: 0.75rem; letter-spacing: 2px;">LITERAL IFRAME IMPLEMENTATION // BROWSER SECURITY WARNING</p>
</header>

<div class="iframe-grid" id="iframe-mount">
    </div>

<script>
    // The specific collab IDs requested
    const targetIDs = [
        "854945",        // Nerds Unite Template
        "857734",        // SquishEyez Template
        "1099949334880", // Specific Asset ID
        "847825",        // Template ID
        "791658"         // Template ID
    ];

    function buildIframeGrid() {
        const mount = document.getElementById('iframe-mount');
        let html = '';

        // 1. Populate the first 5 frames with the requested targets
        targetIDs.forEach(id => {
            // Determine if it's an Asset ID or a Template ID to route properly
            const isAsset = id.length > 10;
            const url = isAsset 
                ? `https://wax.atomichub.io/explorer/asset/${id}`
                : `https://wax.atomichub.io/explorer/template/skatecoinwax/${id}`;
            
            html += `<iframe src="${url}" class="raw-iframe" title="Wax Asset ${id}"></iframe>`;
        });

        // 2. Backfill the remaining 7 frames to force the 12-item grid
        // Using generic skatecoinwax marketplace links as placeholders
        for (let i = 0; i < 7; i++) {
            html += `<iframe src="https://wax.atomichub.io/market?collection_name=skatecoinwax&schema_name=skateboards" class="raw-iframe" title="Wax Market Fill"></iframe>`;
        }

        mount.innerHTML = html;
    }

    buildIframeGrid();
</script>

</body>
</html>
