<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>$SKATE REWARDS PORTAL | V1.7.2</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Bangers&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050a1a;
            --bg-panel: rgba(15, 26, 71, 0.95);
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
            --accent-green: #00ff88;
            --thps-blue: #0066ff;
            --card-border: rgba(0, 240, 255, 0.2);
            
            --rarity-common: #94a3b8;
            --rarity-uncommon: #4caf50;
            --rarity-rare: #2196f3;
            --rarity-mythic: #a855f7;
            --rarity-legendary: var(--accent-gold);
            --rarity-epic: #f43f5e;
        }

        body {
            background-color: var(--bg-deep);
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            background-image: radial-gradient(circle at 50% 50%, #162a5e 0%, #050a1a 100%);
            background-attachment: fixed;
        }

        header {
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid var(--accent-cyan);
            padding: 15px 40px;
            display: flex; justify-content: center;
            position: sticky; top: 0; z-index: 1000;
            backdrop-filter: blur(10px);
        }
        .header-inner { width: 100%; max-width: 1400px; display: flex; justify-content: space-between; align-items: center; }
        .logo { height: 45px; cursor: pointer; }
        
        nav ul { display: flex; list-style: none; gap: 30px; margin: 0; padding: 0; }
        nav a { color: #fff; text-decoration: none; font-family: 'Orbitron'; font-size: 0.75rem; font-weight: 900; letter-spacing: 2px; }
        nav a.active { color: var(--accent-cyan); text-shadow: 0 0 8px var(--accent-cyan); }

        .ticker-bar {
            background: rgba(0, 240, 255, 0.05);
            border-bottom: 1px solid var(--card-border);
            padding: 10px 0; display: flex; justify-content: center; gap: 40px;
            font-family: 'Orbitron'; font-weight: 900; font-size: 0.65rem;
        }

        .dashboard-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px; max-width: 1400px; margin: auto; padding: 40px;
        }

        .skate-card {
            background: var(--bg-panel); border: 1px solid var(--card-border);
            border-radius: 12px; overflow: hidden; transition: 0.3s;
        }
        .skate-card:hover { transform: translateY(-10px); border-color: var(--accent-gold); }
        .rarity-header { padding: 8px; text-align: center; font-weight: 900; font-size: 0.7rem; color: #000; text-transform: uppercase; }

        .img-wrap { width: 100%; height: 200px; display: flex; justify-content: center; align-items: center; background: #000; }
        .skate-img { max-height: 85%; object-fit: contain; }

        .card-body { padding: 20px; }
        .board-name { font-family: 'Bangers'; font-size: 1.8rem; margin: 0 0 15px 0; }
        
        .stat-meta { display: flex; justify-content: space-between; font-size: 0.6rem; font-weight: 900; color: var(--accent-cyan); font-family: 'Orbitron'; }
        .stat-bar-bg { height: 8px; background: #000; border-radius: 4px; border: 1px solid #333; overflow: hidden; margin-bottom: 10px; }
        .stat-bar-fill { height: 100%; background: var(--accent-gold); transition: width 1.5s; }

        .claim-zone { padding: 20px; background: rgba(0,0,0,0.4); border-top: 1px solid rgba(255,255,255,0.05); }
        .reward-info { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; }
        .reward-skate { font-family: 'Bangers'; font-size: 2rem; color: #fff; }
        .reward-usd { font-family: 'Inter'; font-size: 0.8rem; color: var(--accent-green); font-weight: 900; }
        
        .wallet-btn { 
            background: var(--accent-cyan); color: #000; border: none; padding: 10px 20px; 
            font-family: 'Orbitron'; font-weight: 900; cursor: pointer; width: 100%;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000; display: none; align-items: center; justify-content: center;
        }
        .modal-content { background: var(--bg-panel); padding: 40px; border-radius: 15px; border: 2px solid var(--accent-cyan); text-align: center; }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <img src="https://i.postimg.cc/VSvxfXsr/sk8coin-logo-biig.png" class="logo" onclick="location.reload()">
        <nav>
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#" class="active">GARAGE</a></li>
                <li><a href="#">TREASURY</a></li>
                <li><a href="#">DAO</a></li>
            </ul>
        </nav>
        <div style="width:150px"><button id="connect-btn" class="wallet-btn" onclick="toggleModal()">CONNECT</button></div>
    </div>
</header>

<div class="ticker-bar" id="price-ticker">SYNCING PROTOCOL DATA...</div>

<div class="dashboard-grid" id="main-grid">
    <h2 style="grid-column: 1/-1; text-align: center; color: #444; font-family: 'Bangers';">CONNECT WALLET TO SCAN INVENTORY</h2>
</div>

<div id="onboarding-modal" class="modal-overlay">
    <div class="modal-content">
        <h2 style="font-family:'Orbitron'; color:var(--accent-cyan);">SYNC WAX WALLET</h2>
        <button class="wallet-btn" id="login-trigger">CLOUD WALLET</button>
        <button onclick="toggleModal()" style="background:transparent; color:#555; border:none; margin-top:20px; cursor:pointer;">[ CANCEL ]</button>
    </div>
</div>

<script type="module">
    import { SessionKit } from 'https://esm.sh/@wharfkit/session?bundle';
    import { WebRenderer } from 'https://esm.sh/@wharfkit/web-renderer?bundle';
    import { WalletPluginCloudWallet } from 'https://esm.sh/@wharfkit/wallet-plugin-cloudwallet?bundle';

    const ATOMIC_API = "https://wax.api.atomicassets.io/atomicassets/v1";
    const COLLECTION = "skatecoinwax";
    const SCHEMA = "skateboards";

    const sessionKit = new SessionKit({
        appName: 'SkateRewardsV1.7.2',
        chains: [{ id: '1064487b3cd1a897ce03ae5b6a865651747e2e152090f99c1d19d44e01aea5a4', url: 'https://wax.greymass.com' }],
        ui: new WebRenderer(),
        walletPlugins: [ new WalletPluginCloudWallet() ]
    });

    let skatePriceUsd = 0;
    let currentSession = null;

    // MULTI-SOURCE PRICE SYNC
    async function syncPrices() {
        try {
            const cgRes = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=wax&vs_currencies=usd");
            const cgData = await cgRes.json();
            const wPrice = cgData.wax.usd;

            const alcorRes = await fetch("https://api.alcor.exchange/api/v2/tickers");
            const alcorData = await alcorRes.json();
            const skateWax = alcorData.find(t => t.ticker_id === "skatecoinwax-skate-eosio.token-wax");
            const sWax = parseFloat(skateWax?.last_price || 0);
            
            skatePriceUsd = wPrice * sWax;

            document.getElementById('price-ticker').innerHTML = `
                <div>WAX/USD: <b>$${wPrice.toFixed(4)}</b></div>
                <div>$SKATE/USD: <b>$${skatePriceUsd.toFixed(6)}</b></div>
                <div>$SKATE/WAX: <b>${sWax.toFixed(4)}</b></div>
            `;
            if(currentSession) loadInventory(currentSession.actor.toString());
        } catch (e) { document.getElementById('price-ticker').innerText = "NODE SYNC ERROR - REFRESHING..."; }
    }

    window.toggleModal = () => {
        const m = document.getElementById('onboarding-modal');
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
    };

    document.getElementById('login-trigger').addEventListener('click', async () => {
        const { session } = await sessionKit.login();
        currentSession = session;
        document.getElementById('connect-btn').innerText = session.actor.toString().toUpperCase();
        toggleModal();
        loadInventory(session.actor.toString());
    });

    // ATOMICASSETS INVENTORY UPGRADE
    async function loadInventory(user) {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = `<h2 style="grid-column: 1/-1; text-align: center; color: var(--accent-cyan);">SCANNING WAX BLOCKCHAIN...</h2>`;
        
        try {
            const res = await fetch(`${ATOMIC_API}/assets?collection_name=${COLLECTION}&schema_name=${SCHEMA}&owner=${user}&limit=12`);
            const json = await res.json();
            
            if (json.success && json.data.length > 0) {
                grid.innerHTML = json.data.map(nft => {
                    const m = nft.data;
                    const rarity = (m.rarity || 'common').toLowerCase();
                    const skateReward = 1000;
                    const usdValue = (skateReward * skatePriceUsd).toFixed(2);

                    return `
                        <div class="skate-card">
                            <div class="rarity-header" style="background:var(--rarity-${rarity});">${rarity} EDITION</div>
                            <div class="img-wrap"><img src="https://ipfs.io/ipfs/${m.img}" class="skate-img"></div>
                            <div class="card-body">
                                <div class="board-name">${nft.name}</div>
                                <div class="stat-meta">SPEED <span>${m.speed || 0}/10</span></div>
                                <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${(m.speed || 0)*10}%"></div></div>
                                <div class="stat-meta">POP <span>${m.pop || 0}/10</span></div>
                                <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${(m.pop || 0)*10}%; background:var(--thps-blue);"></div></div>
                            </div>
                            <div class="claim-zone">
                                <div class="reward-info">
                                    <div class="reward-skate">🛹 ${skateReward}</div>
                                    <div class="reward-usd">$${usdValue} USD</div>
                                </div>
                                <button class="wallet-btn">CLAIM $SKATE</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                grid.innerHTML = `<h2 style="grid-column: 1/-1; text-align: center; color: #444;">NO SKATEBOARDS DETECTED</h2>`;
            }
        } catch (e) { grid.innerHTML = `<h2>ERROR LOADING ASSETS</h2>`; }
    }

    syncPrices();
    setInterval(syncPrices, 60000);
</script>
</body>
</html>
