<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WAC ARTIST COLLABS | ISOLATED IMAGES</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a132f;
            --bg-panel: rgba(15, 26, 71, 0.95);
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
        }

        body {
            background: var(--bg-deep);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 20px;
            background-image: radial-gradient(circle at 50% 50%, #162a5e 0%, #0a132f 100%);
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 1px dashed var(--accent-cyan);
            padding-bottom: 1rem;
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 3.5rem;
            color: var(--accent-gold);
            margin: 0;
            letter-spacing: 2px;
        }

        /* Standardized 12-Item Layout */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1440px;
            margin: auto;
            padding-bottom: 40px;
        }

        /* Minimalist Frame for the Isolated Image */
        .image-card {
            background: var(--bg-panel);
            border: 2px solid var(--accent-cyan);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.05);
        }

        .image-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-5px);
            box-shadow: 0 5px 25px rgba(255, 215, 0, 0.2);
        }

        .board-title {
            font-family: 'Bangers';
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* The Isolated Image */
        .isolated-img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: contain;
            background: transparent;
            /* Adds a subtle drop shadow to the actual skateboard shape */
            filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.8));
        }

        @media (max-width: 1100px) { .image-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .image-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
    <h1>WAC ARTIST COLLABS</h1>
    <p style="color: var(--accent-cyan); font-size: 0.8rem; letter-spacing: 4px;">NATIVE IMAGE EXTRACTION VIA IPFS</p>
</header>

<div id="image-mount" class="image-grid">
    <div style="grid-column: 1/-1; text-align: center; color: var(--accent-cyan); padding: 50px;">
        EXTRACTING IMAGES FROM BLOCKCHAIN...
    </div>
</div>

<script>
    const ATOMIC_API = "https://wax.api.atomicassets.io/atomicassets/v1";

    // Your requested target IDs
    const TARGET_IDS = ["854945", "857734", "1099949334880", "847825", "791658"];

    async function fetchIsolatedImages() {
        const mount = document.getElementById('image-mount');
        const displayData = [];
        const artistsFound = new Set();

        try {
            // 1. Extract the specific requested boards
            for (let id of TARGET_IDS) {
                try {
                    const endpoint = id.length < 10 
                        ? `/assets?template_id=${id}&limit=1` 
                        : `/assets/${id}`;
                    
                    const response = await fetch(`${ATOMIC_API}${endpoint}`);
                    const json = await response.json();
                    
                    if (json.success) {
                        const nft = Array.isArray(json.data) ? json.data[0] : json.data;
                        if (nft) extractImage(nft, artistsFound, displayData);
                    }
                } catch (e) { console.log(`Skipped ID: ${id}`); }
            }

            // 2. Extract remaining boards to fill the 12-item grid
            if (displayData.length < 12) {
                const response = await fetch(`${ATOMIC_API}/assets?collection_name=skatecoinwax&schema_name=skateboards&limit=50&order=desc`);
                const json = await response.json();

                if (json.success) {
                    for (let nft of json.data) {
                        if (displayData.length < 12) {
                            extractImage(nft, artistsFound, displayData);
                        }
                    }
                }
            }

            // 3. Render the isolated images
            renderImages(displayData, mount);

        } catch (error) {
            mount.innerHTML = `<div style="grid-column:1/-1; text-align:center;">API SYNC ERROR.</div>`;
        }
    }

    // Function to isolate just the name and the image hash
    function extractImage(nft, artistSet, list) {
        const m = nft.data;
        const artist = m.artist || "Pro Artist";
        
        if (artistSet.has(artist)) return;
        artistSet.add(artist);

        // This is the critical step: grabbing the raw IPFS image hash
        const imageHash = m.img || nft.template.immutable_data.img;

        list.push({
            name: nft.name || m.name,
            // Wrapping the hash in the public IPFS gateway URL
            imgUrl: `https://ipfs.io/ipfs/${imageHash}`
        });
    }

    function renderImages(list, mount) {
        mount.innerHTML = list.map(board => `
            <div class="image-card">
                <div class="board-title">${board.name}</div>
                <img src="${board.imgUrl}" class="isolated-img" onerror="this.src='https://via.placeholder.com/300?text=Syncing...'">
            </div>
        `).join('');
    }

    fetchIsolatedImages();
</script>

</body>
</html>
