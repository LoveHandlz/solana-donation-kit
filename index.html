<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SK8COIN | Skate2Earn 6.8 (Anti-Self-Dealing Protocol)</title>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data:; audio-src 'self' https:;">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Bangers&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

<style>
:root {
  --bg-deep:#0a132f;
  --bg-panel:#0f1a47;
  --accent-red:#ff2d55;
  --accent-orange:#ff9500;
  --accent-cyan:#00f0ff;
  --accent-gold:#ffd700; 
  --accent-green:#4ade80;
  --accent-eth:#0052ff; /* Web3 Survival Blue */
  --text-primary:#e0f7ff;
  --text-secondary:#a5d8ff;
  --card-border:rgba(0,240,255,0.14);
  
  --bronze-font: #cd7f32;
  --silver-font: #c0c0c0;
  --gold-font: #ffd700;
  --diamond-font: #b9f2ff;
}

*{margin:0;padding:0;box-sizing:border-box;}

/* STRICT VIEWPORT LOCKDOWN */
html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

body{
  background:var(--bg-deep);
  color:var(--text-primary);
  font-family:'Orbitron',sans-serif;
  line-height: 1.6;
}

header{
  background:rgba(10,19,47,0.95);
  backdrop-filter:blur(12px);
  position:fixed;
  top:0;left:0;right:0;
  z-index:100;
  border-bottom:1px solid var(--card-border);
}

.header-inner{
  max-width:1440px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding: 1rem 20px;
  position: relative;
}

.logo{height:45px; z-index: 101;}

/* PERFECT DESKTOP CENTERING */
nav#mobile-nav { 
    display: flex; 
    flex: 1; 
    justify-content: center; 
}
nav#mobile-nav ul {
    display:flex;
    gap:1.8rem;
    list-style:none;
}
nav#mobile-nav a {
    color:var(--text-secondary);
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
    font-size:0.9rem;
    letter-spacing: 1px;
}
nav#mobile-nav a:hover{color:var(--accent-gold);}

.header-controls {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    z-index: 101;
}

.hamburger {
    display: none;
    font-size: 1.8rem;
    color: var(--accent-gold);
    cursor: pointer;
    transition: 0.3s;
}
.hamburger:hover { color: var(--accent-cyan); }

.wallet-btn {
  background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange));
  border: none;
  padding: .6rem 1.2rem;
  border-radius: 50px;
  cursor: pointer;
  font-family: 'Orbitron';
  font-weight: bold;
  color: #000;
  transition: 0.3s;
  white-space: nowrap;
  font-size: 0.75rem;
}

.evm-btn {
  background: var(--accent-eth);
  color: #fff;
}

main {
  padding-top: 120px; 
  max-width: 1440px;
  margin: auto;
  padding-left: 20px;
  padding-right: 20px;
  padding-bottom: 60px;
}

.hero { text-align: center; margin-bottom: 2.5rem; }
.hero h1 { 
  font-size: 4.5rem;
  background: linear-gradient(to bottom, #fff, var(--accent-gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  line-height: 1.1;
}

.hero-subtext {
  font-size: 1.3rem; 
  margin: 1rem auto 2rem; 
  color: var(--text-secondary); 
  max-width: 720px;
}

.stats-row {
  display: flex;
  justify-content: center;
  gap: 3rem;
  margin-top: 1.5rem;
}
.stat { font-size: 0.9rem; color: var(--text-secondary); text-transform: uppercase; }
.stat-value { display: block; font-size: 2rem; color: var(--accent-gold); font-weight: 900; }

.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.5rem;
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1.5rem;
}
.video-card {
  background: var(--bg-panel);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  overflow: hidden;
  transition: 0.3s;
  position: relative;
  width: 100%;
}
.video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; background: #000;}
.video-wrapper iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:none; z-index: 1;}

.video-mask {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(45deg, rgba(10,19,47,0.98), rgba(15,26,71,0.95));
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  z-index: 10; transition: 0.4s ease;
}
.video-mask i { font-size: 2rem; color: var(--accent-gold); margin-bottom: 8px; }
.video-mask p { font-size: 0.6rem; letter-spacing: 2px; color: #fff; text-transform: uppercase; font-weight: bold;}
.unlocked .video-mask { opacity: 0; pointer-events: none; visibility: hidden; }

.card-info { padding: 1.2rem; }
.card-title { font-size: 0.9rem; font-weight: bold; margin-bottom: 0.5rem; height: 35px; overflow: hidden; }

/* DUAL ACTION BUTTONS */
.multi-chain-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
}

.donate-btn {
  background: var(--accent-gold);
  color: #000;
  border: none;
  padding: 10px;
  border-radius: 6px;
  font-family: 'Orbitron';
  font-weight: 900;
  font-size: 0.75rem;
  cursor: pointer;
  width: 100%;
}

.bail-btn {
  background: var(--accent-eth);
  color: #fff;
  border: none;
  padding: 10px;
  border-radius: 6px;
  font-family: 'Orbitron';
  font-weight: 900;
  font-size: 0.75rem;
  cursor: pointer;
  width: 100%;
}

.view-profile-btn {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--card-border);
    margin-top: 4px;
    padding: 8px;
    font-size: 0.7rem;
    cursor: pointer;
    width: 100%;
    text-transform: uppercase;
    font-family: 'Orbitron';
    transition: 0.3s;
    border-radius: 6px;
}

.modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100vh; background:rgba(0,0,0,0.9); z-index:1000; justify-content:center; align-items:center; }
.modal-content { background:var(--bg-panel); padding:2rem; border-radius:15px; border:1px solid var(--accent-gold); width:92%; max-width:400px; text-align: center; }
.tier-btn { width: 100%; padding: 12px; margin-bottom: 10px; background: transparent; border: 1px solid var(--accent-gold); color: var(--accent-gold); font-family: 'Orbitron'; cursor: pointer; border-radius: 6px; font-weight: bold;}

.confetti { position: fixed; width: 10px; height: 10px; top: -10px; animation: fall 3s linear forwards; z-index: 2000; }
@keyframes fall { to { transform: translateY(100vh) rotate(360deg); opacity: 0; } }

@media (max-width: 768px) {
  .hero h1 { font-size: 2.2rem; }
  .video-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <img src="https://i.postimg.cc/VSvxfXsr/sk8coin-logo-biig.png" class="logo" onclick="navigateTo('home')" style="cursor:pointer;">
    
    <nav id="mobile-nav">
        <ul>
          <li><a href="javascript:void(0)" onclick="navigateTo('home')">HOME</a></li>
          <li><a href="javascript:void(0)" onclick="navigateTo('video')">VIDEOS</a></li>
          <li><a href="javascript:void(0)" onclick="navigateTo('leaderboard')">LEADERBOARD</a></li>
          <li><a href="javascript:void(0)" onclick="navigateTo('donate')">TREASURY</a></li>
        </ul>
    </nav>

    <div class="header-controls">
        <div id="skater-auth-panel" style="display: none; align-items: center; gap: 6px; background: rgba(0, 240, 255, 0.05); padding: 4px 10px; border-radius: 50px; border: 1px solid var(--accent-cyan);">
            <span style="font-size: 0.6rem; color: var(--accent-gold); font-weight: bold;">RANK: <span id="auth-skater-rank" style="color: #fff;">PRO</span></span>
            <button onclick="navigateToProfileView('skater')" style="background: var(--accent-cyan); color: #000; border: none; padding: 3px 8px; border-radius: 20px; font-size: 0.6rem; font-weight: 900; font-family: 'Orbitron'; cursor: pointer;">⚙️</button>
        </div>
        <button id="connect-sol-btn" class="wallet-btn" onclick="handleSolAction()">SOL</button>
        <button id="connect-evm-btn" class="wallet-btn evm-btn" onclick="handleEVMAction()">ETH</button>
    </div>
  </div>
</header>

<main>
  <div id="home-content">
    <section class="hero">
        <h1>SKATE2EARN</h1>
        <p class="hero-subtext">Multi-chain sponsorship logic for the next generation.</p>
        <button onclick="navigateTo('video')" class="wallet-btn" style="padding: 1rem 2rem; font-size: 1.2rem;">WATCH VIDEOS</button>
    </section>
  </div>

 <div id="video-content" style="display:none;">
    <div class="hero">
        <h1 style="font-size:2.8rem;">SK8 VIDEOS</h1>
    </div>
    
    <div class="video-grid" id="main-video-grid">
      </div>
</div>

  <div id="profile-content" style="display:none;">
      <h2 style="text-align:center;">User Profile</h2>
      <button onclick="navigateTo('home')" class="view-profile-btn">Back Home</button>
  </div>

  <div id="leaderboard-content" style="display:none;">
      <h2 style="text-align:center;">Boardroom Leaders</h2>
  </div>

  <div id="donate-content" style="display:none;">
      <h2 style="text-align:center;">Treasury</h2>
  </div>
</main>

<div id="sponsor-modal" class="modal-overlay">
  <div class="modal-content">
    <h3 style="color:var(--accent-gold); margin-bottom: 15px;">Sponsor Clip (SOL)</h3>
    <button onclick="sendSOL(0.01)" class="tier-btn">FLOW (0.01 SOL)</button>
    <button onclick="sendSOL(0.05)" class="tier-btn">AM (0.05 SOL)</button>
    <button onclick="sendSOL(0.1)" class="tier-btn">PRO (0.1 SOL)</button>
    <button onclick="closeModal()" style="background:transparent; color:#888; border:none; cursor:pointer;">[ Close ]</button>
  </div>
</div>

<div id="success-modal" class="modal-overlay">
    <div class="modal-content">
      <h2 style="color:var(--accent-gold); font-family:'Bangers'; font-size: 2.8rem;">UNLOCKED!</h2>
      <button onclick="closeSuccessModal()" class="wallet-btn" style="width:100%; margin-top:10px;">KEEP SKATING</button>
    </div>
</div>

<script>
let solPublicKey = null; let solProvider = null;
let evmAddress = null; let evmProvider = null; let evmSigner = null;
let activeVideoId = null; let currentSkaterTarget = "";

const SOL_RPC = "https://solana-rpc.publicnode.com";
const TREASURY_WALLET_SOL = "5xC5dQwRTqt6GvLurRJ4yxpBPmYM9egXQ1NokH4xFTNc";
const TREASURY_WALLET_EVM = "0x5C69bEe701ef814a2B6a3EDD4B1652CB9cc5aA6f";

const SPONSOR_ONLY_WALLETS = ["BZ6NiSdT4EbRtfbDVkCpRgiaVgAL96jyhGTznxbkrzMg"];

const SKATERS = [
    { name: "greg valencia", addr: "FqEnog4mFG3tGqnqG2dVwPHwPitxTRenr1zfvBxQZMsW", yt: "TkiDuln_Q28" },
    { name: "Tre Flip Gap", addr: "GzTbU3tnUCm6Y55Jxo1cPoBNkEzvRPeM3HDYcZqyCqPZ", yt: "3JZ_D3ELwOQ" },
    { name: "Manuals in Rain", addr: "4GtFZZj2KCoLnNhKH9SoNH7jsapzToiEYKpNyhnT6RWi", yt: "9bZkp7q19f0" },
    { name: "Big Ollie", addr: "6LjficeW9qWXd6Wa9ygn8yidteU7aRExgLbxFdMgByiW", yt: "kXYiU_JCYtU" },
    { name: "Epic Clips", addr: "BxEQSVXxYojLMijwnactZcHZKUMdVWryWXxZVqmgyRgi", yt: "Wg_jwgmwt-U" },
    { name: "Best Year", addr: "9smXB7M5NYXQRm4h6hrw3gdfNYs7tQgTgATGBvuLBozH", yt: "MFSx4jWmDfY" },
    { name: "Street Part", addr: "5dCFGUTNAxCVJGbGUFSUEukTGKBd4ffUm9Q425efXZzm", yt: "qqPjQpTe9W4" },
    { name: "Independent Co", addr: "9W8TxzG3ThA8i5bH6XCgXSF6wjf6D629dcfkUkNKj8Dj", yt: "Zq3kl6z_aEM" },
    { name: "Heelflip Challenge", addr: "HrXXR5VUKrH5ozCXsL6v5YCTTiVuKWp7KHuTYTiqHdCq", yt: "8_B_6vX1pXU" },
    { name: "Barcelona Trip", addr: "DwvZscExkDYdiHEus2moUWUGxfchwZ2RnrXZEgBfih2b", yt: "T9yZzS7L-98" },
    { name: "Manual Pad", addr: "DwvZscExkDYdiHEus2moUWUGxfchwZ2RnrXZEgBfih2b", yt: "6i1YyB7g-Ew" },
    { name: "Night School", addr: "E7tz7UK3obmpySK8ubyww8XWrVfZz4gLRwwyuHmTPWT7", yt: "P6Ff-e9V270" }
];

// INITIALIZE 12 VIDEO CARDS
const grid = document.getElementById('main-video-grid');
SKATERS.forEach((s, i) => {
    const cardId = `vid-${i+1}`;
    grid.innerHTML += `
      <div class="video-card" id="${cardId}">
        <div class="video-wrapper">
          <div class="video-mask"><i class="fas fa-lock"></i><p>Sponsor to Unlock</p></div>
          <iframe data-src="https://www.youtube.com/embed/${s.yt}" allowfullscreen></iframe>
        </div>
        <div class="card-info">
          <div class="card-title">${s.name}</div>
          <div class="skater-wallet-bal" data-address="${s.addr}">Scanning...</div>
          <div class="multi-chain-actions">
            <button class="donate-btn" onclick="openSponsorModal('${s.addr}', '${cardId}')">SPONSOR</button>
            <button class="bail-btn" onclick="sendEVM(0.005, '0x000000000000000000000000000000000000dEaD', '${cardId}')">BAIL FUND</button>
          </div>
        </div>
      </div>
    `;
});

// SOLANA CONNECT
async function handleSolAction() {
    if (solPublicKey) { 
        solPublicKey = null; 
        document.getElementById("connect-sol-btn").innerText = "SOL";
    } else { 
        solProvider = window.phantom?.solana;
        if (!solProvider) { alert("Install Phantom!"); return; } 
        try {
            const resp = await solProvider.connect(); 
            solPublicKey = resp.publicKey.toString(); 
            document.getElementById("connect-sol-btn").innerText = solPublicKey.slice(0,4) + "..";
            updateWalletUI(); checkPersistence();
        } catch (e) {}
    }
}

// METAMASK CONNECT (EVM)
async function handleEVMAction() {
    if (evmAddress) {
        evmAddress = null; evmSigner = null;
        document.getElementById("connect-evm-btn").innerText = "ETH";
    } else {
        if (typeof window.ethereum !== 'undefined') {
            try {
                evmProvider = new ethers.BrowserProvider(window.ethereum);
                const accounts = await evmProvider.send("eth_requestAccounts", []);
                evmAddress = accounts[0];
                evmSigner = await evmProvider.getSigner();
                document.getElementById("connect-evm-btn").innerText = evmAddress.slice(0,4) + "..";
                updateWalletUI(); checkPersistence();
            } catch (e) { alert("Connect rejected"); }
        } else { alert("Install MetaMask!"); }
    }
}

function updateWalletUI() {
    const auth = document.getElementById("skater-auth-panel");
    if (solPublicKey || evmAddress) {
        auth.style.display = "flex";
        const rank = document.getElementById("auth-skater-rank");
        if (SPONSOR_ONLY_WALLETS.includes(solPublicKey)) {
            rank.innerText = "SPONSOR";
        }
    }
}

async function sendSOL(amount) {
    try {
        const connection = new solanaWeb3.Connection(SOL_RPC, "confirmed");
        const fromPubkey = new solanaWeb3.PublicKey(solPublicKey);
        const toPubkey = new solanaWeb3.PublicKey(currentSkaterTarget);
        const tx = new solanaWeb3.Transaction().add(
            solanaWeb3.SystemProgram.transfer({ fromPubkey, toPubkey, lamports: amount * 1e9 })
        );
        const { blockhash } = await connection.getLatestBlockhash();
        tx.recentBlockhash = blockhash; tx.feePayer = fromPubkey;
        const signed = await solProvider.signTransaction(tx);
        await connection.sendRawTransaction(signed.serialize());
        handleUnlockSuccess();
    } catch (e) { alert("Tx Cancelled"); }
}

async function sendEVM(amt, dest, vidId) {
    if (!evmSigner) { alert("Connect ETH first!"); return; }
    try {
        activeVideoId = vidId;
        const tx = await evmSigner.sendTransaction({ to: dest, value: ethers.parseEther(amt.toString()) });
        await tx.wait();
        handleUnlockSuccess();
    } catch (e) { alert("EVM Error"); }
}

function handleUnlockSuccess() {
    let localKey = solPublicKey || evmAddress;
    if (activeVideoId && localKey) {
        let unlockedStr = localStorage.getItem('sk8_unlocks_' + localKey);
        let unlockedVids = unlockedStr ? JSON.parse(unlockedStr) : [];
        if (!unlockedVids.includes(activeVideoId)) {
            unlockedVids.push(activeVideoId);
            localStorage.setItem('sk8_unlocks_' + localKey, JSON.stringify(unlockedVids));
        }
    }
    document.getElementById("success-modal").style.display = "flex";
    createConfetti(); checkPersistence(); closeModal();
}

function checkPersistence() {
    let localKey = solPublicKey || evmAddress;
    if (!localKey) return;
    let unlockedVids = JSON.parse(localStorage.getItem('sk8_unlocks_' + localKey) || "[]");
    document.querySelectorAll('.video-card').forEach(card => {
        let iframe = card.querySelector('iframe');
        if (unlockedVids.includes(card.id)) {
            if (iframe.src !== iframe.dataset.src) iframe.src = iframe.dataset.src;
            card.classList.add('unlocked');
        }
    });
}

function navigateTo(p) {
    ["home", "video", "leaderboard", "donate", "profile"].forEach(id => {
        const el = document.getElementById(id + "-content");
        if(el) el.style.display = 'none';
    });
    document.getElementById(p + "-content").style.display = 'block';
    if(p === 'video') checkPersistence();
}

function openSponsorModal(addr, vid) {
    if(!solPublicKey) { alert("Connect SOL first"); return; }
    currentSkaterTarget = addr; activeVideoId = vid;
    document.getElementById("sponsor-modal").style.display = "flex";
}

function closeModal() { document.getElementById("sponsor-modal").style.display = "none"; }
function closeSuccessModal() { document.getElementById("success-modal").style.display = "none"; }

function createConfetti() {
  for (let i = 0; i < 50; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = Math.random() * 95 + '%'; 
    confetti.style.backgroundColor = ['#ff2d55', '#ff9500', '#00f0ff', '#ffd700'][Math.floor(Math.random() * 4)];
    confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
    document.body.appendChild(confetti);
    setTimeout(() => confetti.remove(), 5000);
  }
}
</script>
</body>
</html>
