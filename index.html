<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>$SKATE REWARDS PORTAL | DEFI INTERFACE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020617;
            --bg-panel: #0f172a;
            --accent-cyan: #00f0ff;
            --accent-gold: #fbbf24;
            --border-muted: rgba(255, 255, 255, 0.1);
            --rarity-common: #94a3b8;
            --rarity-rare: #3b82f6;
            --rarity-legendary: #f59e0b;
        }

        body {
            background-color: var(--bg-deep);
            color: #f8fafc;
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            /* Industrial DeFi Grid Background - No Glow */
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* --- DEFI TICKER --- */
        .ticker-wrap {
            background: #000;
            border-bottom: 2px solid var(--accent-cyan);
            padding: 10px 0;
            display: flex;
            justify-content: center;
            gap: 40px;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 2px;
        }
        .ticker-item span { color: var(--accent-cyan); margin-right: 8px; }
        .ticker-item b { color: var(--accent-gold); }

        nav {
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid var(--border-muted);
            padding: 15px 0;
            display: flex;
            justify-content: center;
            gap: 30px;
            backdrop-filter: blur(10px);
        }
        nav a { color: #fff; text-decoration: none; font-size: 0.8rem; letter-spacing: 3px; font-weight: 900; }
        nav a.active { color: var(--accent-cyan); border-bottom: 2px solid var(--accent-cyan); padding-bottom: 5px; }

        header { text-align: center; margin: 40px 0; }
        h1 { font-size: 3rem; letter-spacing: 10px; margin: 0; }
        .tagline { color: var(--accent-cyan); font-size: 0.7rem; letter-spacing: 8px; margin-top: 10px; opacity: 0.8; }

        /* --- STATS PANEL --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1440px;
            margin: 0 auto 50px;
            padding: 0 40px;
        }

        .skate-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-muted);
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s;
        }
        .skate-card:hover { border-color: var(--accent-cyan); }

        .image-mount {
            width: 100%;
            height: 180px;
            background: #000;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .skate-img { max-height: 90%; max-width: 90%; object-fit: contain; }

        .board-meta-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .board-name { font-family: 'Bangers'; font-size: 1.5rem; color: #fff; }
        .mint-tag { font-size: 0.6rem; color: #64748b; background: #000; padding: 2px 6px; }

        /* HUD STATS */
        .hud-grid { display: grid; gap: 8px; margin: 15px 0; }
        .stat-line { display: flex; align-items: center; justify-content: space-between; font-size: 0.6rem; font-weight: 900; }
        .bar-bg { width: 60%; height: 4px; background: #000; border-radius: 2px; }
        .bar-fill { height: 100%; background: var(--accent-cyan); border-radius: 2px; transition: width 1s; }

        /* FULL METADATA SPECS */
        .spec-grid {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-muted);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.55rem;
            color: #94a3b8;
        }
        .spec-item b { color: #fff; display: block; margin-bottom: 2px; }

        .claim-area {
            margin-top: auto;
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .reward-val { font-family: 'Bangers'; font-size: 2rem; color: var(--accent-gold); }
        .claim-btn {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-family: 'Orbitron';
            font-weight: 900;
            font-size: 0.65rem;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal {
            background: var(--bg-panel); border: 2px solid var(--accent-cyan);
            padding: 40px; text-align: center; width: 400px;
        }
    </style>
</head>
<body>

<div class="ticker-wrap" id="price-ticker">
    <div class="ticker-item"><span>WAX/USD:</span> <b id="wax-price">--</b></div>
    <div class="ticker-item"><span>SKATE/USD:</span> <b id="skate-price">--</b></div>
    <div class="ticker-item"><span>SKATE/WAX:</span> <b id="skate-wax">--</b></div>
</div>

<nav>
    <a href="#" class="active">INVENTORY</a>
    <a href="#">TREASURY</a>
    <a href="#">GOVERNANCE</a>
    <a href="#" id="logout-btn" style="color: #ef4444; display: none;">DISCONNECT</a>
</nav>

<header>
    <h1>$SKATE PORTAL</h1>
    <div class="tagline">SKATE2EARN REWARD INTERFACE</div>
</header>

<div id="auth-section" style="text-align: center; padding: 60px;">
    <button id="login-btn" style="background: var(--accent-gold); border: none; padding: 20px 60px; font-family: 'Orbitron'; font-weight: 900; font-size: 1.2rem; cursor: pointer;">CONNECT WAX WALLET</button>
</div>

<div class="dashboard-grid" id="main-grid"></div>

<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <h2 id="modal-title">REWARDS SECURED</h2>
        <p id="modal-body"></p>
        <button onclick="document.getElementById('modal-overlay').style.display='none'" style="background:var(--accent-cyan); border:none; padding:10px 30px; font-weight:900; cursor:pointer;">CONTINUE</button>
    </div>
</div>

<script type="module">
    import { SessionKit } from 'https://esm.sh/@wharfkit/session?bundle';
    import { WebRenderer } from 'https://esm.sh/@wharfkit/web-renderer?bundle';
    import { WalletPluginCloudWallet } from 'https://esm.sh/@wharfkit/wallet-plugin-cloudwallet?bundle';

    const ATOMIC_API = "https://wax.api.atomicassets.io/atomicassets/v1";
    const WAX_RPC = "https://wax.greymass.com";
    const SKATE_CONTRACT = "skatecoinwax";

    const sessionKit = new SessionKit({
        appName: 'SkateRewardsDeFi',
        chains: [{ id: '1064487b3cd1a897ce03ae5b6a865651747e2e152090f99c1d19d44e01aea5a4', url: WAX_RPC }],
        ui: new WebRenderer(),
        walletPlugins: [ new WalletPluginCloudWallet() ]
    });

    let activeUser = null;
    let marketData = { wax: 0, skate: 0 };

    // --- ALCOR API SYNC ---
    async function syncPrices() {
        try {
            const res = await fetch("https://api.alcor.exchange/api/v2/tickers");
            const data = await res.json();
            
            const waxTicker = data.find(t => t.ticker_id === "eosio.token-wax-usdc.alcor-usdc");
            const skateTicker = data.find(t => t.ticker_id === "skatecoinwax-skate-eosio.token-wax");

            if (waxTicker) {
                marketData.wax = parseFloat(waxTicker.last_price);
                document.getElementById('wax-price').innerText = `$${marketData.wax.toFixed(4)}`;
            }
            if (skateTicker) {
                const skateWax = parseFloat(skateTicker.last_price);
                marketData.skate = skateWax * marketData.wax;
                document.getElementById('skate-wax').innerText = `${skateWax.toFixed(4)} WAX`;
                document.getElementById('skate-price').innerText = `$${marketData.skate.toFixed(6)}`;
            }
        } catch (e) { console.error("Market Feed Error"); }
    }

    // --- WALLET AUTH ---
    document.getElementById('login-btn').addEventListener('click', async () => {
        const { session } = await sessionKit.login();
        setupPortal(session);
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
        await sessionKit.logout();
        location.reload();
    });

    sessionKit.restore().then(s => { if(s) setupPortal(s); });

    function setupPortal(session) {
        activeUser = session.actor.toString();
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('logout-btn').style.display = 'inline-block';
        
        syncPrices();
        fetchInventory();
    }

    // --- FETCH ALL ATOMIC METADATA ---
    async function fetchInventory() {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = `<h2 style="grid-column:1/-1; text-align:center;">SCANNING ATOMIC API...</h2>`;

        const res = await fetch(`${ATOMIC_API}/assets?collection_name=skatecoinwax&owner=${activeUser}&limit=12`);
        const json = await res.json();

        if (json.success && json.data.length > 0) {
            grid.innerHTML = json.data.map(nft => {
                const m = nft.data;
                const template = nft.template ? nft.template.immutable_data : {};
                
                // Combine Asset Data + Template Data
                const fullMetadata = { ...template, ...m };
                const img = fullMetadata.img || 'Qm...';
                
                return `
                    <div class="skate-card">
                        <div class="board-meta-top">
                            <span class="mint-tag">MINT #${nft.template_mint}</span>
                            <span style="font-size:0.5rem; color:var(--accent-cyan); font-weight:900;">${(fullMetadata.rarity || 'common').toUpperCase()}</span>
                        </div>

                        <div class="image-mount">
                            <img src="https://ipfs.io/ipfs/${img}" class="skate-img">
                        </div>

                        <div class="board-name">${nft.name}</div>

                        <div class="hud-grid">
                            <div class="stat-line">SPEED <div class="bar-bg"><div class="bar-fill" style="width:${fullMetadata.speed * 10 || 0}%"></div></div></div>
                            <div class="stat-line">POP <div class="bar-bg"><div class="bar-fill" style="width:${fullMetadata.pop * 10 || 0}%"></div></div></div>
                            <div class="stat-line">BALANCE <div class="bar-bg"><div class="bar-fill" style="width:${fullMetadata.balance * 10 || 0}%"></div></div></div>
                        </div>

                        <div class="spec-grid">
                            <div class="spec-item"><b>TRUCKS</b> ${fullMetadata.trucks || 'N/A'}</div>
                            <div class="spec-item"><b>WHEELS</b> ${fullMetadata.wheels || 'N/A'}</div>
                            <div class="spec-item"><b>BEARINGS</b> ${fullMetadata.bearings || 'N/A'}</div>
                            <div class="spec-item"><b>DECK</b> ${fullMetadata.deck || 'N/A'}</div>
                        </div>

                        <div class="claim-area">
                            <div class="reward-val">${calculateReward(fullMetadata.rarity)}</div>
                            <button class="claim-btn" onclick="triggerClaim('${nft.name}', '${fullMetadata.rarity}')">CLAIM</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
    }

    function calculateReward(rarity) {
        const rates = { 'common': 1000, 'uncommon': 2500, 'rare': 5000, 'mythic': 10000, 'legendary': 25000, 'epic': 50000 };
        return (rates[rarity?.toLowerCase()] || 1000).toLocaleString();
    }

    window.triggerClaim = (name, rarity) => {
        const amount = calculateReward(rarity);
        const overlay = document.getElementById('modal-overlay');
        document.getElementById('modal-body').innerHTML = `Successfully processed <b>${amount} $SKATE</b><br>for ${name}.`;
        overlay.style.display = 'flex';
        // Play grind sound
        new Audio('https://gfxsounds.com/wp-content/uploads/2023/02/Skateboard-grind-rail.mp3').play();
    };

    setInterval(syncPrices, 60000);
</script>
</body>
</html>
