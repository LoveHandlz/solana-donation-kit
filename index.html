<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAX PORTAL | Skate2Earn GameFi</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Bangers&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-deep: #0a132f;
      --bg-panel: #0f1a47;
      --accent-red: #ff2d55;
      --accent-orange: #ff9500;
      --accent-cyan: #00f0ff;
      --accent-gold: #ffd700; 
      --accent-green: #4ade80;
      --text-primary: #e0f7ff;
      --text-secondary: #a5d8ff;
      --card-border: rgba(0,240,255,0.14);
      
      --rarity-common: #a5d8ff;
      --rarity-rare: #00f0ff;
      --rarity-epic: #b142ff;
      --rarity-legendary: #ffd700;
      --rarity-mythic: #ff2d55;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg-deep); color: var(--text-primary); font-family: 'Inter', sans-serif; line-height: 1.6; padding: 2rem; }
    h1, h2, h3, .brand-font { font-family: 'Orbitron', sans-serif; }

    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 1rem; margin-bottom: 2rem; }
    .header-title { font-size: 2rem; color: var(--accent-cyan); font-weight: 900; }
    .auth-badge { background: rgba(0,240,255,0.05); border: 1px solid var(--accent-cyan); padding: 8px 15px; border-radius: 50px; font-size: 0.75rem; font-weight: bold; display: flex; align-items: center; gap: 10px; }
    
    .portal-layout { display: grid; grid-template-columns: 2.5fr 1fr; gap: 2rem; max-width: 1200px; margin: 0 auto; }
    
    /* LEFT SIDE: INVENTORY */
    .filter-bar { display: flex; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .filter-btn { background: rgba(255,255,255,0.05); color: var(--text-secondary); border: 1px solid var(--card-border); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-family: 'Orbitron'; font-size: 0.7rem; transition: 0.3s; }
    .filter-btn:hover, .filter-btn.active { background: var(--accent-cyan); color: #000; font-weight: bold; }

    .inventory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    
    .slot { aspect-ratio: 1 / 1; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); position: relative; cursor: pointer; transition: 0.3s; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .slot:hover { border-color: var(--text-secondary); background: rgba(255,255,255,0.05); }
    .slot.active { border: 2px solid var(--accent-gold); box-shadow: 0 0 15px rgba(255,215,0,0.2); background: rgba(255,215,0,0.05); }
    .slot.empty { cursor: default; }
    .slot.empty:hover { border-color: rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); }

    .slot-icon { font-size: 2.5rem; margin-bottom: 10px; opacity: 0.8; }
    .slot-name { font-size: 0.65rem; text-align: center; padding: 0 5px; font-weight: bold; text-transform: uppercase; color: var(--text-primary); line-height: 1.2; }
    .slot-mint { position: absolute; top: 5px; left: 5px; font-size: 0.55rem; color: #888; font-family: monospace; }
    .slot-wear { position: absolute; bottom: 5px; right: 5px; font-size: 0.55rem; color: var(--text-secondary); font-family: monospace; }
    
    .rarity-bar { position: absolute; top: 0; right: 0; width: 40%; height: 4px; border-bottom-left-radius: 4px; }

    /* RIGHT SIDE: INSPECTOR */
    .inspector-panel { background: var(--bg-panel); border: 1px solid var(--card-border); border-radius: 16px; padding: 1.5rem; display: flex; flex-direction: column; height: 100%; min-height: 500px; }
    .inspector-header { font-size: 0.8rem; color: var(--accent-gold); border-bottom: 1px solid var(--card-border); padding-bottom: 10px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; font-family: 'Orbitron'; }
    
    .empty-inspector { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text-secondary); opacity: 0.5; text-align: center; }
    .empty-inspector i { font-size: 3rem; margin-bottom: 15px; }

    .item-hero { text-align: center; margin-bottom: 20px; }
    .item-hero-icon { font-size: 4rem; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
    .item-title { font-family: 'Bangers', cursive; font-size: 1.8rem; letter-spacing: 1px; line-height: 1; margin-bottom: 5px; }
    .item-rarity { font-size: 0.7rem; text-transform: uppercase; font-weight: bold; padding: 3px 10px; border-radius: 50px; display: inline-block; }

    .stats-box { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
    .stat-row { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 8px; border-bottom: 1px dashed rgba(255,255,255,0.05); padding-bottom: 4px; }
    .stat-row:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
    .stat-label { color: var(--text-secondary); text-transform: uppercase; }
    .stat-val { font-family: monospace; font-weight: bold; color: var(--accent-green); }

    .action-btn { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 6px; font-family: 'Orbitron'; font-weight: bold; font-size: 0.75rem; cursor: pointer; transition: 0.3s; text-transform: uppercase; border: none; }
    .btn-craft { background: var(--accent-cyan); color: #000; }
    .btn-craft:hover { background: #fff; box-shadow: 0 0 15px var(--accent-cyan); }
    .btn-market { background: transparent; color: var(--accent-gold); border: 1px solid var(--accent-gold); }
    .btn-market:hover { background: var(--accent-gold); color: #000; }
    .btn-stake { background: transparent; color: var(--accent-green); border: 1px solid var(--accent-green); }
    .btn-stake:hover { background: var(--accent-green); color: #000; }

    @media (max-width: 900px) {
      .portal-layout { grid-template-columns: 1fr; }
      .inventory-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 600px) {
      .inventory-grid { grid-template-columns: repeat(2, 1fr); }
      .header-bar { flex-direction: column; align-items: flex-start; gap: 10px; }
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">WAX INVENTORY</div>
    <div class="auth-badge">
      <i class="fas fa-link" style="color:var(--accent-gold);"></i> 
      MASTER ID LINKED <span style="color:#fff; font-family:monospace;">[ GAP KILLER ]</span>
    </div>
  </div>

  <div class="portal-layout">
    
    <div>
      <div class="filter-bar" id="filters">
        <button class="filter-btn active" onclick="setFilter('All')">ALL ASSETS</button>
        <button class="filter-btn" onclick="setFilter('Deck')">DECKS</button>
        <button class="filter-btn" onclick="setFilter('Wheels')">WHEELS</button>
        <button class="filter-btn" onclick="setFilter('Trucks')">TRUCKS</button>
        <button class="filter-btn" onclick="setFilter('Bearings')">BEARINGS</button>
        <button class="filter-btn" onclick="setFilter('Complete')">COMPLETES</button>
      </div>

      <div class="inventory-grid" id="grid">
        </div>
    </div>

    <div class="inspector-panel">
      <div class="inspector-header"><i class="fas fa-search"></i> ASSET INSPECTOR</div>
      <div id="inspector-content">
        <div class="empty-inspector">
          <i class="fas fa-mouse-pointer"></i>
          <p>Select an asset to view metadata and available smart contract actions.</p>
        </div>
      </div>
    </div>

  </div>

<script>
  // MOCK ATOMIC ASSETS DATA (Simulating the API fetch)
  const rawInventory = [
    { id: "asset_1", name: "Neon Deck", type: "Deck", rarity: "Legendary", mint: 42, wear: 0, icon: "🛹" },
    { id: "asset_2", name: "Street Wheels 52mm", type: "Wheels", rarity: "Common", mint: 1045, wear: 15, icon: "⭕" },
    { id: "asset_3", name: "Titanium Trucks", type: "Trucks", rarity: "Epic", mint: 331, wear: 5, icon: "🔩" },
    { id: "asset_4", name: "Ceramic Bearings", type: "Bearings", rarity: "Rare", mint: 892, wear: 2, icon: "⚙️" },
    { id: "asset_5", name: "OG Wood Deck", type: "Deck", rarity: "Common", mint: 4501, wear: 45, icon: "🛹" },
    { id: "asset_6", name: "Park Wheels 54mm", type: "Wheels", rarity: "Rare", mint: 772, wear: 10, icon: "⭕" },
    { id: "asset_7", name: "Hollow Trucks", type: "Trucks", rarity: "Common", mint: 3100, wear: 25, icon: "🔩" },
    { id: "asset_8", name: "Steel Bearings", type: "Bearings", rarity: "Common", mint: 5512, wear: 30, icon: "⚙️" },
    { id: "asset_9", name: "Pro Series Deck", type: "Deck", rarity: "Epic", mint: 115, wear: 0, icon: "🛹" },
    { id: "asset_10", name: "Grip Tape Checker", type: "Other", rarity: "Common", mint: 8812, wear: 0, icon: "⬛" },
    { id: "asset_11", name: "Gold Hardware", type: "Other", rarity: "Rare", mint: 441, wear: 0, icon: "📌" },
    { id: "asset_12", name: "Master Complete Setup", type: "Complete", rarity: "Mythic", mint: 7, wear: 0, icon: "🔥" }
  ];

  const TOTAL_SLOTS = 12;
  let activeFilter = 'All';
  let activeAssetId = null;

  function getRarityColor(rarity) {
    switch(rarity) {
      case 'Common': return 'var(--rarity-common)';
      case 'Rare': return 'var(--rarity-rare)';
      case 'Epic': return 'var(--rarity-epic)';
      case 'Legendary': return 'var(--rarity-legendary)';
      case 'Mythic': return 'var(--rarity-mythic)';
      default: return '#fff';
    }
  }

  function renderGrid() {
    const gridEl = document.getElementById('grid');
    let html = '';

    // Filter logic
    let filteredItems = rawInventory;
    if (activeFilter !== 'All') {
      filteredItems = rawInventory.filter(item => item.type === activeFilter);
    }

    // Always render 12 slots to maintain the physical GameFi feel
    for (let i = 0; i < TOTAL_SLOTS; i++) {
      if (i < filteredItems.length) {
        const item = filteredItems[i];
        const isActive = item.id === activeAssetId ? 'active' : '';
        const rarityColor = getRarityColor(item.rarity);
        
        html += `
          <div class="slot ${isActive}" onclick="selectAsset('${item.id}')">
            <div class="rarity-bar" style="background-color: ${rarityColor}"></div>
            <div class="slot-mint">#${item.mint}</div>
            <div class="slot-wear">${item.wear > 0 ? item.wear + '% W' : 'MINT'}</div>
            <div class="slot-icon" style="color: ${rarityColor}">${item.icon}</div>
            <div class="slot-name">${item.name}</div>
          </div>
        `;
      } else {
        // Render Empty Placeholder
        html += `<div class="slot empty"><i class="fas fa-plus" style="color:rgba(255,255,255,0.1); font-size:1.5rem;"></i></div>`;
      }
    }
    gridEl.innerHTML = html;
  }

  function selectAsset(assetId) {
    activeAssetId = assetId;
    renderGrid(); // Update active highlights
    renderInspector();
  }

  function setFilter(type) {
    activeFilter = type;
    activeAssetId = null; // Reset selection on filter change
    
    // Update button visuals
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    renderGrid();
    renderInspector();
  }

  function renderInspector() {
    const inspectorEl = document.getElementById('inspector-content');
    
    if (!activeAssetId) {
      inspectorEl.innerHTML = `
        <div class="empty-inspector">
          <i class="fas fa-mouse-pointer"></i>
          <p>Select an asset to view metadata and available smart contract actions.</p>
        </div>`;
      return;
    }

    const item = rawInventory.find(i => i.id === activeAssetId);
    const rColor = getRarityColor(item.rarity);

    // Conditional buttons based on type
    let blendBtn = '';
    if (['Deck', 'Wheels', 'Trucks', 'Bearings'].includes(item.type)) {
      blendBtn = `<button class="action-btn btn-craft" onclick="triggerAction('CRAFT')"><i class="fas fa-hammer"></i> BLEND / CRAFT SET</button>`;
    }

    inspectorEl.innerHTML = `
      <div class="item-hero">
        <div class="item-hero-icon">${item.icon}</div>
        <div class="item-title" style="color: ${rColor}">${item.name}</div>
        <div class="item-rarity" style="background: ${rColor}20; border: 1px solid ${rColor}; color: ${rColor}">${item.rarity}</div>
      </div>

      <div class="stats-box">
        <div class="stat-row">
          <span class="stat-label">Asset Type</span>
          <span class="stat-val" style="color:var(--text-primary);">${item.type}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Mint Number</span>
          <span class="stat-val">#${item.mint}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Wear / Condition</span>
          <span class="stat-val" style="color:${item.wear > 0 ? 'var(--accent-orange)' : 'var(--accent-green)'}">${item.wear}%</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Token Standard</span>
          <span class="stat-val" style="color:var(--text-secondary);">AtomicAssets</span>
        </div>
      </div>

      <div class="action-buttons">
        ${blendBtn}
        <button class="action-btn btn-market" onclick="triggerAction('SELL')"><i class="fas fa-store"></i> LIST ON NEFTYBLOCKS</button>
        <button class="action-btn btn-stake" onclick="triggerAction('STAKE')"><i class="fas fa-lock"></i> STAKE FOR $SKATE</button>
      </div>
    `;
  }

  function triggerAction(actionType) {
    const item = rawInventory.find(i => i.id === activeAssetId);
    
    if (actionType === 'CRAFT') {
      alert(`[WAX CONTRACT INITIATED] \n\nSending ${item.name} to the Blend Contract. Select matching parts to forge a Complete Setup.`);
    } else if (actionType === 'SELL') {
      alert(`[MARKET ROUTING] \n\nRedirecting to NeftyBlocks to list Asset ID: ${item.id} (${item.name}).`);
    } else if (actionType === 'STAKE') {
      alert(`[STAKING PROTOCOL] \n\nLocking ${item.name} in the staking pool. Generating daily $SKATE yield.`);
    }
  }

  // Init
  renderGrid();

</script>
</body>
</html>
