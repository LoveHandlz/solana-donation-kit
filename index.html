<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SK8COIN | WAX COMPLETED BOARDS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a132f;
            --bg-panel: #0f1a47;
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
            --rarity-legendary: #ff00ff;
            --card-border: rgba(0, 240, 255, 0.14);
        }

        body {
            background: var(--bg-deep);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 2rem;
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 3.5rem;
            color: var(--accent-gold);
            margin: 0;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        /* Forced 12-item grid matching Crypto Clips Feed update */
        .wax-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            max-width: 1440px;
            margin: auto;
        }

        .board-card {
            background: var(--bg-panel);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.2rem;
            transition: 0.3s;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .board-card:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0, 240, 255, 0.1);
        }

        /* Reward Status Badge */
        .reward-badge {
            position: absolute;
            top: 10px; right: 10px;
            background: var(--rarity-legendary);
            color: #fff;
            font-size: 0.55rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 900;
            z-index: 10;
        }

        .nft-preview {
            width: 100%;
            aspect-ratio: 1/1;
            background: #000;
            border-radius: 8px;
            margin-bottom: 1rem;
            object-fit: contain;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .board-info { flex: 1; text-align: center; }
        .board-name { font-size: 0.85rem; font-weight: bold; color: var(--accent-cyan); margin-bottom: 10px; }
        
        .reward-meter {
            background: rgba(0,0,0,0.4);
            height: 6px;
            border-radius: 10px;
            margin: 10px 0;
            overflow: hidden;
        }
        .meter-fill { background: var(--accent-gold); height: 100%; width: 75%; box-shadow: 0 0 10px var(--accent-gold); }

        .claim-btn {
            background: transparent;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 10px;
            border-radius: 6px;
            font-family: 'Orbitron';
            font-weight: 900;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .claim-btn:hover { background: var(--accent-gold); color: #000; }

        @media (max-width: 1024px) { .wax-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .wax-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
    <h1>COMPLETED BOARDS</h1>
    <p style="color: var(--accent-cyan); font-size: 0.75rem; letter-spacing: 2px;">WAX MAINNET // SK8COIN SCHEMA PORTAL</p>
</header>

<div id="board-container" class="wax-grid">
    <div style="grid-column: 1/-1; text-align: center;">SYNCING WITH ATOMIC ASSETS...</div>
</div>

<script>
    // HELIUS API KEY INTEGRATION (Used as Background Auth Parameter)
    const HELIUS_API_KEY = "29c35e1d-2cbb-4f50-b9fd-7df5a828e6bb";
    const ATOMIC_API = "https://wax.api.atomicassets.io/atomicassets/v1/assets";

    async function fetchCompletedBoards() {
        const container = document.getElementById('board-container');
        
        try {
            // AtomicAssets API query specifically for 'skateboards' schema
            const response = await fetch(`${ATOMIC_API}?collection_name=skatecoinwax&schema_name=skateboards&limit=12&order=desc&sort=created&api_key=${HELIUS_API_KEY}`);
            const result = await response.json();

            if (result.success && result.data.length > 0) {
                let html = '';
                result.data.forEach(nft => {
                    // Pulling IPFS hash for visual preview
                    const imgHash = nft.data.img || nft.template.immutable_data.img;
                    const imgUrl = `https://ipfs.io/ipfs/${imgHash}`;
                    const rewardVal = (Math.random() * 10).toFixed(2); // Mock Reward Calculation

                    html += `
                        <div class="board-card">
                            <span class="reward-badge">COMPLETED</span>
                            <img src="${imgUrl}" class="nft-preview" onerror="this.src='https://via.placeholder.com/300?text=Board+Loading...'">
                            <div class="board-info">
                                <div class="board-name">${nft.name}</div>
                                <div style="font-size: 0.6rem; color: #888;">ASSET ID: #${nft.asset_id}</div>
                                <div class="reward-meter"><div class="meter-fill" style="width: ${Math.random()*100}%"></div></div>
                                <div style="font-size: 0.6rem; margin-bottom: 1rem;">EST. STAKING: <span style="color:var(--accent-gold);">${rewardVal} SK8</span></div>
                                <button class="claim-btn" onclick="window.open('https://wax.atomichub.io/explorer/asset/${nft.asset_id}', '_blank')">COLLECT REWARD</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } else {
                container.innerHTML = "<div style='grid-column:1/-1;'>No completed boards found in this schema.</div>";
            }
        } catch (error) {
            container.innerHTML = `<div style='grid-column:1/-1;'>API SYNC ERROR: ${error.message}</div>`;
        }
    }

    fetchCompletedBoards();
</script>
</body>
</html>
