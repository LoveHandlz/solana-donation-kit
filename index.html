<style>
:root {
  --bg-deep:#0a132f;
  --bg-panel:#0f1a47;
  --accent-red:#ff2d55;
  --accent-orange:#ff9500;
  --accent-cyan:#00f0ff;
  --accent-gold:#ffd700;

*{margin:0;padding:0;box-sizing:border-box;}

html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

body{
  background:var(--bg-deep);
  color:var(--text-primary);

}

header{
  background:rgba(10,19,47,0.95);
  backdrop-filter:blur(12px);

.header-inner{

  margin:auto;

  padding: 1rem 20px;

}

.logo{height:45px; z-index: 101;}

nav#mobile-nav { 
    display: flex; 
    flex: 1; 
    justify-content: center; 
}
nav#mobile-nav ul {
    display:flex;
    gap:1.8rem;
    list-style:none;
}
nav#mobile-nav a {
    color:var(--text-secondary);
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
    font-size:0.9rem;
    letter-spacing: 1px;
}
nav#mobile-nav a:hover{color:var(--accent-gold);}

.header-controls {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 15px;
    z-index: 101;
}

.hamburger {
    display: none;
    font-size: 1.8rem;
    color: var(--accent-gold);
    cursor: pointer;
    transition: 0.3s;
}
.hamburger:hover { color: var(--accent-cyan); }

.wallet-btn {
  background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange));
  border: none;
  padding: .7rem 1.4rem;
  border-radius: 50px;
  cursor: pointer;
  font-family: 'Orbitron';
  font-weight: bold;
  color: #000;
  transition: 0.3s;
  white-space: nowrap;
}

main {
  padding-top: 120px; 
  max-width: 1440px;
  margin: auto;
  padding-left: 20px;
  padding-right: 20px;
  padding-bottom: 60px;
}

.hero { text-align: center; margin-bottom: 2.5rem; }
.hero h1 { 
  font-size: 4.5rem;
  background: linear-gradient(to bottom, #fff, var(--accent-gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  line-height: 1.1;
}

.hero-subtext {
  font-size: 1.3rem; 
  margin: 1rem auto 2rem; 
  color: var(--text-secondary); 
  max-width: 720px;
}

.stats-row {
  display: flex;
  justify-content: center;
  gap: 3rem;
  margin-top: 1.5rem;
}
.stat { font-size: 0.9rem; color: var(--text-secondary); text-transform: uppercase; }
.stat-value { display: block; font-size: 2rem; color: var(--accent-gold); font-weight: 900; }

.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.5rem;
}
.menu-item {
  background: var(--bg-panel);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 2rem;
  cursor: pointer;
  transition: 0.3s;
}
.menu-item:hover {
  border-color: var(--accent-gold);
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(255, 215, 0, 0.1);
}
.menu-icon { font-size: 2.2rem; margin-bottom: 0.8rem; }
.menu-title { font-size: 1.1rem; font-weight: 900; margin-bottom: 0.5rem; color: var(--accent-cyan); }
.menu-desc { font-size: 0.8rem; color: var(--text-secondary); }

.video-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1.5rem;
}
.video-card {
  background: var(--bg-panel);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  overflow: hidden;
  transition: 0.3s;
  position: relative;
  width: 100%;
}
.video-card:hover { border-color: var(--accent-gold); transform: scale(1.02); }
.video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; background: #000;}
.video-wrapper iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:none; z-index: 1;}

.video-mask {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(45deg, rgba(10,19,47,0.98), rgba(15,26,71,0.95));
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  z-index: 10; transition: 0.4s ease;
}
.video-mask i { font-size: 2rem; color: var(--accent-gold); margin-bottom: 8px; }
.video-mask p { font-size: 0.6rem; letter-spacing: 2px; color: #fff; text-transform: uppercase; font-weight: bold;}
.unlocked .video-mask { opacity: 0; pointer-events: none; visibility: hidden; }

.card-info { padding: 1.2rem; }
.card-title { font-size: 0.9rem; font-weight: bold; margin-bottom: 0.5rem; height: 35px; overflow: hidden; }

.skater-wallet-bal {
  font-size: 0.7rem;
  color: var(--accent-cyan);
  margin-bottom: 1rem;
  font-weight: bold;
  word-break: break-all;
}

.usd-val {
  color: var(--accent-green);

  margin-left: 8px;
  font-family: 'Inter', sans-serif;
  font-size: 0.8rem;
}

.donate-btn {
  background: var(--accent-gold);
  color: #000;
  border: none;
  padding: 10px;
  border-radius: 6px;
  font-family: 'Orbitron';
  font-weight: 900;
  font-size: 0.75rem;
  cursor: pointer;
  width: 100%;
}

.view-profile-btn {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--card-border);
    margin-top: 8px;
    padding: 8px;
    font-size: 0.7rem;
    cursor: pointer;
    width: 100%;
    text-transform: uppercase;
    font-family: 'Orbitron';

}
.view-profile-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }

/* MODALS & LEADERBOARD (Omitted for brevity, keep existing 2.6 styles) */

                <span style="font-size: 0.6rem; color: var(--accent-gold); font-weight: bold;">RANK: <span id="auth-skater-rank" style="color: #fff;">PRO</span></span>
                <button onclick="navigateToProfileView('skater')" style="background: var(--accent-cyan); color: #000; border: none; padding: 3px 8px; border-radius: 20px; font-size: 0.6rem; font-weight: 900; font-family: 'Orbitron'; cursor: pointer;">⚙️</button>

                <span id="balance-emoji">🛹</span>

<main>
  <div id="home-content">
    <section class="hero"><h1>SKATE2EARN</h1><p class="hero-subtext">The Revolution lands here.</p></section>
    <div class="menu-grid">
        <div class="menu-item" onclick="navigateTo('video')">
            <div class="menu-icon">📺</div>
            <div class="menu-title">VIDEOS</div>
            <div class="menu-desc">Sponsor skaters directly. 3% protocol fee fuels the movement.</div>
        </div>
    </div>
  </div>

  <div id="video-content" style="display:none;">
    <div class="video-grid" id="main-v-grid">
        </div>
  </div>
  </main>

<script>
let publicKey = null; let provider = null; let solPrice = 0; let activeVideoId = null; let currentSkaterTarget = "";
const RPC_URL = "https://solana-rpc.publicnode.com";
const TREASURY_WALLET = "5xC5dQwRTqt6GvLurRJ4yxpBPmYM9egXQ1NokH4xFTNc";
const MEMO_PROGRAM_ID = new solanaWeb3.PublicKey("MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr");

/* 2.6 FOUNDATION: CORE FUNCTIONS INTACT */
function getProvider() { if ("phantom" in window) return window.phantom?.solana; return null; }

async function handleWalletAction() {
    if (publicKey) { publicKey = null; updateWalletUI(); }
    else {
        provider = getProvider();
        if (!provider) return alert("Install Phantom");
        const resp = await provider.connect();
        publicKey = resp.publicKey.toString();
        updateWalletUI();
    }
}

function updateWalletUI() {
    const btn = document.getElementById("connect-wallet-btn");
    btn.innerText = publicKey ? "CONNECTED" : "CONNECT";
    document.getElementById("wallet-balance-container").style.display = publicKey ? "flex" : "none";
    document.getElementById("skater-auth-panel").style.display = publicKey ? "flex" : "none";
}

/* THE ELITE 3% TREASURY SPLIT INTEGRATION */
async function sendSOL(amount, destination) {
  try {
    if (destination === publicKey) {
        alert("PROTOCOL ERROR: Anti-Self-Dealing active.");
        return; 
    }

    const connection = new solanaWeb3.Connection(RPC_URL, "confirmed");
    const fromPubkey = new solanaWeb3.PublicKey(publicKey);
    const transaction = new solanaWeb3.Transaction();

    // Lamport precision conversion
    const totalLamports = Math.floor(amount * solanaWeb3.LAMPORTS_PER_SOL);

    if (destination === TREASURY_WALLET) {
        // Direct Treasury support (100%)
        transaction.add(solanaWeb3.SystemProgram.transfer({ fromPubkey, toPubkey: new solanaWeb3.PublicKey(destination), lamports: totalLamports }));
    } else {
        // Skater Sponsorship with 3% Protocol Fee
        const feeLamports = Math.floor(totalLamports * 0.03);
        const skaterLamports = totalLamports - feeLamports;

        // Atomic Split (Both land or none land)
        transaction.add(solanaWeb3.SystemProgram.transfer({ fromPubkey, toPubkey: new solanaWeb3.PublicKey(destination), lamports: skaterLamports }));
        transaction.add(solanaWeb3.SystemProgram.transfer({ fromPubkey, toPubkey: new solanaWeb3.PublicKey(TREASURY_WALLET), lamports: feeLamports }));
    }

    const { blockhash } = await connection.getLatestBlockhash();
    transaction.recentBlockhash = blockhash;
    transaction.feePayer = fromPubkey;

    const signed = await provider.signTransaction(transaction);
    await connection.sendRawTransaction(signed.serialize());

    // Post-Success Logic
    handleSuccessfulUnlock();

  } catch (err) { console.log("Tx Aborted", err); }
}

function handleSuccessfulUnlock() {
    if (activeVideoId && publicKey) {
        let unlocks = JSON.parse(localStorage.getItem('sk8_unlocks_' + publicKey) || "[]");
        if (!unlocks.includes(activeVideoId)) {
            unlocks.push(activeVideoId);
            localStorage.setItem('sk8_unlocks_' + publicKey, JSON.stringify(unlocks));
        }
    }
    location.reload(); // Quick persistence refresh
}

function navigateTo(p) {
    document.getElementById('home-content').style.display = p==='home'?'block':'none';
    document.getElementById('video-content').style.display = p==='video'?'block':'none';
}
</script>
