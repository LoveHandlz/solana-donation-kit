<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WAC ARTIST COLLABS | SEASON 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Bangers&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a132f;
            --bg-panel: #0f1a47;
            --accent-cyan: #00f0ff;
            --accent-gold: #ffd700;
            --thps-blue: #0066ff;
            --card-border: rgba(0, 240, 255, 0.14);
            /* Rarity Reward Scale */
            --common: #888; --uncommon: #4caf50; --rare: #2196f3; 
            --mythic: #9c27b0; --legendary: #ff9800; --epic: #ff2d55; 
            --ridiculous: #00f0ff;
        }

        body {
            background: var(--bg-deep);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            margin: 0; padding: 20px;
            background-image: radial-gradient(circle at 50% 50%, #162a5e 0%, #0a132f 100%);
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 2rem;
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 3.5rem;
            color: #fff;
            margin: 0;
            -webkit-text-stroke: 1px var(--thps-blue);
            text-shadow: 4px 4px 0px var(--thps-blue);
        }

        /* Forced 12-item grid matching Crypto Clips Feed update */
        .wax-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            max-width: 1440px;
            margin: auto;
        }

        .board-card {
            background: var(--bg-panel);
            border: 2px solid #fff;
            padding: 1.2rem;
            transition: 0.3s;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            clip-path: polygon(0 0, 100% 0, 100% 92%, 92% 100%, 0 100%);
        }

        .board-card:hover {
            border-color: var(--accent-cyan);
            transform: scale(1.02);
            box-shadow: 0 5px 25px rgba(0, 240, 255, 0.2);
        }

        .rarity-tag {
            position: absolute;
            top: 5px; left: -5px;
            padding: 3px 12px;
            font-weight: 900;
            font-size: 0.6rem;
            transform: rotate(-5deg);
            box-shadow: 2px 2px 0 #000;
            text-transform: uppercase;
            z-index: 5;
        }

        .nft-preview {
            width: 100%;
            aspect-ratio: 1/1;
            background: #000;
            margin-bottom: 1rem;
            object-fit: contain;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* THPS Style Stats */
        .stat-group { margin: 8px 0; }
        .stat-label { font-size: 0.55rem; color: var(--accent-cyan); display: flex; justify-content: space-between; font-weight: 900; }
        .bar-bg { background: #000; height: 8px; border: 1px solid #333; margin-top: 2px; }
        .bar-fill { background: var(--accent-gold); height: 100%; box-shadow: 0 0 10px var(--accent-gold); }

        .hardware-meta {
            font-size: 0.55rem;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 4px;
            color: #aaa;
            margin: 10px 0;
            border-left: 2px solid var(--accent-cyan);
            line-height: 1.4;
        }

        .reward-area {
            margin-top: auto;
            text-align: center;
            border-top: 1px dashed rgba(255,255,255,0.2);
            padding-top: 12px;
        }

        .skate-val { font-weight: 900; color: #fff; font-size: 1.2rem; display: block; }
        .wax-price { font-size: 0.6rem; color: var(--accent-cyan); font-weight: bold; }

        .claim-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 10px;
            width: 100%;
            font-family: 'Orbitron';
            font-weight: 900;
            font-size: 0.7rem;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .claim-btn:hover { background: var(--accent-gold); }

        @media (max-width: 1024px) { .wax-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .wax-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
    <h1>WAC ARTIST COLLABS: S1</h1>
    <p style="color: var(--accent-cyan); font-size: 0.75rem; letter-spacing: 2px;">UNIQUE ARTIST METADATA // $SKATE REWARDS</p>
</header>

<div id="board-container" class="wax-grid">
    <div style="grid-column: 1/-1; text-align: center;">SYNCING WITH ATOMIC ASSETS...</div>
</div>

<script>
    const HELIUS_API_KEY = "29c35e1d-2cbb-4f50-b9fd-7df5a828e6bb";
    const ATOMIC_API = "https://wax.api.atomicassets.io/atomicassets/v1/assets";

    const SKATE_REWARDS = {
        'common': 100, 'uncommon': 250, 'rare': 500, 'mythic': 1000, 
        'legendary': 2000, 'epic': 5000, 'ridiculous': 10000
    };

    async function fetchCompletedBoards() {
        const container = document.getElementById('board-container');
        const artistsFound = new Set();
        const displayList = [];

        try {
            const response = await fetch(`${ATOMIC_API}?collection_name=skatecoinwax&schema_name=skateboards&limit=100&order=desc&api_key=${HELIUS_API_KEY}`);
            const result = await response.json();

            if (result.success && result.data.length > 0) {
                for (let nft of result.data) {
                    const m = nft.data;
                    const artist = m.artist || "Pro Artist";

                    if (!artistsFound.has(artist) && displayList.length < 12) {
                        artistsFound.add(artist);
                        const rarity = (m.rarity || "common").toLowerCase();
                        
                        displayList.push({
                            id: nft.asset_id,
                            name: nft.name || m.name,
                            img: m.img || nft.template.immutable_data.img,
                            rarity: rarity,
                            artist: artist,
                            deck: m.deck || "Hybrid Creatures",
                            speed: parseInt(m.speed) || Math.floor(Math.random() * 6) + 4,
                            pop: parseInt(m.pop) || Math.floor(Math.random() * 6) + 4,
                            balance: parseInt(m.balance) || Math.floor(Math.random() * 6) + 4,
                            trucks: m.trucks || "Gold/Red",
                            wheels: m.wheels || "Purple",
                            bearings: m.bearings || "RGB",
                            skate: SKATE_REWARDS[rarity] || 100,
                            wax: nft.prices && nft.prices[0] ? (nft.prices[0].amount / 100000000).toFixed(2) + " WAX" : "COLLECTIBLE"
                        });
                    }
                }

                container.innerHTML = displayList.map(b => `
                    <div class="board-card">
                        <span class="rarity-tag" style="background:var(--${b.rarity})">${b.rarity}</span>
                        <img src="https://ipfs.io/ipfs/${b.img}" class="nft-preview" onerror="this.src='https://via.placeholder.com/300?text=Board+Syncing...'">
                        
                        <div style="font-family:'Bangers'; color:var(--accent-gold); font-size:1.5rem; line-height:1;">${b.name}</div>
                        <div style="font-size:0.5rem; color:#888; margin-bottom:8px;">ARTIST: ${b.artist}</div>

                        <div class="stat-group">
                            <div class="stat-label">SPEED <span>${b.speed}/10</span></div>
                            <div class="bar-bg"><div class="bar-fill" style="width:${b.speed * 10}%"></div></div>
                        </div>
                        <div class="stat-group">
                            <div class="stat-label">POP <span>${b.pop}/10</span></div>
                            <div class="bar-bg"><div class="bar-fill" style="width:${b.pop * 10}%"></div></div>
                        </div>
                        <div class="stat-group">
                            <div class="stat-label">BALANCE <span>${b.balance}/10</span></div>
                            <div class="bar-bg"><div class="bar-fill" style="width:${b.balance * 10}%"></div></div>
                        </div>

                        <div class="hardware-meta">
                            <strong>DECK:</strong> ${b.deck}<br>
                            <strong>TRUCKS:</strong> ${b.trucks} | <strong>WHEELS:</strong> ${b.wheels}<br>
                            <strong>BRG:</strong> ${b.bearings}
                        </div>

                        <div class="reward-area">
                            <span class="wax-price">${b.wax}</span>
                            <span class="skate-val">${b.skate} $SKATE</span>
                            <button class="claim-btn" onclick="window.open('https://wax.atomichub.io/explorer/asset/${b.id}', '_blank')">COLLECT BOARD</button>
                        </div>
                    </div>
                `).join('');
            }
        } catch (error) {
            container.innerHTML = `<div style='grid-column:1/-1;'>API SYNC ERROR: ${error.message}</div>`;
        }
    }

    fetchCompletedBoards();
</script>
</body>
</html>
