async function fetchWalletStats(wallet) {
    const connection = new solanaWeb3.Connection(RPC_URL, "confirmed");
    let ins = 0; let outs = 0;
    try {
        const sigs = await connection.getSignaturesForAddress(new solanaWeb3.PublicKey(wallet), { limit: 25 });
        for (let s of sigs) {
            const tx = await connection.getTransaction(s.signature, { maxSupportedTransactionVersion: 0 });
            if (tx && tx.meta) {
                const accountKeys = tx.transaction.message.staticAccountKeys ? tx.transaction.message.staticAccountKeys.map(k=>k.toString()) : [];
                const wIdx = accountKeys.indexOf(wallet);
                if(wIdx !== -1) {
                    const pre = tx.meta.preBalances[wIdx]; const post = tx.meta.postBalances[wIdx];
                    const diff = (post - pre) / 1e9;
                    if (diff < -0.001) outs += Math.abs(diff); else if (diff > 0.001) ins += diff;        
                }
            }
        }
    } catch(e) {}
    
    let sponsorProf = SPONSOR_PROFILES.find(sp => sp.wallet === wallet);
    if(sponsorProf && sponsorProf.baseline) {
        outs = Math.max(outs, sponsorProf.baseline);
    }
    
    return { ins, outs };
}

    if(amount >= 0.05) return { title: "AM", color: "var(--silver-font)", icon: '<i class="fas fa-medal"></i>' };

    if (isSkater) return { title: "GROMMET", color: "var(--accent-green)", icon: '<i class="fas fa-seedling"></i>' };
    return amount > 0 ? { title: "SUPPORTER", color: "var(--text-secondary)", icon: '<i class="fas fa-handshake"></i>' } : { title: "POSER", color: "var(--accent-red)", icon: '🚫' };

async function resolveWalletName(wallet) {
    if (wallet === TREASURY_WALLET) return "Protocol Treasury";
    let sp = SPONSOR_PROFILES.find(s => s.wallet === wallet); if (sp) return sp.name;
    let sk = SKATER_PROFILES.find(s => s.wallet === wallet); if (sk) return sk.name;
    
    try {
        const sigs = await new solanaWeb3.Connection(RPC_URL, "confirmed").getSignaturesForAddress(new solanaWeb3.PublicKey(wallet), { limit: 5 });
        for (let s of sigs) { if(s.memo && s.memo.includes('"sk8":"v1"')) { const d = JSON.parse(s.memo.replace(/^\[\d+\]\s*/, '')); if(d.name) return d.name; } }
    } catch(e) {} 
    
    return "Anon Sponsor";
}

const pingDelay = ms => new Promise(res => setTimeout(res, ms));
let nameCache = {};
async function getSkaterNameSafe(wallet) {
    if(nameCache[wallet]) return nameCache[wallet];
    let name = await resolveWalletName(wallet);
    nameCache[wallet] = name;
    return name;
}

async function refreshLeaderboardData() {
    const connection = new solanaWeb3.Connection(RPC_URL, "confirmed");
    
    // Set Loaders for all lists across both tabs
    const loaderHtml = "<li><i class='fas fa-spinner fa-spin' style='margin-right:8px; color:var(--accent-cyan);'></i> Scanning Chain Activity...</li>";
    ['treasury-sponsors-list', 'skater-sponsors-list', 'donate-sponsors-list', 'donate-recent-list'].forEach(id => {
        const el = document.getElementById(id);
        if(el) el.innerHTML = loaderHtml;
    });

    // 1. Separate State Aggregators
    let aggTreasury = {};
    let aggSkaterSponsors = {};
    SPONSOR_PROFILES.forEach(sp => { aggSkaterSponsors[sp.wallet] = sp.baseline || 0; });
    
    let recentTreasuryHits = [];
    let recentSkaterHits = [];

    // 2. Scan specifically for TREASURY Activity
    try {
        const sigs = await connection.getSignaturesForAddress(new solanaWeb3.PublicKey(TREASURY_WALLET), { limit: 20 });
        for (let i = 0; i < sigs.length; i += 4) {
            const chunk = sigs.slice(i, i + 4);
            const txs = await Promise.all(chunk.map(s => connection.getTransaction(s.signature, { maxSupportedTransactionVersion: 0 }).catch(() => null)));
            
            for (let tx of txs) {
                if (tx && tx.meta && !tx.meta.err && tx.transaction && tx.transaction.message) {
                    const msg = tx.transaction.message;
                    const keys = msg.staticAccountKeys ? msg.staticAccountKeys.map(k=>k.toString()) : (msg.accountKeys ? msg.accountKeys.map(k=>k.toString()) : []);
                    const tIdx = keys.indexOf(TREASURY_WALLET);
                    
                    if(tIdx !== -1) {
                        const amount = (tx.meta.postBalances[tIdx] - tx.meta.preBalances[tIdx]) / solanaWeb3.LAMPORTS_PER_SOL;
                        if(amount > 0.001) {
                            const sponsorAddr = keys[0];
                            if(sponsorAddr !== TREASURY_WALLET) {
                                aggTreasury[sponsorAddr] = (aggTreasury[sponsorAddr] || 0) + amount;
                                recentTreasuryHits.push({ sponsor: sponsorAddr, amount: amount, time: tx.blockTime });
                            }
                        }
                    }
                }
            }
            await pingDelay(300); 
        }
    } catch(e) {}

    // 3. Scan specifically for SKATER Activity (Peer-to-Peer)
    try {
        for (let skaterWallet of SKATER_REGISTRY) {
            const sSigs = await connection.getSignaturesForAddress(new solanaWeb3.PublicKey(skaterWallet), { limit: 5 });
            const chunk = sSigs.slice(0, 5);
            const txs = await Promise.all(chunk.map(ss => connection.getTransaction(ss.signature, { maxSupportedTransactionVersion: 0 }).catch(() => null)));
            
            for (let sTx of txs) {
                if (sTx && sTx.meta && !sTx.meta.err && sTx.transaction && sTx.transaction.message) {
                    const msg = sTx.transaction.message;
                    const keys = msg.staticAccountKeys ? msg.staticAccountKeys.map(k=>k.toString()) : (msg.accountKeys ? msg.accountKeys.map(k=>k.toString()) : []);
                    const skaterIdx = keys.indexOf(skaterWallet);
                    
                    if (skaterIdx !== -1) {
                        const am = (sTx.meta.postBalances[skaterIdx] - sTx.meta.preBalances[skaterIdx]) / solanaWeb3.LAMPORTS_PER_SOL;
                        const sp = keys[0]; 
                        
                        if(am > 0.001) {
                            if(sp !== skaterWallet && sp !== TREASURY_WALLET) {
                                aggSkaterSponsors[sp] = (aggSkaterSponsors[sp] || 0) + am;
                                recentSkaterHits.push({ sponsor: sp, targetAddr: skaterWallet, amount: am, time: sTx.blockTime });
                            }
                        }
                    }
                }
            }
            await pingDelay(300); 
        }
    } catch(e) { console.error(e); }

    // 4. Format, Sort, and Rule of 12 Logic
    let topTreasurySponsors = Object.keys(aggTreasury).map(addr => ({ addr, val: aggTreasury[addr] })).sort((a, b) => b.val - a.val).slice(0, FEED_LIMIT);
    let topSkaterSponsors = Object.keys(aggSkaterSponsors).map(addr => ({ addr, val: aggSkaterSponsors[addr] })).sort((a, b) => b.val - a.val).slice(0, FEED_LIMIT);
    let topRecentTreasury = recentTreasuryHits.sort((a, b) => b.time - a.time).slice(0, FEED_LIMIT);
    let topRecentSkaters = recentSkaterHits.sort((a, b) => b.time - a.time).slice(0, FEED_LIMIT);
    
    // Resolve Names
    for(let j=0; j<topTreasurySponsors.length; j++) topTreasurySponsors[j].name = await getSkaterNameSafe(topTreasurySponsors[j].addr);
    for(let j=0; j<topSkaterSponsors.length; j++) topSkaterSponsors[j].name = await getSkaterNameSafe(topSkaterSponsors[j].addr);
    for(let j=0; j<topRecentTreasury.length; j++) topRecentTreasury[j].sponsorName = await getSkaterNameSafe(topRecentTreasury[j].sponsor);
    for(let j=0; j<topRecentSkaters.length; j++) {
        topRecentSkaters[j].sponsorName = await getSkaterNameSafe(topRecentSkaters[j].sponsor);
        topRecentSkaters[j].targetName = await getSkaterNameSafe(topRecentSkaters[j].targetAddr);
    }

    // 5. Render to UI
    const lbSponsorEl = document.getElementById("treasury-sponsors-list"); // The Boardroom Top Global (Skaters)
    const lbRecentEl = document.getElementById("skater-sponsors-list");   // The Boardroom Recent
    const trSponsorEl = document.getElementById("donate-sponsors-list"); // Treasury Tab Top Global (Treasury)
    const trRecentEl = document.getElementById("donate-recent-list");   // Treasury Tab Recent

    if (lbSponsorEl) lbSponsorEl.innerHTML = generateSponsorHtml(topSkaterSponsors, "No active global sponsors found.");
    if (trSponsorEl) trSponsorEl.innerHTML = generateSponsorHtml(topTreasurySponsors, "No global treasury sponsors found.");
    if (lbRecentEl) lbRecentEl.innerHTML = generateRecentHtml(topRecentSkaters, "skater");
    if (trRecentEl) trRecentEl.innerHTML = generateRecentHtml(topRecentTreasury, "treasury");
}

function generateSponsorHtml(sponsorsArray, emptyMessage) {
    let html = "";
    if (sponsorsArray.length === 0) return `<li class='leader-item'>${emptyMessage}</li>`;

    sponsorsArray.forEach((s, index) => {
        const rank = getRankDisplay(s.val, false);
        const pos = index + 1;
        
        // Sea Creature Hierarchy Logic (Gamified)
        let emoji = "🐟"; let creatureName = "FISH";
        if (pos === 1) { emoji = "🐋"; creatureName = "BLUE WHALE"; }
        else if (pos === 2) { emoji = "🐳"; creatureName = "WHALE"; }
        else if (pos === 3) { emoji = "🦈"; creatureName = "SHARK"; }
        else if (pos === 4) { emoji = "🐬"; creatureName = "DOLPHIN"; }
        else if (pos === 5) { emoji = "🦑"; creatureName = "SQUID"; }
        else if (pos > 5) { emoji = "🦀"; creatureName = "CRAB"; }
        
        // Top 5 Special Attention Gradients
        let rowStyle = "display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.3s;";
        
        if (pos === 1) rowStyle += " background: linear-gradient(90deg, rgba(0,240,255,0.2) 0%, transparent 100%); margin-bottom: 4px; border-radius: 8px; border-bottom: none;";
        else if (pos === 2) rowStyle += " background: linear-gradient(90deg, rgba(0,240,255,0.1) 0%, transparent 100%); margin-bottom: 4px; border-radius: 8px; border-bottom: none;";
        else if (pos === 3) rowStyle += " background: linear-gradient(90deg, rgba(74,222,128,0.15) 0%, transparent 100%); margin-bottom: 4px; border-radius: 8px; border-bottom: none;";
        else if (pos === 4) rowStyle += " background: linear-gradient(90deg, rgba(255,215,0,0.1) 0%, transparent 100%); margin-bottom: 4px; border-radius: 8px; border-bottom: none;";
        else if (pos === 5) rowStyle += " background: linear-gradient(90deg, rgba(255,149,0,0.1) 0%, transparent 100%); margin-bottom: 4px; border-radius: 8px; border-bottom: none;";

        html += `
            <li style="${rowStyle}">
                <div style="display: flex; align-items: center;">
                    <span style="font-size: 1.4rem; width: 35px; text-align: center; margin-right: 12px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));">
                        ${emoji}
                    </span>
                    <div style="display: flex; flex-direction: column;">
                        <span class="addr-tag clickable" style="color: ${rank.color}; font-weight: bold; font-family: 'Orbitron', sans-serif; cursor: pointer; transition: 0.2s;" onmouseover="this.style.color='var(--accent-cyan)';" onmouseout="this.style.color='${rank.color}';" onclick="navigateTo('profile', '${s.addr}')">
                            <span style="text-transform: uppercase;">${s.name}</span>

function checkPersistence() {
    let isAdmin = publicKey && ADMIN_WALLETS.includes(publicKey);

    document.querySelectorAll('.video-card').forEach(card => {
        let iframe = card.querySelector('iframe');
        
        if (!publicKey) { 
            card.classList.remove('unlocked'); 
            if (iframe) iframe.src = ""; 
            return; 
        }
        
        let unlocked = JSON.parse(localStorage.getItem('sk8_unlocks_' + publicKey) || "[]");
        
        if (isAdmin || unlocked.includes(card.id)) { 
            if (iframe && iframe.src !== iframe.dataset.src) iframe.src = iframe.dataset.src; 
            card.classList.add('unlocked'); 
        } else { 
            card.classList.remove('unlocked'); 
            if (iframe) iframe.src = ""; 
        }
    });
}

async function verifySponsorshipTier(sponsorPubKey, skaterPubKey, requiredSOL) {
    if (ADMIN_WALLETS.includes(sponsorPubKey)) { return true; }
    const conn = new solanaWeb3.Connection(RPC_URL, "confirmed");
    let totalDonated = 0;
    
    try {
        const sigs = await conn.getSignaturesForAddress(new solanaWeb3.PublicKey(skaterPubKey), { limit: 50 });
        for(let s of sigs) {
            const tx = await conn.getTransaction(s.signature, { maxSupportedTransactionVersion: 0 });
            if(tx) {
                const keys = tx.transaction.message.staticAccountKeys.map(k=>k.toString());
                if(keys[0] === sponsorPubKey) { 
                    const skaterIdx = keys.indexOf(skaterPubKey);
                    if(skaterIdx !== -1) {
                        const pre = tx.meta.preBalances[skaterIdx];
                        const post = tx.meta.postBalances[skaterIdx];
                        const diff = (post - pre) / solanaWeb3.LAMPORTS_PER_SOL;
                        if (diff > 0) totalDonated += diff;
                    }
                }
            }
        }
    } catch(e) {}
    
    const buffer = 0.001; 
    return totalDonated >= (requiredSOL - buffer);
}

async function fetchSkaterFeed(wallet, isBlurred) {

        const sigs = await conn.getSignaturesForAddress(new solanaWeb3.PublicKey(wallet), { limit: 60 });

            if(s.memo && s.memo.includes('"sk8post":"v1"')) { 
                const d = JSON.parse(s.memo.replace(/^\[\d+\]\s*/, ''));
                currentSkaterPosts.push({ text: d.text, yt: d.yt, ig: d.ig, time: s.blockTime });
            }

    renderFeedGrid(isBlurred);
}

            mediaHtml = `<div class="feed-grid-media" style="background: linear-gradient(45deg, #0a132f, #0f1a47); display:flex; align-items:center; justify-content:center;"><i class="fas fa-skating" style="font-size:3rem; color:rgba(0,240,255,0.1);"></i></div>`;
        }

        let blessBtn = isOwner ? "" : `<button class="feed-bless-btn" onclick="openSponsorshipModalFromFeed()">BLESS CLIP</button>`;

        html += `<div class="feed-grid-item" style="${isBlurred ? 'filter: blur(8px); opacity: 0.5;' : ''}">
                    ${mediaHtml}
                    <div class="feed-grid-content">
                        <div class="feed-grid-text">${p.text || ""}</div>
                        <div class="feed-grid-date" style="margin-bottom: ${isOwner ? '0' : '10px'};">${dateStr}</div>
                        ${blessBtn}
                    </div>
                 </div>`;
    });
    container.innerHTML = html;
    
    if(!isBlurred && currentSkaterPosts.length > feedRenderLimit) { loadMoreBtn.style.display = "block"; } else { loadMoreBtn.style.display = "none"; }
}

function loadMoreFeed() { feedRenderLimit += FEED_LIMIT; renderFeedGrid(false); }

function openSponsorshipModalFromFeed() { currentSkaterTarget = activeFeedWallet; activeVideoId = null; document.getElementById('sponsor-modal').style.display = 'flex'; }

async function publishToFeed() {
    if(!publicKey) return; 
    const btn = document.getElementById("publish-feed-btn"); 
    btn.innerText = "AWAITING SIGNATURE...";
    
    try {
        const text = document.getElementById("new-post-text").value;
        const rawLink = document.getElementById("new-post-link").value;
        
        let yt = ""; let ig = "";
        
        if (rawLink) { 
            const ytMatch = rawLink.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/); 
            if (ytMatch && ytMatch[2].length === 11) yt = ytMatch[2]; 
            const igMatch = rawLink.match(/(?:instagram\.com\/)(?:p|reel)\/([a-zA-Z0-9_-]+)/i);
            if (igMatch) ig = igMatch[1];
        }
        
        if(!text && !yt && !ig) { alert("Cannot post empty data."); btn.innerText = "SIGN & POST TO CHAIN"; return; }

        const pData = JSON.stringify({ sk8post: "v1", text, yt, ig });
        const encoded = new TextEncoder().encode(pData); 
        
        if (encoded.length > 566) { alert(`Post too long for Memo! Shorten your text.`); btn.innerText = "SIGN & POST TO CHAIN"; return; }
        
        const conn = new solanaWeb3.Connection(RPC_URL, "confirmed"); const from = new solanaWeb3.PublicKey(publicKey);
        const tx = new solanaWeb3.Transaction().add(new solanaWeb3.TransactionInstruction({ keys: [{ pubkey: from, isSigner: true, isWritable: true }], programId: MEMO_PROGRAM_ID, data: encoded }));
        tx.recentBlockhash = (await conn.getLatestBlockhash()).blockhash; tx.feePayer = from;
        
        await conn.sendRawTransaction((await provider.signTransaction(tx)).serialize());
        btn.innerText = "POSTED!"; 
        
        document.getElementById("new-post-text").value = ""; document.getElementById("new-post-link").value = "";
        setTimeout(() => { btn.innerText = "SIGN & POST TO CHAIN"; attemptFeedAccess(); }, 2000);
    } catch (err) { btn.innerText = "FAILED"; setTimeout(() => btn.innerText = "SIGN & POST TO CHAIN", 3000); }
}
