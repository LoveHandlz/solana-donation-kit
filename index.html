<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRYPTO CLIPS | Gamification Test Build</title>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data:; audio-src 'self' https:;">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Bangers&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>

<style>
:root {
  --bg-deep:#0a132f;
  --bg-panel:#0f1a47;
  --accent-red:#ff2d55;
  --accent-orange:#ff9500;
  --accent-cyan:#00f0ff;
  --accent-gold:#ffd700; 
  --accent-green:#4ade80;
  --text-primary:#e0f7ff;
  --text-secondary:#a5d8ff;
  --card-border:rgba(0,240,255,0.14);
  
  --bronze-font: #cd7f32;
  --silver-font: #c0c0c0;
  --gold-font: #ffd700;
  --diamond-font: #b9f2ff;
}

*{margin:0;padding:0;box-sizing:border-box;}
html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
body{ background:var(--bg-deep); color:var(--text-primary); font-family:'Orbitron',sans-serif; line-height: 1.6; }

header{ background:rgba(10,19,47,0.95); backdrop-filter:blur(12px); position:fixed; top:0;left:0;right:0; z-index:100; border-bottom:1px solid var(--card-border); }
.header-inner{ max-width:1440px; margin:auto; display:flex; justify-content:space-between; align-items:center; padding: 1rem 20px; position: relative; }

nav#mobile-nav { display: flex; flex: 1; justify-content: flex-start; }
nav#mobile-nav ul { display:flex; gap:1.8rem; list-style:none; }
nav#mobile-nav a { color:var(--text-secondary); text-decoration:none; font-weight:bold; transition:0.3s; font-size:0.9rem; letter-spacing: 1px; }
nav#mobile-nav a:hover{color:var(--accent-gold);}
.header-controls { display: flex; align-items: center; justify-content: flex-end; gap: 15px; z-index: 101;}
.hamburger { display: none; font-size: 1.8rem; color: var(--accent-gold); cursor: pointer; transition: 0.3s; }
.hamburger:hover { color: var(--accent-cyan);}

.wallet-btn { background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange)); border: none; padding: .7rem 1.4rem; border-radius: 50px; cursor: pointer; font-family: 'Orbitron'; font-weight: bold; color: #000; transition: 0.3s; white-space: nowrap; }

main { padding-top: 120px; max-width: 1440px; margin: auto; padding-left: 20px; padding-right: 20px; padding-bottom: 60px; }
.hero { text-align: center; margin-bottom: 2.5rem; }
.hero h1 { font-size: 4.5rem; background: linear-gradient(to bottom, #fff, var(--accent-gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-family: 'Orbitron', sans-serif; font-weight: 900; line-height: 1.1; }
.hero-subtext { font-size: 1.3rem; margin: 1rem auto 2rem; color: var(--text-secondary); max-width: 720px; }

/* DYNAMIC FEED GRID (12 ITEM EXPANDED) */
.clip-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }
.clip-card { background: var(--bg-panel); border: 1px solid var(--card-border); border-radius: 12px; overflow: hidden; transition: 0.3s; position: relative; width: 100%; display: flex; flex-direction: column; }
.clip-card:hover { border-color: var(--accent-gold); box-shadow: 0 5px 15px rgba(255,215,0,0.05); }
.clip-wrapper { position: relative; padding-bottom: 100%; height: 0; background: #000; flex-shrink: 0;}
.clip-wrapper iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:none; z-index: 1;}

.clip-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(45deg, rgba(10,19,47,0.98), rgba(15,26,71,0.95)); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; transition: 0.4s ease; }
.clip-mask i { font-size: 2rem; color: var(--accent-gold); margin-bottom: 8px; }
.clip-mask p { font-size: 0.6rem; letter-spacing: 2px; color: #fff; text-transform: uppercase; font-weight: bold;}
.unlocked .clip-mask { opacity: 0; pointer-events: none; visibility: hidden; }

.card-info { padding: 1.2rem; flex: 1; display: flex; flex-direction: column; }
.card-title { font-size: 0.95rem; font-weight: bold; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }

.usd-val { color: var(--accent-green); font-weight: 600; margin-left: 8px; font-family: 'Inter', sans-serif; font-size: 0.8rem; }
.donate-btn { background: var(--accent-gold); color: #000; border: none; padding: 10px; border-radius: 6px; font-family: 'Orbitron'; font-weight: 900; font-size: 0.75rem; cursor: pointer; width: 100%; margin-top: auto;}
.donate-btn:disabled { background: #333; color: #666; cursor: not-allowed; border: 1px solid #444; }

/* GAMIFICATION & REACTION STYLES */
.reaction-container { display: flex; justify-content: space-between; align-items: center; background: rgba(0,240,255,0.05); padding: 10px; border-radius: 8px; border: 1px dashed var(--accent-cyan); margin-bottom: 15px; }
.reaction-btn { background:none; border:none; cursor:pointer; color: #fff; font-family: 'Inter', sans-serif; font-size: 0.65rem; font-weight: bold; display: flex; flex-direction: column; align-items: center; gap: 2px; filter:grayscale(1) opacity(0.5); transition:0.2s; }
.reaction-btn:hover:not(.disabled-reaction) { filter:none; transform:scale(1.1); }
.reaction-btn.has-votes:not(.disabled-reaction) { filter: none; opacity: 1; color: var(--accent-gold); pointer-events: none; }
.reaction-btn.disabled-reaction { filter: grayscale(1); opacity: 0.4; cursor: not-allowed; pointer-events: none; }

/* GAMIFICATION VISUAL OVERLAYS */
.viral-fire { border-color: #ff4500 !important; animation: fire-pulse 1s infinite alternate; }
@keyframes fire-pulse { 0% { box-shadow: 0 0 10px rgba(255,69,0,0.5), inset 0 0 10px rgba(255,69,0,0.2); } 100% { box-shadow: 0 0 25px rgba(255,140,0,1), inset 0 0 20px rgba(255,140,0,0.6); border-color: #ff8c00 !important; } }
.sketchy { border-color: #39ff14 !important; box-shadow: 0 0 15px rgba(57,255,20,0.5); }
.rising-star { border-color: #ffd700 !important; box-shadow: 0 0 20px rgba(255,215,0,0.8); }
.butter-smooth { border-color: #fffacd !important; box-shadow: 0 0 20px rgba(255,250,205,0.6); }
.flex-god { border-color: #8a2be2 !important; box-shadow: 0 0 25px rgba(138,43,226,0.8); }

.hall-of-meat { position: relative; border-color: #8b0000 !important; box-shadow: 0 0 20px rgba(139,0,0,0.8); }
.hall-of-meat .clip-wrapper::after { content: "GROUND BEEF"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg) scale(1.2); font-family: 'Bangers', cursive; font-size: 4rem; color: rgba(255, 0, 0, 0.9); pointer-events: none; z-index: 20; text-shadow: 3px 3px 0px #000, -2px -2px 0px #400000; letter-spacing: 5px; opacity: 0.9; animation: smash 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
@keyframes smash { 0% { transform: translate(-50%, -50%) rotate(-15deg) scale(3); opacity: 0; } 100% { transform: translate(-50%, -50%) rotate(-15deg) scale(1.2); opacity: 0.9; } }

/* REDUCED BOARDROOM UI TEXT (-20%) */
#leaderboard-content .hero h1 { font-size: 3.6rem !important; }
#leaderboard-content .hero p.hero-subtext { font-size: 0.72rem !important; }

/* MODALS & OVERLAYS */
.modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100vh; background:rgba(0,0,0,0.9); z-index:1000; justify-content:center; align-items:center; }
.modal-content { background:var(--bg-panel); padding:2rem; border-radius:15px; border:1px solid var(--accent-gold); width:92%; max-width:400px; text-align: center; position: relative; margin: 0 auto; box-sizing: border-box; max-height: 90vh; overflow-y: auto; }

/* RESPONSIVE QUERIES */
@media (max-width: 1200px) { .clip-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 768px) { 
    .hamburger { display: block; } 
    nav#mobile-nav { position: absolute; top: 100%; left: 0; width: 100%; background: rgba(10,19,47,0.98); border-bottom: 1px solid var(--accent-cyan); border-top: 1px solid rgba(255,255,255,0.05); flex-direction: column; padding: 1.5rem 0; opacity: 0; pointer-events: none; transform: translateY(-10px); transition: all 0.3s ease-in-out; z-index: 99; }
    nav#mobile-nav.open { opacity: 1; pointer-events: auto; transform: translateY(0); } 
    nav#mobile-nav ul { flex-direction: column; width: 100%; text-align: center; gap: 1.5rem; }
    .clip-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
}
@media (max-width: 480px) {
    .clip-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
  <header>
    <div class="header-inner">
      <nav id="mobile-nav">
        <ul>
          <li><a href="#home">HOME</a></li>
          <li><a href="#clips">CLIPS</a></li>
          <li><a href="#defi">DEFI</a></li>
          <li><a href="#treasury">TREASURY</a></li>
          <li><a href="#dao">DAO</a></li>
        </ul>
      </nav>
      <div class="header-controls">
        <div id="wallet-ui" style="display:flex; align-items:center; gap:10px;">
          <button id="connect-wallet-btn" class="wallet-btn">CONNECT WALLET</button>
        </div>
        <i class="fas fa-bars hamburger" onclick="toggleMenu()"></i>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" id="home">
      <h1>CRYPTO CLIPS</h1>
      <p class="hero-subtext">The Decentralized Skateboard Syndicate. Connect your wallet to enter the boardroom, vote in the DAO, and drop your sponsor me video on-chain.</p>
    </section>

    <div class="post-create-box" id="post-create-box">
        <h3 style="color: var(--accent-cyan); margin-bottom: 10px;">DROP A NEW CLIP</h3>
        <input type="text" id="new-clip-url" placeholder="Paste YouTube/Instagram URL..." style="width:100%; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid var(--accent-cyan); color: #fff; margin-bottom: 10px; border-radius: 6px; font-family: 'Inter', sans-serif;">
        <input type="text" id="new-clip-title" placeholder="Clip Title / Description" style="width:100%; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid var(--accent-cyan); color: #fff; margin-bottom: 15px; border-radius: 6px; font-family: 'Inter', sans-serif;">
        <button class="wallet-btn" onclick="submitNewClipToChain()" style="width: 100%;">MINT TO CHAIN</button>
    </div>

    <section id="clips-feed-section">
      <h2 style="color: var(--accent-gold); margin-bottom: 20px; text-transform: uppercase; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; font-size: 1.2rem;">THE FEED</h2>
      
      <div class="clip-grid" id="dynamic-clip-feed">
         </div>
    </section>
  </main>

<script>
  // --- WEB3 INFRASTRUCTURE & GLOBAL STATE ---
  const { Connection, PublicKey, SystemProgram } = solanaWeb3;
  // Using a standard mainnet RPC. In production, swap to a dedicated QuickNode or Helius RPC.
  const connection = new Connection("https://api.mainnet-beta.solana.com", "confirmed");
  
  // Replace with your actual deployed SK8/Crypto Clips Program ID
  const PROGRAM_ID = new PublicKey("11111111111111111111111111111111"); 
  
  let connectedWallet = null;
  let userProfilePDA = null;

  // --- DAO CONFIGURATION (Mutable via Governance) ---
  // These values can be updated when an admin passes a proposal
  let DAO_CONFIG = {
    emojiValues: {
      fire: 10,
      skull: 5,
      star: 15,
      butter: 20
    },
    maxFeedItems: 12
  };

  // --- WALLET CONNECTION & ONBOARDING ---
  async function connectWallet() {
    try {
      if (window.solana && window.solana.isPhantom) {
        const resp = await window.solana.connect();
        connectedWallet = resp.publicKey.toString();
        console.log("Wallet connected:", connectedWallet);
        
        // Update UI
        const walletBtn = document.getElementById('connect-wallet-btn');
        walletBtn.innerText = connectedWallet.slice(0, 4) + '...' + connectedWallet.slice(-4);
        walletBtn.style.background = 'var(--accent-cyan)';
        
        // Trigger On-Chain Identity Check
        await checkProfilePDA(resp.publicKey);
      } else {
        alert("Phantom Wallet not found! Please install the extension.");
      }
    } catch (err) {
      console.error("Connection failed:", err);
    }
  }

  // Bind the connection to the header button
  document.getElementById('connect-wallet-btn').addEventListener('click', connectWallet);

  // --- DYNAMIC REGISTRY LOOKUP ---
  async function checkProfilePDA(walletPubKey) {
    try {
      console.log("Checking blockchain for user profile...");
      // Derive the PDA using the "profile" seed and the user's pubkey
      const [pda, bump] = await PublicKey.findProgramAddress(
        [Buffer.from("profile"), walletPubKey.toBuffer()],
        PROGRAM_ID
      );

      const accountInfo = await connection.getAccountInfo(pda);

      if (accountInfo === null) {
        // RPC returned null: User does not exist on-chain.
        console.log("New skater detected. Initiating onboarding...");
        triggerOnboardingFlow(); 
      } else {
        // User exists! 
        console.log("Welcome back to the Boardroom.");
        userProfilePDA = pda.toString();
        document.getElementById('post-create-box').style.display = 'block'; // Unlock posting
      }
      
      // Re-render feed to apply connected-wallet specific UI checks
      renderDynamicFeed(); 

    } catch (err) {
      console.error("Error fetching PDA:", err);
    }
  }

  function triggerOnboardingFlow() {
    // In Part 4, we will hook this up to a modal that takes a username 
    // and sends an instruction to initialize the profile PDA.
    alert("New Wallet Detected! Onboarding flow triggered. (Creating on-chain profile...)");
  }

  // --- ANTI-SELF-FUNDING & INTERACTION LOGIC ---
  function applySecurityChecks(clipOwnerWallet, clipElementId) {
    if (!connectedWallet) return; // If not logged in, standard read-only view

    const isOwner = connectedWallet === clipOwnerWallet;
    const clipElement = document.getElementById(clipElementId);
    
    if (isOwner) {
      // ZERO-TOLERANCE UI LOCKDOWN
      const reactionBtns = clipElement.querySelectorAll('.reaction-btn');
      reactionBtns.forEach(btn => {
        btn.classList.add('disabled-reaction');
        btn.title = "You cannot boost your own clip.";
      });

      const donateBtn = clipElement.querySelector('.donate-btn');
      if(donateBtn) {
        donateBtn.disabled = true;
        donateBtn.innerText = "OWNER (LOCKED)";
      }
    }
  }

  // --- DYNAMIC CLIP SUBMISSION (Mocked for UI) ---
  function submitNewClipToChain() {
    const url = document.getElementById('new-clip-url').value;
    const title = document.getElementById('new-clip-title').value;
    
    if (!url || !title) return alert("Fill out the clip details.");
    
    console.log(`Sending instruction to mint new Clip PDA for: ${title}`);
    alert("Transaction sent! Waiting for confirmation...");
    // Here we would call the actual Solana program instruction to create the Clip PDA.
  }

// --- DYNAMIC FEED RENDERING ---
  async function renderDynamicFeed() {
    const feedContainer = document.getElementById('dynamic-clip-feed');
    feedContainer.innerHTML = '<p style="color:var(--accent-cyan); font-family:\'Orbitron\';">Syncing with blockchain...</p>';

    // MOCK ON-CHAIN DATA: In production, this maps over fetched Clip PDAs
    // I am including a mock clip owned by the connected wallet to test the security lockdown
    const mockOnChainClips = [
      { 
        id: 'clip_pda_1', 
        ownerPubkey: 'SomeOtherSkaterWallet123', 
        mediaUrl: 'https://www.youtube.com/embed/ScMzIvxBSi4', 
        title: 'Nollie Heelflip El Toro', 
        usdValue: '45.50',
        viralState: 'viral-fire' // Pulls from your extreme overlays
      },
      { 
        id: 'clip_pda_2', 
        ownerPubkey: connectedWallet || 'OfflineViewerState', // Will trigger security lock if wallet is connected
        mediaUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ', 
        title: 'Sponsor Me Tape Vol. 4', 
        usdValue: '0.00',
        viralState: ''
      }
    ];

    feedContainer.innerHTML = ''; // Clear loading text

    mockOnChainClips.slice(0, DAO_CONFIG.maxFeedItems).forEach(clip => {
      const cardHTML = `
        <div class="clip-card ${clip.viralState}" id="clip-card-${clip.id}">
          <div class="clip-wrapper">
            <iframe src="${clip.mediaUrl}" allowfullscreen></iframe>
            </div>
          <div class="card-info">
            <div class="card-title">
              <span>${clip.title}</span>
              <span class="usd-val">$${clip.usdValue}</span>
            </div>
            
            <div class="reaction-container">
              <button class="reaction-btn" onclick="castVote('${clip.id}', 'fire', this)">
                <i class="fas fa-fire"></i><span>${DAO_CONFIG.emojiValues.fire}</span>
              </button>
              <button class="reaction-btn" onclick="castVote('${clip.id}', 'skull', this)">
                <i class="fas fa-skull"></i><span>${DAO_CONFIG.emojiValues.skull}</span>
              </button>
              <button class="reaction-btn" onclick="castVote('${clip.id}', 'star', this)">
                <i class="fas fa-star"></i><span>${DAO_CONFIG.emojiValues.star}</span>
              </button>
            </div>

            <button class="donate-btn" onclick="sendBlessing('${clip.id}')">BLESS CLIP</button>
          </div>
        </div>
      `;
      
      feedContainer.insertAdjacentHTML('beforeend', cardHTML);
    });

    // Run the absolute truth UI check on the newly rendered items
    mockOnChainClips.forEach(clip => {
      applySecurityChecks(clip.ownerPubkey, `clip-card-${clip.id}`);
    });
  }

  // Initialize the feed on standard page load (before wallet connection)
  document.addEventListener('DOMContentLoaded', renderDynamicFeed);

// --- GAMIFICATION ENGINE (1-Click Emoji Receipts) ---
  function castVote(clipId, reactionType, btnElement) {
    if (!connectedWallet) {
      alert("Connect your wallet to enter the boardroom and vote.");
      return;
    }

    // Check if it's already voted (UI layer check)
    if (btnElement.classList.contains('has-votes') || btnElement.classList.contains('disabled-reaction')) {
      return; // Ignore click if already voted or if it's the user's own clip
    }

    console.log(`Casting vote: ${reactionType} on clip ${clipId} by wallet ${connectedWallet}`);
    
    // Here we would send the on-chain transaction to create the Vote Receipt PDA
    // For the UI, we simulate the successful transaction:
    
    // 1. Add the active styling
    btnElement.classList.add('has-votes');
    
    // 2. Increment the visual counter
    const span = btnElement.querySelector('span');
    span.innerText = parseInt(span.innerText) + 1;
    
    // 3. Disable further clicks on this specific button for this session
    btnElement.style.pointerEvents = 'none';
    
    // Note: If you want to limit to ONE emoji total per clip (not one of each type),
    // you would select all siblings and disable them here.
  }

  // --- MICRO-DONATIONS (BLESSINGS) ---
  function sendBlessing(clipId) {
    if (!connectedWallet) {
      alert("Connect your wallet to bless this clip.");
      return;
    }

    // This is where the Jupiter V6 Swap / Direct Transfer logic lives
    console.log(`Initiating blessing for clip ${clipId} from wallet ${connectedWallet}`);
    
    const amount = prompt("Enter amount of SOL or USDC to bless:");
    if(amount && !isNaN(amount)) {
      alert(`Transaction sent! Blessing clip ${clipId} with ${amount}. Waiting for on-chain confirmation...`);
      // Execute Solana transaction here. On success, update the UI USD value.
    }
  }

  // --- HAMBURGER MENU LOGIC ---
  function toggleMenu() {
    document.getElementById('mobile-nav').classList.toggle('open');
  }

</script>
</body>
</html>
